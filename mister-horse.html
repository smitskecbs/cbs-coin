<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Mister Horse — FREE Mint (Devnet)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#0a0c10;--bg2:#0f141b;--card:#0f151c;--card2:#0c1016;--fg:#eafffb;--muted:#a8d6cd;--note:#7ee9dc;--ok:#24e6b5;--warn:#ffad7a;--shadow:0 20px 45px rgba(0,255,230,.08), inset 0 0 0 1px rgba(0,255,240,.10);--radius:18px}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:'Orbitron',sans-serif;color:var(--fg);background:
      radial-gradient(900px 600px at 100% -10%, rgba(0,255,230,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(0,170,255,.09), transparent 60%),
      linear-gradient(135deg,var(--bg1),var(--bg2));}
    .container{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2.2rem}
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid rgba(0,255,240,.14);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
    @media(min-width:980px){.col-6{grid-column:span 6}}
    h1{margin:.3rem 0 1rem;color:#bffef2;font-size:1.4rem}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-width:140px;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:900;font-size:.94rem;color:#001010;background:linear-gradient(180deg,#5afff0,#2bffe4);border:1px solid rgba(0,255,240,.7);box-shadow:0 0 12px rgba(0,255,230,.55),0 0 24px rgba(0,255,230,.25),inset 0 -8px 14px rgba(0,0,0,.14);cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted)} .ok{color:var(--ok)} .warn{color:var(--warn)}
    .mono{font-family:ui-monospace,Menlo,Monaco,Consolas,monospace}
    .top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>Mister Horse — FREE Mint (Devnet)</h1>
      <div class="row">
        <button id="connectBtn" class="btn">Wallet verbinden</button>
        <span id="walletStatus" class="muted">Niet verbonden</span>
      </div>
    </div>

    <div class="grid">
      <div class="card col-6">
        <h3>🎟️ Mint</h3>
        <div class="row" style="margin-top:10px;">
          <button id="mintBtn" class="btn" disabled>Mint NFT (FREE)</button>
          <button id="refreshBtn" class="btn">Verversen</button>
        </div>
        <p id="msg" class="muted" style="margin-top:8px;"></p>
      </div>

      <div class="card col-6">
        <h3>📊 Drop info</h3>
        <p><b>Candy Machine:</b> <span id="cmLbl" class="mono">—</span></p>
        <p><b>Gemintrd:</b> <span id="minted">…</span> / <span id="available">…</span></p>
        <p><b>Prijs:</b> <span id="price">FREE (+ tx fee)</span></p>
        <small class="muted">Op devnet. Je Phantom mag gewoon op Mainnet staan; de tx gaat naar de RPC die hieronder staat.</small>
      </div>
    </div>
  </div>

  <script type="module">
    // ====== Imports ======
    import { createUmi } from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";
    import { publicKey, generateSigner, transactionBuilder, some } from "https://esm.sh/@metaplex-foundation/umi@1.4.1";
    import { walletAdapterIdentity } from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1";
    import { mplCandyMachine, fetchCandyMachine, fetchCandyGuard, mintV2 } from "https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0";
    import { mplTokenMetadata } from "https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.2.0";
    import { setComputeUnitLimit } from "https://esm.sh/@metaplex-foundation/mpl-toolbox@0.10.1";
    import { PhantomWalletAdapter } from "https://esm.sh/@solana/wallet-adapter-phantom@0.9.25";

    // ====== Config via URL ======
    const qs    = new URLSearchParams(location.search);
    const CM    = qs.get("cm")  || "8ZQgf6goaJaqgB1rtPoVcLd2KEo359NKqwTK5UEk5v9s"; // jouw nieuwe CM
    const RPC   = qs.get("rpc") || "https://api.devnet.solana.com";
    const GROUP = qs.get("group") || ""; // leeg = default guard (FREE)

    // ====== UI helpers ======
    const $ = (id)=>document.getElementById(id);
    const fmt = (n)=>Number(n??0).toLocaleString("nl-NL");
    const note = (t,k="info")=>{ const el=$("msg"); if(!el) return; el.textContent=t||""; el.className= k==="ok"?"ok":k==="warn"?"warn":"muted"; }

    // ====== Umi & Wallet ======
    const umi = createUmi(RPC).use(mplCandyMachine()).use(mplTokenMetadata());
    let wallet, cmAcc, guardAcc, connected=false;

    async function connectWallet(){
      try{
        wallet = new PhantomWalletAdapter();
        await wallet.connect();
        umi.use(walletAdapterIdentity(wallet));
        connected = true;
        const pk = wallet.publicKey.toBase58();
        $("walletStatus").textContent = `Verbonden: ${pk.slice(0,6)}…${pk.slice(-6)}`;
        $("mintBtn").disabled = false;
        note("");
      }catch(e){ note("Verbinden mislukt.","warn"); }
    }

    async function refresh(){
      try{
        $("cmLbl").textContent = CM;
        cmAcc    = await fetchCandyMachine(umi, publicKey(CM));
        guardAcc = await fetchCandyGuard(umi, cmAcc.mintAuthority).catch(()=>null);

        const minted = Number(cmAcc.itemsRedeemed ?? cmAcc.itemsMinted ?? 0);
        const avail  = Number(cmAcc.itemsAvailable ?? 0);
        $("minted").textContent    = fmt(minted);
        $("available").textContent = fmt(avail);

        // prijs tonen (FREE tenzij er een solPayment guard is)
        let priceText = "FREE (+ tx fee)";
        if(guardAcc){
          const g = (guardAcc.groups||[]).find(x=>x.label===GROUP)?.guards || guardAcc.guards;
          const solG = g?.solPayment?.__option==="Some" ? g.solPayment.value : g?.solPayment;
          if(solG?.lamports !== undefined){
            priceText = (Number(solG.lamports)/1_000_000_000).toFixed(3) + " SOL";
          }
        }
        $("price").textContent = priceText;

        note("");
      }catch(e){ note("Candy Machine laden mislukt.","warn"); }
    }

    async function doMint(){
      try{
        if(!connected) return note("Verbind eerst je wallet.","warn");
        note("Mint wordt verzonden…");
        const nftMint = generateSigner(umi);

        const params = {
          candyMachine: publicKey(CM),
          nftMint,
          collectionMint: cmAcc.collectionMint,
          collectionUpdateAuthority: cmAcc.authority,
          mintArgs: {}
        };
        if(GROUP) params.group = some(GROUP); // alleen als je later labels gebruikt

        const tx = transactionBuilder()
          .add(setComputeUnitLimit(umi,{units:800_000}))
          .add(mintV2(umi, params));

        const sig = await tx.sendAndConfirm(umi);
        note(`Mint bevestigd ✅ ${sig}`,"ok");
        await refresh();
      }catch(e){
        // toon iets bruikbaars
        note("Mint mislukt. " + (e?.message || ""), "warn");
      }
    }

    $("connectBtn")?.addEventListener("click", connectWallet);
    $("refreshBtn")?.addEventListener("click", refresh);
    $("mintBtn")?.addEventListener("click", doMint);
    await refresh();
  </script>
</body>
</html>
