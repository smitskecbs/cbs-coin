<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CBS Coin — Holders Tree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A real photo tree that grows as CBS Coin holders increase." />
  <style>
    :root{
      --bg:#0b0d12; --ink:#f7f9fc; --muted:#9aa3b2; --accent:#7CFF6B; --line:#222a3b;
      --card:#121826; --accent2:#7be97f;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:#0b0d12; color:var(--ink);
      font:16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }
    header{
      position:relative; padding:16px; border-bottom:1px solid var(--line);
      background:linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,.6)), url('/banner.png') center/cover no-repeat;
    }
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:44px; height:44px; border-radius:10px; border:1px solid var(--line)}
    .brand h1{margin:0; font-size:22px; letter-spacing:.3px}
    .sub{color:var(--muted); font-size:13px}

    .wrap{max-width:1100px; margin:0 auto; padding:20px}
    .grid{display:grid; grid-template-columns:2fr 1fr; gap:20px}
    @media (max-width:940px){ .grid{grid-template-columns:1fr} }

    .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px}
    .stage{position:relative; height:520px; border-radius:12px; overflow:hidden;
      background:
        radial-gradient(800px 320px at 50% 100%, rgba(124,255,107,.08), transparent 60%),
        linear-gradient(0deg, #0d1420 0%, #0b0d12 35%);
      display:grid; place-items:end center;
    }
    .ground{position:absolute; inset:auto 0 0; height:110px;
      background:linear-gradient(180deg, rgba(44,63,42,.95), #142012 70%); border-top:1px solid rgba(124,255,107,.25)}
    .treephoto{max-height:420px; width:auto; object-fit:contain; filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
    .kpi{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
    .kpi .big{font-size:42px; font-weight:800; letter-spacing:-.02em}
    .progress{height:12px; border-radius:999px; background:#0e1422; border:1px solid #1f2740; overflow:hidden}
    .bar{height:100%; width:0%; background:linear-gradient(90deg, #30d158, #7be97f); transition:width .8s ease}
    .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0}
    .pill{padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:13px}
    .ok{color:#22c55e} .err{color:#ef4444}
    .actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
    .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px;
      border:1px solid var(--line); background:#111727; color:var(--ink); text-decoration:none; font-weight:700}
    .btn:hover{border-color:#2a3450}
    .meme{font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; letter-spacing:.5px}
    .meme-banner{position:absolute; top:14px; right:14px; background:#000; color:#fff; padding:6px 10px; border-radius:8px; font:700 14px/1 Impact, Arial, sans-serif; border:1px solid #333}
    .hint{color:var(--muted); font-size:12px; margin-top:6px}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="/logo.png" alt="CBS logo" />
        <div>
          <h1 class="meme">Holders Growth — The CBS Tree</h1>
          <div class="sub">Live from <code>/api/holders</code> • Goal: 1,000,000 holders</div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card">
      <div class="stage">
        <div class="meme-banner">GM BUILDERS 🌱🚀</div>
        <img id="treePhoto" class="treephoto" src="/tree_seed.png" alt="CBS Tree" />
        <div class="ground"></div>
      </div>
      <div class="hint" id="stageLabel">Stage: seed</div>
    </section>

    <aside class="card">
      <div class="kpi">
        <div class="big" id="holders">—</div><div>holders</div>
      </div>
      <div class="row">
        <div class="pill">Goal: <strong>1,000,000</strong></div>
        <div class="pill">Progress: <span id="pct">0%</span></div>
      </div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div class="row"><div class="sub">Next milestone</div><div class="sub" id="milestone">—</div></div>
      <div id="status" class="sub" style="margin-top:10px"></div>

      <div class="actions">
        <a class="btn" href="/">⬅ Home</a>
        <a class="btn" href="/api/holders" target="_blank" rel="noopener">🛰 View JSON</a>
      </div>
    </aside>
  </main>

  <script>
    // Als je deze pagina via GitHub Pages opent, bestaat /api/holders daar niet.
    // Zet hier je Vercel-domein zodra je dat weet.
    const VERCEL_ORIGIN = 'https://cbs-coin.vercel.app'; // pas aan indien anders
    const SAME_ORIGIN = location.hostname.endsWith('vercel.app') || location.hostname === 'localhost';
    const API_BASE = SAME_ORIGIN ? '' : VERCEL_ORIGIN;

    const GOAL = 1_000_000;
    const MILESTONES = [10,100,1_000,10_000,100_000,1_000_000];

    const el = {
      photo: document.getElementById('treePhoto'),
      holders: document.getElementById('holders'),
      pct: document.getElementById('pct'),
      bar: document.getElementById('bar'),
      milestone: document.getElementById('milestone'),
      status: document.getElementById('status'),
      stageLabel: document.getElementById('stageLabel')
    };

    function format(n){ try{ return new Intl.NumberFormat().format(n); }catch{ return String(n); } }
    function nextMilestone(n){ for(const m of MILESTONES) if(n<m) return m; return GOAL; }

    function stageFrom(n){
      if (n < 1) return 'seed';
      if (n < 10) return 'sprout';
      if (n < 1_000) return 'small';
      if (n < 10_000) return 'medium';
      if (n < 100_000) return 'big';
      return 'giant';
    }
    function photoFor(stage){
      switch(stage){
        case 'seed': return '/tree_seed.png';
        case 'sprout': return '/tree_sprout.png';
        case 'small': return '/tree_small.png';
        case 'medium': return '/tree_medium.png';
        case 'big': return '/tree_big.png';
        default: return '/tree_giant.png';
      }
    }

    async function load(){
      try{
        el.status.textContent = 'Fetching holders…';
        const res = await fetch(`${API_BASE}/api/holders`, {cache:'no-store'});
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data = await res.json();
        const total = Number(data?.totalHolders ?? 0);

        el.holders.textContent = format(total);
        const pct = Math.max(0, Math.min(100, (total/GOAL)*100));
        el.pct.textContent = pct.toFixed(2) + '%';
        el.bar.style.width = pct + '%';
        const nm = nextMilestone(total);
        el.milestone.textContent = total >= GOAL ? 'Goal reached!' : `${format(total)} → ${format(nm)} (${format(nm-total)} to go)`;

        const stage = stageFrom(total);
        el.stageLabel.textContent = 'Stage: ' + stage;
        const img = photoFor(stage);
        // preload + swap
        const preload = new Image();
        preload.onload = () => { el.photo.src = img; };
        preload.src = img;

        el.status.innerHTML = `<span class="ok">Live</span> — mint: <code>${data?.mint || ''}</code>`;
      }catch(err){
        el.status.innerHTML = `<span class="err">Error</span> — ${String(err.message || err)}`;
      }
    }

    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
