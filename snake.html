<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBS Snake Game</title>

  <!-- Content Security Policy (simpeler, geen Supabase / Solana meer) -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          connect-src 'self';
          img-src 'self' data: https://cyan-persistent-stork-902.mypinata.cloud;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src https://fonts.gstatic.com;
          object-src 'none';
          base-uri 'none';
          frame-ancestors 'self';
          form-action 'self';
          upgrade-insecure-requests;
        ">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#02040a; --bg2:#05040f;
      --card:#05070f; --card2:#040309;
      --fg:#fffaf0; --muted:#d2c9aa; --note:#ffe7b8;
      --accent1:#ffd86b; --accent2:#ffcc33;
      --line:rgba(255,216,107,.25);
      --shadow:0 20px 45px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,216,107,.20);
      --radius:18px;
      --glowBtnA:#ffefb0; --glowBtnB:#e2b542;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Orbitron',sans-serif;
      color:var(--fg);
      background:
        radial-gradient(900px 600px at 100% -10%, rgba(255,216,107,.10), transparent 60%),
        radial-gradient(700px 500px at -10% 110%, rgba(255,140,80,.10), transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
    }

    /* In play-mode verstoppen we header & control panel */
    body.play-mode header,
    body.play-mode #controlsPanel{ display:none; }

    header{
      width:100%;
      max-width:900px;
      display:flex;
      align-items:center;
      gap:.9rem;
      margin:10px auto 14px;
      padding:12px 16px;
      background:linear-gradient(180deg, rgba(10,8,0,.7), rgba(5,3,0,.45));
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(6px);
    }
    header img{
      height:44px;
      width:auto;
      border-radius:10px;
      filter:drop-shadow(0 0 14px rgba(255,216,107,.6));
    }
    h1{
      margin:0;
      font-size:clamp(1.4rem,3.3vw,2.1rem);
      color:#ffefb0;
      text-shadow:0 0 12px rgba(255,216,107,.7);
    }

    .panel{
      width:100%;
      max-width:900px;
      background:linear-gradient(180deg, var(--card), var(--card2));
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      margin:12px auto;
      box-shadow:var(--shadow);
      backdrop-filter: blur(6px);
    }
    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .muted{color:var(--muted)}

    .btn{
      background:linear-gradient(180deg, var(--glowBtnA), var(--glowBtnB));
      color:#3a2600;
      cursor:pointer;
      border:none;
      border-radius:12px;
      padding:.9rem 1.35rem;
      font-weight:900;
      letter-spacing:.3px;
      border:1px solid rgba(255,216,107,.9);
      box-shadow:
        0 0 12px rgba(255,216,107,.65),
        0 0 26px rgba(255,216,107,.35),
        inset 0 -8px 14px rgba(0,0,0,.22);
      transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
      white-space:nowrap;
    }
    .btn:hover{
      transform:translateY(-2px) scale(1.03);
      box-shadow:
        0 0 18px rgba(255,216,107,.9),
        0 0 36px rgba(255,216,107,.45);
    }
    .btn:active{ transform:translateY(0) scale(.99) }
    .btn[disabled]{opacity:.6;cursor:not-allowed;filter:saturate(.7)}

    #gameWrap{
      max-width:520px;
      margin:10px auto;
    }
    canvas{
      display:block;
      margin:0 auto;
      border:1px solid rgba(255,216,107,.35);
      width:100%;
      max-width:520px;
      height:auto;
      background:#000;
      border-radius:14px;
      box-shadow:
        0 0 26px rgba(0,0,0,.9),
        0 0 22px rgba(255,216,107,.25),
        inset 0 0 0 1px rgba(255,216,107,.16);
      touch-action:none;
    }

    h2{margin:.2rem 0 .6rem; color:#ffefb0}

    /* GAME OVER OVERLAY */
    #gameOverOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
      backdrop-filter: blur(3px);
    }
    #gameOverCard{
      width:min(92vw,480px);
      background:linear-gradient(180deg, #05070f, #040309);
      border:1px solid rgba(255,216,107,.9);
      border-radius:16px;
      padding:18px 18px 16px;
      box-shadow:
        0 20px 45px rgba(0,0,0,.95),
        inset 0 0 0 1px rgba(255,216,107,.35);
      text-align:center;
    }
    #gameOverCard h3{
      margin:.1rem 0 .4rem;
      font-size:1.1rem;
      color:#ffefb0;
      text-shadow:0 0 12px rgba(255,216,107,.8);
    }
    #gameOverCard p{
      margin:.25rem 0;
      font-size:.9rem;
      color:var(--fg);
    }
    #gameOverCard .score{
      font-size:1rem;
      color:#ffefb0;
    }

    /* D-PAD MOBIEL */
    #dpad{
      position:static;
      display:none;
      justify-content:center;
      margin-top:12px;
    }
    #dpad .pad{
      display:grid;
      grid-template-columns:64px 64px 64px;
      grid-template-rows:64px 64px 64px;
      gap:12px;
      opacity:.7;
      filter:drop-shadow(0 0 8px rgba(255,216,107,.65));
    }
    #dpad button{
      pointer-events:auto;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,216,107,.65);
      color:#ffeec4;
      border-radius:15px;
      backdrop-filter:blur(3px);
      font-weight:800;
      font-size:1rem;
      box-shadow:0 8px 18px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,216,107,.25);
    }
    #dpad button:active{
      background:rgba(255,216,107,.22);
    }
    @media (max-width:680px){
      #dpad{display:flex}
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cyan-persistent-stork-902.mypinata.cloud/ipfs/bafybeia7qejzloll6teyt4o4orvd7bnvkg4thrfajv4rgb3fmm2odeweoa/logo.png" alt="CBS" />
    <h1>CBS Snake Game</h1>
  </header>

  <!-- Controls: alleen een Start-knop + uitleg -->
  <div id="controlsPanel" class="panel">
    <div class="row" style="justify-content:center;margin-bottom:.3rem">
      <button id="startBtn" class="btn">▶️ Start Game</button>
    </div>
    <p class="muted" style="text-align:center;margin:.2rem 0 0 0">
      Use the arrow keys (desktop) or the golden D-pad (mobile) to move the snake.<br>
      Eat the golden coins, avoid biting your own tail. Good luck, Chainbreaker 🐍✨
    </p>
  </div>

  <!-- Game panel -->
  <div class="panel" id="gamePanel">
    <div id="gameWrap">
      <canvas id="gameCanvas" width="420" height="420"></canvas>

      <!-- D-pad voor mobiel -->
      <div id="dpad" aria-label="On-screen controls">
        <div class="pad">
          <div></div>     <button data-dir="UP">▲</button>     <div></div>
          <button data-dir="LEFT">◄</button> <div></div> <button data-dir="RIGHT">►</button>
          <div></div>     <button data-dir="DOWN">▼</button>   <div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game over overlay (geen scorebord, alleen score + knoppen) -->
  <div id="gameOverOverlay">
    <div id="gameOverCard">
      <h3>Game over 🎄</h3>
      <p class="score">Your score: <span id="finalScore">0</span></p>
      <p class="muted">Tap <b>Play again</b> to try and beat your high score.</p>
      <div style="margin-top:.9rem; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="playAgainBtn" class="btn">🔁 Play again</button>
        <button id="closeBtn" class="btn" style="background:#31200c;color:#ffeec4;border:1px solid rgba(255,216,107,.5);">
          ⏹ Close
        </button>
      </div>
    </div>
  </div>

  <!-- PURE JS: Snake game, zonder Supabase/wallet -->
  <script>
    /******** DOM ********/
    const canvas     = document.getElementById("gameCanvas");
    const ctx        = canvas.getContext("2d");
    const startBtn   = document.getElementById("startBtn");
    const gameWrap   = document.getElementById("gameWrap");

    const dpadButtons = document.querySelectorAll("#dpad button");

    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const finalScoreEl    = document.getElementById("finalScore");
    const playAgainBtn    = document.getElementById("playAgainBtn");
    const closeBtn        = document.getElementById("closeBtn");

    /******** GAME ********/
    const box = 20;
    let snake, direction, food, score, loopId;

    // Gouden CBS-logo als zachte watermark / power-up basis
    const watermark = new Image();
    watermark.crossOrigin = "anonymous";
    watermark.src = "https://cyan-persistent-stork-902.mypinata.cloud/ipfs/bafybeia7qejzloll6teyt4o4orvd7bnvkg4thrfajv4rgb3fmm2odeweoa/logo.png";

    const BONUS_POINTS = 10;
    let powerUp = null;        // {x,y}
    let coinsEaten = 0;
    let powerUpTimeout = null;
    const powerUpImg = new Image();
    powerUpImg.crossOrigin = "anonymous";
    powerUpImg.src = watermark.src;
    let powerUpImgOk = false;
    powerUpImg.onload  = ()=>{ powerUpImgOk = powerUpImg.naturalWidth > 0; };
    powerUpImg.onerror = ()=>{ powerUpImgOk = false; };

    function randCell(){
      return {
        x: Math.floor(Math.random()*(canvas.width/box))*box,
        y: Math.floor(Math.random()*(canvas.height/box))*box
      };
    }
    function randCell2x(){
      const cols = Math.floor(canvas.width/box) - 1;
      const rows = Math.floor(canvas.height/box) - 1;
      return {
        x: Math.floor(Math.random()*cols)*box,
        y: Math.floor(Math.random()*rows)*box
      };
    }

    function initGame(){
      snake=[{x:10*box,y:10*box}];
      direction=null;
      food=randCell();
      score=0;
      coinsEaten=0;
      powerUp=null;
      if (powerUpTimeout){
        clearTimeout(powerUpTimeout);
        powerUpTimeout=null;
      }
      drawFrame();
    }

    function start(){
      clearInterval(loopId);
      initGame();
      loopId=setInterval(tick,100);
      document.body.classList.add("play-mode");
      scrollToGame();
    }

    function stop(){
      clearInterval(loopId);
      if (powerUpTimeout){
        clearTimeout(powerUpTimeout);
        powerUpTimeout=null;
      }
    }

    /* --- Gouden segmenten --- */
    function drawSegmentCircle(x,y,isHead=false){
      ctx.save();
      ctx.shadowColor = "rgba(255,216,107,.95)";
      ctx.shadowBlur = 18;

      const cx = x + box/2;
      const cy = y + box/2;
      const r  = box/2.3;
      const g  = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
      g.addColorStop(0, "#fff7da");
      g.addColorStop(0.5, "#ffd86b");
      g.addColorStop(1, "#ffb52e");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();

      ctx.shadowBlur = 0;

      if(isHead){
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x + box*0.65, y + box*0.35, 3, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }

    /* --- Gouden coin (eten) --- */
    function drawCoin(x,y,s){
      ctx.save();
      const r = s/2;
      const cx = x + r;
      const cy = y + r;

      ctx.shadowColor = "#ffd54d";
      ctx.shadowBlur  = 16;
      const g=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r);
      g.addColorStop(0,"#fff3c4");
      g.addColorStop(0.4,"#ffe082");
      g.addColorStop(0.8,"#ffc107");
      g.addColorStop(1,"#ffb300");
      ctx.beginPath();
      ctx.arc(cx,cy,r-2,0,Math.PI*2);
      ctx.fillStyle=g;
      ctx.fill();

      ctx.shadowBlur=0;
      ctx.lineWidth=2;
      ctx.strokeStyle="rgba(255,255,255,.55)";
      ctx.stroke();
      ctx.restore();
    }

    /* --- Power-up (CBS-plakkaat) --- */
    function drawPowerUp(x,y){
      if (powerUpImgOk && powerUpImg.complete && powerUpImg.naturalWidth>0){
        try{
          ctx.save();
          ctx.shadowColor = "rgba(255,216,107,.95)";
          ctx.shadowBlur = 16;
          ctx.drawImage(powerUpImg, x, y, box*2, box*2);
          ctx.restore();
        }catch(e){
          powerUpImgOk = false;
          ctx.save();
          ctx.fillStyle = "rgba(255,216,107,.8)";
          ctx.fillRect(x, y, box*2, box*2);
          ctx.restore();
        }
      } else {
        ctx.save();
        ctx.fillStyle = "rgba(255,216,107,.8)";
        ctx.fillRect(x, y, box*2, box*2);
        ctx.restore();
      }
    }

    function drawFrame(){
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // zachte gouden CBS watermark
      if (watermark.complete && watermark.naturalWidth>0){
        const w=canvas.width*0.75;
        const h=w;
        ctx.save();
        ctx.globalAlpha=0.08;
        ctx.drawImage(watermark,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
        ctx.restore();
      }

      // coin + power-up
      drawCoin(food.x, food.y, box);
      if(powerUp) drawPowerUp(powerUp.x, powerUp.y);

      // slang
      for(let i=snake.length-1;i>=0;i--){
        drawSegmentCircle(snake[i].x,snake[i].y,i===0);
      }

      // score
      ctx.save();
      ctx.font="18px Orbitron";
      ctx.fillStyle="#fffaf0";
      ctx.shadowColor="rgba(255,216,107,.9)";
      ctx.shadowBlur=10;
      ctx.fillText("Score: "+score, box, 22);
      ctx.restore();
    }

    function tick(){
      let x=snake[0].x;
      let y=snake[0].y;

      if(direction==="LEFT")  x-=box;
      if(direction==="UP")    y-=box;
      if(direction==="RIGHT") x+=box;
      if(direction==="DOWN")  y+=box;

      const W=canvas.width, H=canvas.height;
      // doorlopen aan de randen
      if(x<0)      x=W-box;
      else if(x>=W)x=0;
      if(y<0)      y=H-box;
      else if(y>=H)y=0;

      // Coin
      if(x===food.x && y===food.y){
        score++;
        coinsEaten++;
        food=randCell();

        // elke 5 coins: power-up
        if(coinsEaten % 5 === 0){
          powerUp = randCell2x();
          if (powerUpTimeout){
            clearTimeout(powerUpTimeout);
          }
          powerUpTimeout = setTimeout(()=>{
            powerUp=null;
            powerUpTimeout=null;
          }, 5000);
        }
      }
      // power-up geraakt
      else if(
        powerUp &&
        x >= powerUp.x && x < powerUp.x + box*2 &&
        y >= powerUp.y && y < powerUp.y + box*2
      ){
        score += BONUS_POINTS;
        powerUp = null;
        if (powerUpTimeout){
          clearTimeout(powerUpTimeout);
          powerUpTimeout=null;
        }
      }
      else{
        snake.pop();
      }

      // check zelf-bijt
      if(snake.some(s=>s.x===x&&s.y===y)){
        stop();
        drawFrame();
        openGameOver(score);
        return;
      }

      snake.unshift({x,y});
      drawFrame();
    }

    /******** INPUT ********/
    document.addEventListener("keydown", e=>{
      if(e.key==="ArrowLeft" && direction!=="RIGHT") direction="LEFT";
      else if(e.key==="ArrowUp" && direction!=="DOWN") direction="UP";
      else if(e.key==="ArrowRight"&& direction!=="LEFT") direction="RIGHT";
      else if(e.key==="ArrowDown" && direction!=="UP") direction="DOWN";
    });

    dpadButtons.forEach(b=>{
      const set=(d)=>{
        if(d==="LEFT" && direction!=="RIGHT") direction="LEFT";
        if(d==="RIGHT"&& direction!=="LEFT")  direction="RIGHT";
        if(d==="UP"   && direction!=="DOWN")  direction="UP";
        if(d==="DOWN" && direction!=="UP")    direction="DOWN";
      };
      b.addEventListener("click",()=> set(b.dataset.dir));
      b.addEventListener("touchstart",e=>{
        e.preventDefault();
        set(b.dataset.dir);
      },{passive:false});
    });

    /******** VIEW ********/
    function scrollToGame(){
      requestAnimationFrame(()=>{
        canvas.scrollIntoView({ block: "center", behavior: "smooth" });
        setTimeout(()=>{
          const y = gameWrap.getBoundingClientRect().top + window.scrollY - 8;
          window.scrollTo({ top: y, behavior: "smooth" });
        }, 220);
      });
    }

    function openGameOver(sc){
      finalScoreEl.textContent = sc;
      gameOverOverlay.style.display = "flex";
    }

    function closeGameOver(){
      gameOverOverlay.style.display = "none";
    }

    /******** BUTTON EVENTS ********/
    startBtn.addEventListener("click", ()=>{
      closeGameOver();
      start();
    });

    playAgainBtn.addEventListener("click", ()=>{
      closeGameOver();
      start();
    });

    closeBtn.addEventListener("click", ()=>{
      closeGameOver();
      document.body.classList.remove("play-mode");
    });

    // init eerste frame
    initGame();
    drawFrame();
  </script>
</body>
</html>
