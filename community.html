<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CBS Community — Chat & Webcam</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0c10; --fg:#eafffb; --muted:#a8d6cd; --line:rgba(0,255,240,.18);
      --btnA:#5afff0; --btnB:#2bffe4; --card:#0f151c; --card2:#0c1016;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:'Orbitron',sans-serif; background:linear-gradient(135deg,#0a0c10,#0f141b); color:var(--fg)}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:36px;height:36px;border-radius:8px;filter:drop-shadow(0 0 8px rgba(0,255,230,.35))}
    .badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#0c1117;color:#bffef2}
    .wrap{max-width:1100px;margin:16px auto;padding:0 16px}
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 45px rgba(0,255,230,.08), inset 0 0 0 1px rgba(0,255,240,.06)}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;border:1px solid rgba(0,255,240,.7);
         background:linear-gradient(180deg,var(--btnA),var(--btnB));color:#012022;font-weight:900;text-decoration:none;cursor:pointer}
    .btn.secondary{background:#0f151c;color:#bffef2;border-color:var(--line)}
    .btn.danger{background:#2b1116;color:#ffd2d6;border-color:#762e3a}
    #stage{aspect-ratio:16/9;width:100%;min-height:60vh;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
    input[type="text"]{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f151c;color:#f0ffff}
    small.muted{color:var(--muted)}
    footer{margin:20px auto 36px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a class="btn secondary" href="index.html">← Home</a>
      <img src="logo.png" alt="CBS Logo" onerror="this.src='image/logo.png'">
      <span class="badge">CBS Community — Live Chat</span>
    </div>
    <div class="controls">
      <input id="displayName" type="text" placeholder="Your name (optional)"/>
      <button id="joinBtn" class="btn">Join room</button>
      <button id="leaveBtn" class="btn danger" style="display:none">Leave</button>
    </div>
  </header>

  <main class="wrap">
    <div class="card" style="margin-bottom:12px">
      <div class="controls">
        <button id="toggleCam" class="btn secondary" disabled>Toggle Camera</button>
        <button id="toggleMic" class="btn secondary" disabled>Toggle Mic (muted by default)</button>
        <button id="raiseHand" class="btn" disabled>Request to speak ✋</button>
        <span class="badge">All mics start muted. Use ✋ to ask for the word.</span>
      </div>
      <small class="muted">Tip: gebruik een headset. Chat open je via de knop in de player.</small>
    </div>

    <div id="stage" class="card"></div>
  </main>

  <footer>Community Builds Sovereignty · Chat & Webcam</footer>

  <!-- Jitsi External API -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    // === Basic settings ===
    const ROOM_NAME = "CBSCommunityChat"; // wil je per dag? bv: "CBS-"+new Date().toISOString().slice(0,10)
    const JITSI_DOMAIN = "meet.jit.si";
    let api = null;
    let joined = false;

    // UI refs
    const joinBtn   = document.getElementById('joinBtn');
    const leaveBtn  = document.getElementById('leaveBtn');
    const toggleCam = document.getElementById('toggleCam');
    const toggleMic = document.getElementById('toggleMic');
    const raiseHand = document.getElementById('raiseHand');
    const nameInput = document.getElementById('displayName');
    const stage     = document.getElementById('stage');

    function enableControls(on){
      toggleCam.disabled = !on;
      toggleMic.disabled = !on;
      raiseHand.disabled = !on;
    }

    function joinRoom(){
      if (joined) return;
      const userName = (nameInput.value || "CBS Member").replace(/[^ -~]/g,"");

      const options = {
        roomName: ROOM_NAME,
        parentNode: stage,
        width: "100%",
        height: stage.clientHeight || 600,
        interfaceConfigOverwrite: {
          // Toon handige knoppen, chat en hand-raise
          // (de toolbar in de embedded UI blijft beschikbaar)
        },
        configOverwrite: {
          prejoinConfig: { enabled: true },
          startWithAudioMuted: true,
          startWithVideoMuted: true,  // camera uit bij start
          disableDeepLinking: true,
        },
        userInfo: { displayName: userName }
      };

      api = new JitsiMeetExternalAPI(JITSI_DOMAIN, options);

      // Zorg dat we gemuted starten (failsafe)
      api.addEventListener('videoConferenceJoined', () => {
        joined = true;
        api.executeCommand('toggleAudio'); // mics default muted; if not muted, toggle
        api.isAudioMuted().then(m => { if(!m) api.executeCommand('toggleAudio'); });
        enableControls(true);
        joinBtn.style.display = "none";
        leaveBtn.style.display = "inline-flex";
      });

      api.addEventListener('readyToClose', () => { leaveRoom(); });

      // Optioneel: laat bij raise-hand een chat bericht achter
      raiseHand.addEventListener('click', () => {
        api.executeCommand('toggleRaiseHand');
        api.executeCommand('sendChatMessage', '✋ Request to speak, please.');
      });

      toggleCam.addEventListener('click', () => api.executeCommand('toggleVideo'));
      toggleMic.addEventListener('click', () => api.executeCommand('toggleAudio'));
    }

    function leaveRoom(){
      try { api && api.dispose(); } catch(e){}
      api = null; joined = false;
      enableControls(false);
      joinBtn.style.display = "inline-flex";
      leaveBtn.style.display = "none";
      // Cleanup stage
      stage.innerHTML = "";
      const holder = document.createElement('div');
      holder.style.width = "100%";
      holder.style.minHeight = "60vh";
      stage.appendChild(holder);
    }

    joinBtn.addEventListener('click', joinRoom);
    leaveBtn.addEventListener('click', leaveRoom);
    enableControls(false);
  </script>
</body>
</html>
