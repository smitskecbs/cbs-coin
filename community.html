<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBS Coin – Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0a0c10; --bg2:#0f141b;
      --card:#0f151c; --card2:#0c1016;
      --fg:#eafffb; --muted:#a8d6cd; --note:#7ee9dc;
      --accent:#5afff0; --accent2:#2bffe4;
      --shadow: 0 20px 45px rgba(0,255,230,.08), inset 0 0 0 1px rgba(0,255,240,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:'Orbitron',sans-serif;color:var(--fg);
      background:
        radial-gradient(900px 600px at 100% -10%, rgba(0,255,230,.10), transparent 60%),
        radial-gradient(700px 500px at -10% 110%, rgba(0,170,255,.09), transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:inherit}

    /* Header */
    .topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid rgba(0,255,240,.08);background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0));backdrop-filter:blur(6px)}
    .brand{display:flex;gap:.7rem;align-items:center}
    .brand img{width:38px;height:38px;border-radius:10px;filter:drop-shadow(0 0 10px rgba(0,255,230,.35))}
    .brand strong{color:#bffef2;letter-spacing:.4px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:900;font-size:.94rem;color:#001010;background:linear-gradient(180deg,var(--accent),var(--accent2));border:1px solid rgba(0,255,240,.7);box-shadow:0 0 12px rgba(0,255,230,.55),0 0 24px rgba(0,255,230,.25),inset 0 -8px 14px rgba(0,0,0,.14);transition:transform .15s ease, box-shadow .15s ease}
    .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 16px rgba(0,255,230,.75),0 0 32px rgba(0,255,230,.35)}
    #langSwitch{background:linear-gradient(180deg,#7dffe9,#55f1e7);color:#012022;font-weight:900;border:1px solid rgba(0,255,240,.45);padding:.55rem .9rem;border-radius:12px;cursor:pointer;box-shadow:0 8px 18px rgba(0,255,230,.18), inset 0 -6px 10px rgba(0,0,0,.15)}

    /* Layout */
    .container{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2.2rem}
    .hero{display:grid;grid-template-columns:120px 1fr;gap:1.2rem;align-items:center;padding:1.2rem;margin:10px auto 18px;border-radius:var(--radius);background:linear-gradient(180deg, rgba(10,20,24,.55), rgba(10,20,24,.35));border:1px solid rgba(0,255,240,.18);box-shadow:var(--shadow)}
    .logo-wrap{position:relative;width:120px;height:120px;border-radius:16px;overflow:hidden;background:radial-gradient(closest-side, rgba(0,255,230,.18), rgba(0,255,230,.04) 58%, transparent 62%);display:grid;place-items:center}
    .logo-wrap::after{content:"";position:absolute;inset:-8%;border-radius:18px;box-shadow:0 0 0 2px rgba(0,255,230,.18), inset 0 0 30px rgba(0,255,230,.14);pointer-events:none}
    .logo{width:86%;height:86%;object-fit:contain}
    .hero h2{margin:.15rem 0 0;color:var(--note);font-size:1.05rem;font-weight:600}
    .hero p{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}

    /* Sections */
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid rgba(0,255,240,.14);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
    .tiles{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
    .tile{grid-column:span 12;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:linear-gradient(180deg,#081015,#0a1118);border:1px solid rgba(0,255,240,.16);box-shadow:inset 0 0 0 1px rgba(0,255,240,.05),0 8px 18px rgba(0,255,230,.08)}
    .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid rgba(0,255,240,.12)}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .title{margin:0;color:#d9fffb;font-size:1rem}
    .muted{color:var(--muted)}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{display:inline-block;padding:2px 6px;border-radius:8px;border:1px solid rgba(0,255,240,.18);color:var(--muted);font-size:12px}
    .trophy{position:absolute;top:8px;left:8px;background:linear-gradient(180deg,#f8e28a,#caa94b);color:#2b220d;border:1px solid #a58534;border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:800}
    .thumbWrap{position:relative}

    .filters{display:flex;gap:8px;flex-wrap:wrap}
    .seg{display:inline-flex;background:linear-gradient(180deg,#0d1218,#0a1016);border:1px solid rgba(0,255,240,.16);border-radius:12px;padding:4px}
    .seg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
    .seg button.active{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#001010}

    footer{margin:24px auto 40px;text-align:center;color:var(--muted)}
    footer a{color:#79ffee;text-decoration:none}
    footer a:hover{text-decoration:underline}

    @media(min-width:640px){ .tile{grid-column:span 6} }
    @media(min-width:980px){ .tile{grid-column:span 4} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="https://smitskecbs.github.io/cbs-coin" style="display:flex;align-items:center;gap:.7rem;text-decoration:none">
        <img src="logo.png" alt="CBS Logo"><strong>CBS Coin</strong>
      </a>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn" href="https://smitskecbs.github.io/cbs-coin">← Home</a>
      <button id="langSwitch">NL 🇳🇱</button>
    </div>
  </header>

  <div class="container">
    <section class="hero">
      <div class="logo-wrap"><img class="logo" src="logo.png" alt="CBS Logo"></div>
      <div>
        <h2 id="hTitle">Community</h2>
        <p id="hSub">Winners, memes and creations from the CBS army.</p>
      </div>
    </section>

    <!-- Winners -->
    <section class="card">
      <h3 id="winHead" style="margin:.2rem 0 .6rem">🏆 Winners</h3>
      <div class="tiles" id="winners"></div>
    </section>

    <!-- Gallery controls -->
    <section class="card">
      <div class="filters" style="justify-content:space-between;align-items:center">
        <div class="seg">
          <button id="btnBest" class="active">Best</button>
          <button id="btnAll">All</button>
        </div>
        <div class="muted" id="countTxt"></div>
      </div>
      <div class="tiles" id="gallery" style="margin-top:12px"></div>
    </section>

    <footer>
      Join the community:
      <a href="https://t.me/CBS_Coin" target="_blank" rel="noopener">Telegram</a> ·
      <a href="https://x.com/CBS_Coin" target="_blank" rel="noopener">X (Twitter)</a>
    </footer>
  </div>

  <script>
    // ===== Data (edit this) =====
    const SUBMISSIONS = [
      { id:'w1', title:'Mini Meme Contest #1', author:'@maestropicknava', authorUrl:'https://x.com/maestropicknava', url:'https://x.com/i/status/1961731121353216216', thumb:'logo.png', tags:['winner','meme'], date:'2025-08-30', score:100, winner:true, best:true },
      { id:'g2', title:'CBS Runner', author:'@solsprinter', authorUrl:'#', url:'#', thumb:'logo.png', tags:['meme'], date:'2025-09-03', score:94, best:true },
      { id:'g3', title:'Chain Breaker Poster', author:'@adje', authorUrl:'#', url:'#', thumb:'logo.png', tags:['poster'], date:'2025-09-02', score:91 },
    ];

    // ===== Elements =====
    const winnersEl = document.getElementById('winners');
    const galleryEl = document.getElementById('gallery');
    const btnBest = document.getElementById('btnBest');
    const btnAll = document.getElementById('btnAll');
    const countTxt = document.getElementById('countTxt');
    const langBtn = document.getElementById('langSwitch');

    // ===== Language =====
    const LANG_KEY='cbs_lang';
    let currentLang = localStorage.getItem(LANG_KEY) || 'en';
    const dict = {
      en: { community:'Community', sub:'Winners, memes and creations from the CBS army.', winners:'🏆 Winners', best:'Best', all:'All', open:'Open', of:'of' },
      nl: { community:'Community', sub:'Winnaars, memes en creaties van het CBS-leger.', winners:'🏆 Winnaars', best:'Beste', all:'Alles', open:'Openen', of:'van' }
    };
    function t(k){ return (dict[currentLang]||dict.en)[k] || k }
    function applyLang(){
      document.getElementById('hTitle').textContent = t('community');
      document.getElementById('hSub').textContent = t('sub');
      document.getElementById('winHead').textContent = t('winners');
      btnBest.textContent = t('best');
      btnAll.textContent = t('all');
      langBtn.textContent = currentLang==='en' ? 'NL 🇳🇱' : 'EN 🇬🇧';
    }
    langBtn.addEventListener('click',()=>{ currentLang = currentLang==='en'?'nl':'en'; localStorage.setItem(LANG_KEY,currentLang); applyLang(); render(); window.scrollTo({top:0,behavior:'smooth'}); });

    // ===== Render =====
    function imgTag(src, alt){ return `<img class="thumb" src="${src}" alt="${alt}" onerror="this.onerror=null;this.src='logo.png'"/>`; }
    function card(item){
      const dest = item.url || item.authorUrl || '#';
      return `
        <article class="tile">
          <div class="thumbWrap">
            ${imgTag(item.thumb||'logo.png', item.title)}
            ${item.winner?'<div class="trophy">🏆</div>':''}
          </div>
          <div class="meta">
            <div>
              <h4 class="title">${escapeHtml(item.title)}</h4>
              <div class="muted">${escapeHtml(item.author||'')} ${item.date?`• ${item.date}`:''}</div>
              <div class="tags">${(item.tags||[]).map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join('')}</div>
            </div>
            <a class="btn" href="${dest}" target="_blank" rel="noopener">${t('open')}</a>
          </div>
        </article>`
    }

    function renderWinners(){
      const wins = SUBMISSIONS.filter(s=>s.winner);
      winnersEl.innerHTML = wins.length ? wins.map(card).join('') : `<div class="muted">—</div>`;
    }

    let showBest = true;
    function renderGallery(){
      const list = SUBMISSIONS
        .filter(s=> showBest ? s.best : true)
        .sort((a,b)=> (b.score||0)-(a.score||0) || (b.date||'').localeCompare(a.date||''));
      galleryEl.innerHTML = list.length ? list.map(card).join('') : `<div class="muted">—</div>`;
      const total = SUBMISSIONS.length; const shown = list.length;
      countTxt.textContent = `${shown} ${t('of')} ${total}`;
    }

    btnBest.addEventListener('click',()=>{ showBest=true; btnBest.classList.add('active'); btnAll.classList.remove('active'); renderGallery(); });
    btnAll.addEventListener('click',()=>{ showBest=false; btnAll.classList.add('active'); btnBest.classList.remove('active'); renderGallery(); });

    // utils
    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

    function render(){ renderWinners(); renderGallery(); }

    // init
    applyLang();
    render();
  </script>
</body>
</html>
