<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CBS Jungle Monkey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root{
      --bg1:#0a1210;
      --bg2:#041807;
      --fg:#fefbe8;
      --ground:#3b2613;
      --grass:#1f6b26;
      --monkey-body:#c46b32;
      --monkey-face:#f1c58a;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(circle at top,#144b2a 0,#020b08 55%,#000 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui, sans-serif;
      color:var(--fg);
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    canvas{
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      width:960px;   /* 320x3 */
      height:540px;  /* 180x3 */
      border-radius:12px;
      border:2px solid #2cff9b33;
      box-shadow:0 0 40px rgba(0,0,0,.9),0 0 24px rgba(47,255,155,.25);
      background:#000;
    }

    .hud{
      text-align:center;
      font-size:14px;
      color:#d9fdd2;
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:center;
    }
    .hud b{color:#9dff7a}

    .hud-controls{
      font-size:13px;
    }

    .hud-row{
      display:flex;
      gap:16px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:center;
    }

    button#startBtn{
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #2cff9b66;
      background:#061b12;
      color:#e9ffe0;
      cursor:pointer;
      font-size:13px;
      box-shadow:0 0 10px rgba(0,0,0,.6);
    }
    button#startBtn:hover{
      background:#0b2b1b;
    }
    #secretStatus b{
      color:#ffd86b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="320" height="180"></canvas>
    <div class="hud">
      <div class="hud-controls">
        Controls: <b>← →</b> / <b>A D</b> lopen – <b>↑</b> of <b>SPACE</b> springen –
        <b>↓</b>/<b>S</b> pipe – <b>↑/↓</b> op lianen klimmen
      </div>
      <div>Doel: bereik het einde, verzamel bananen & CBS-coins, ontwijk slangen & vind de geheime CBS-idol 🐒🌴</div>
      <div class="hud-row">
        <button id="startBtn">Reset level</button>
        <div id="secretStatus">Geheim: <b>nog niet gevonden</b></div>
      </div>
      <div id="collectStatus">Bananen: 0/0 – CBS-coins: 0/0</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx    = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const secretStatusEl = document.getElementById("secretStatus");
    const collectStatusEl = document.getElementById("collectStatus");

    // ===== Wereld instellingen =====
    const TILE_SIZE = 16;
    const WORLD_WIDTH  = 200;
    const WORLD_HEIGHT = 12;

    // Vuurvliegjes
    const FIREFLY_COUNT = 30;
    const fireflies = [];
    let fireflyTime = 0;

    const TILE_EMPTY    = 0;
    const TILE_GROUND   = 1;
    const TILE_GRASS    = 2;
    const TILE_PIPE     = 3;
    const TILE_BLOCK    = 4;
    const TILE_VINE     = 5;

    const world = [];
    for(let y=0;y<WORLD_HEIGHT;y++){
      world[y] = [];
      for(let x=0;x<WORLD_WIDTH;x++){
        world[y][x] = TILE_EMPTY;
      }
    }

    const GROUND_LEVEL = WORLD_HEIGHT - 2;

    function addGroundStrip(xStart, xEnd){
      for(let x=xStart;x<=xEnd;x++){
        if(x<0 || x>=WORLD_WIDTH) continue;
        world[GROUND_LEVEL][x]   = TILE_GRASS;
        world[GROUND_LEVEL+1][x] = TILE_GROUND;
      }
    }

    function carveHole(startX, width){
      for(let x=startX;x<startX+width;x++){
        if(x<0 || x>=WORLD_WIDTH) continue;
        world[GROUND_LEVEL][x]   = TILE_EMPTY;
        world[GROUND_LEVEL+1][x] = TILE_EMPTY;
      }
    }

    function addPlatform(x,y,length){
      for(let i=0;i<length;i++){
        const tx = x+i;
        if(tx<0 || tx>=WORLD_WIDTH) continue;
        world[y][tx] = TILE_GRASS;
      }
    }

    function addBlockRow(x,y,length){
      for(let i=0;i<length;i++){
        const tx = x+i;
        if(tx<0 || tx>=WORLD_WIDTH) continue;
        world[y][tx] = TILE_BLOCK;
      }
    }

    function addPipe(x){
      if(x<0 || x+1>=WORLD_WIDTH) return;
      for(let y=GROUND_LEVEL-1; y<=GROUND_LEVEL+1; y++){
        if(y<0 || y>=WORLD_HEIGHT) continue;
        world[y][x]   = TILE_PIPE;
        world[y][x+1] = TILE_PIPE;
      }
    }

    function addVine(x, yTop, yBottom){
      for(let y=yTop; y<=yBottom; y++){
        if(y<0 || y>=WORLD_HEIGHT || x<0 || x>=WORLD_WIDTH) continue;
        world[y][x] = TILE_VINE;
      }
    }

    // ===== Level ontwerp =====
    addGroundStrip(0, WORLD_WIDTH-1);

    addBlockRow(6, GROUND_LEVEL-3, 3);
    addBlockRow(10, GROUND_LEVEL-4, 4);

    carveHole(18,3);
    addPlatform(16, GROUND_LEVEL-3, 2);
    addPlatform(21, GROUND_LEVEL-2, 2);

    carveHole(32,4);
    addPlatform(29, GROUND_LEVEL-3, 3);
    addPlatform(37, GROUND_LEVEL-4, 3);

    addBlockRow(42, GROUND_LEVEL-3, 3);
    addBlockRow(45, GROUND_LEVEL-4, 2);

    carveHole(52,5);
    addPlatform(50, GROUND_LEVEL-4, 3);
    addPlatform(57, GROUND_LEVEL-3, 3);

    // lianen boven derde pit
    addVine(54, GROUND_LEVEL-6, GROUND_LEVEL-3);
    addVine(56, GROUND_LEVEL-6, GROUND_LEVEL-3);

    addBlockRow(63, GROUND_LEVEL-3, 2);
    addBlockRow(65, GROUND_LEVEL-4, 2);
    addBlockRow(67, GROUND_LEVEL-5, 2);

    addPlatform(72, GROUND_LEVEL-3, 3);
    addPlatform(76, GROUND_LEVEL-4, 3);

    const warpPipes = [
      {
        entranceX: 82,
        entranceWidth: 2,
        destX: 140 * TILE_SIZE + 4,
        destY: (GROUND_LEVEL-5) * TILE_SIZE
      },
      {
        entranceX: 160,
        entranceWidth: 2,
        destX: 110 * TILE_SIZE,
        destY: (GROUND_LEVEL-1) * TILE_SIZE
      }
    ];
    addPipe(82);
    addPipe(160);

    // lianen in geheime kamer
    addVine(151, GROUND_LEVEL-6, GROUND_LEVEL-2);
    addVine(153, GROUND_LEVEL-6, GROUND_LEVEL-2);

    carveHole(90,3);
    addPlatform(88, GROUND_LEVEL-3, 2);
    addPlatform(94, GROUND_LEVEL-2, 3);

    carveHole(105,4);
    addPlatform(103, GROUND_LEVEL-3, 2);
    addPlatform(110, GROUND_LEVEL-4, 3);

    // geheime kamer
    addGroundStrip(138, 168);
    for(let x=138;x<=168;x++){
      world[GROUND_LEVEL+1][x] = TILE_GROUND;
      if(x % 2 === 0){
        world[GROUND_LEVEL][x] = TILE_EMPTY;
      }
    }
    addPlatform(142, GROUND_LEVEL-3, 3);
    addPlatform(148, GROUND_LEVEL-4, 3);
    addPlatform(154, GROUND_LEVEL-5, 3);
    addPlatform(162, GROUND_LEVEL-3, 3);

    // ===== Vuurvliegjes in de jungle =====
    for(let i=0;i<FIREFLY_COUNT;i++){
      fireflies.push({
        x: Math.random() * WORLD_WIDTH * TILE_SIZE,
        y: 10 + Math.random() * 90,
        baseY: 10 + Math.random() * 90,
        amp: 6 + Math.random() * 10,
        speed: 0.4 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2
      });
    }

    // ===== Goal / einde =====
    const goal = {
      x: 178 * TILE_SIZE,
      y: (GROUND_LEVEL-5) * TILE_SIZE,
      w: 12,
      h: 40,
      reached: false
    };
    let winMessageTimer = 0;

    // ===== Speler =====
    const player = {
      x: 5 * TILE_SIZE,
      y: (GROUND_LEVEL-1) * TILE_SIZE,
      vx: 0,
      vy: 0,
      w: 12,
      h: 14,
      onGround: false
    };

    const GRAVITY      = 800;
    const MOVE_SPEED   = 140;
    const JUMP_VELOCITY= -280;
    const MAX_FALL     = 600;
    const CLIMB_SPEED  = 80;

    let onVine = false;

    const anim = { runPhase: 0 };

    // camera
    let cameraX = 0;

    // geheim idol
    const secretStatue = {
      x: 155 * TILE_SIZE + 4,
      y: (GROUND_LEVEL-5) * TILE_SIZE - 4,
      w: 8,
      h: 10,
      found: false
    };
    let secretMessageTimer = 0;

    // vijanden: slangen
    const enemies = [
      {
        type: "snake",
        x: 30 * TILE_SIZE,
        y: (GROUND_LEVEL) * TILE_SIZE + 4,
        w: 14,
        h: 8,
        vx: 40,
        leftBound: 28 * TILE_SIZE,
        rightBound: 36 * TILE_SIZE,
        alive: true
      },
      {
        type: "snake",
        x: 60 * TILE_SIZE,
        y: (GROUND_LEVEL) * TILE_SIZE + 4,
        w: 14,
        h: 8,
        vx: 45,
        leftBound: 58 * TILE_SIZE,
        rightBound: 66 * TILE_SIZE,
        alive: true
      },
      {
        type: "snake",
        x: 100 * TILE_SIZE,
        y: (GROUND_LEVEL) * TILE_SIZE + 4,
        w: 14,
        h: 8,
        vx: 50,
        leftBound: 98 * TILE_SIZE,
        rightBound: 106 * TILE_SIZE,
        alive: true
      }
    ];

    // collectibles: bananen & CBS-coins
    const bananas = [
      { x: 15*TILE_SIZE, y: (GROUND_LEVEL-3)*TILE_SIZE, w:10, h:8, collected:false },
      { x: 34*TILE_SIZE, y: (GROUND_LEVEL-4)*TILE_SIZE, w:10, h:8, collected:false },
      { x: 59*TILE_SIZE, y: (GROUND_LEVEL-5)*TILE_SIZE, w:10, h:8, collected:false },
      { x: 93*TILE_SIZE, y: (GROUND_LEVEL-2)*TILE_SIZE, w:10, h:8, collected:false },
      { x: 149*TILE_SIZE, y:(GROUND_LEVEL-4)*TILE_SIZE, w:10, h:8, collected:false },
    ];

    const cbsCoins = [
      { x: 24*TILE_SIZE, y:(GROUND_LEVEL-3)*TILE_SIZE, r:5, collected:false },
      { x: 47*TILE_SIZE, y:(GROUND_LEVEL-4)*TILE_SIZE, r:5, collected:false },
      { x: 75*TILE_SIZE, y:(GROUND_LEVEL-4)*TILE_SIZE, r:5, collected:false },
      { x: 145*TILE_SIZE, y:(GROUND_LEVEL-3)*TILE_SIZE, r:5, collected:false },
      { x: 176*TILE_SIZE, y:(GROUND_LEVEL-4)*TILE_SIZE, r:5, collected:false },
    ];

    function updateCollectHUD(){
      const bananasTotal = bananas.length;
      const bananasGot   = bananas.filter(b=>b.collected).length;
      const coinsTotal   = cbsCoins.length;
      const coinsGot     = cbsCoins.filter(c=>c.collected).length;
      collectStatusEl.textContent = `Bananen: ${bananasGot}/${bananasTotal} – CBS-coins: ${coinsGot}/${coinsTotal}`;
    }
    updateCollectHUD();

    // feedback bij dood
    let deathFlashTimer = 0;

    const keys = {};
    window.addEventListener("keydown", e=>{
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener("keyup", e=>{
      keys[e.key.toLowerCase()] = false;
    });

    function isSolidTile(tx,ty){
      if(tx<0 || ty<0 || tx>=WORLD_WIDTH || ty>=WORLD_HEIGHT) return false;
      const t = world[ty][tx];
      return (
        t === TILE_GROUND ||
        t === TILE_GRASS  ||
        t === TILE_PIPE   ||
        t === TILE_BLOCK
      );
    }

    function tileAtWorld(x, y){
      const tx = Math.floor(x / TILE_SIZE);
      const ty = Math.floor(y / TILE_SIZE);
      if(tx<0 || ty<0 || tx>=WORLD_WIDTH || ty>=WORLD_HEIGHT) return TILE_EMPTY;
      return world[ty][tx];
    }

    function killPlayer(){
      resetPlayer();
      deathFlashTimer = 0.4;
    }

    function moveAndCollide(dt){
      player.x += player.vx * dt;

      const left   = Math.floor(player.x / TILE_SIZE);
      const right  = Math.floor((player.x + player.w) / TILE_SIZE);
      const top    = Math.floor(player.y / TILE_SIZE);
      const bottom = Math.floor((player.y + player.h) / TILE_SIZE);

      if(player.vx > 0){
        for(let ty = top; ty <= bottom; ty++){
          if(isSolidTile(right, ty)){
            player.x = right * TILE_SIZE - player.w - 0.01;
            player.vx = 0;
            break;
          }
        }
      }else if(player.vx < 0){
        for(let ty = top; ty <= bottom; ty++){
          if(isSolidTile(left, ty)){
            player.x = (left+1) * TILE_SIZE + 0.01;
            player.vx = 0;
            break;
          }
        }
      }

      if(!onVine){
        player.vy += GRAVITY * dt;
        if(player.vy > MAX_FALL) player.vy = MAX_FALL;
      }

      player.y += player.vy * dt;

      let newTop    = Math.floor(player.y / TILE_SIZE);
      let newBottom = Math.floor((player.y + player.h) / TILE_SIZE);
      let newLeft   = Math.floor(player.x / TILE_SIZE);
      let newRight  = Math.floor((player.x + player.w) / TILE_SIZE);

      player.onGround = false;

      if(player.vy > 0){
        for(let tx=newLeft; tx<=newRight; tx++){
          if(isSolidTile(tx,newBottom)){
            player.y = newBottom*TILE_SIZE - player.h - 0.01;
            player.vy = 0;
            player.onGround = true;
            break;
          }
        }
      }else if(player.vy < 0){
        for(let tx=newLeft; tx<=newRight; tx++){
          if(isSolidTile(tx,newTop)){
            player.y = (newTop+1)*TILE_SIZE + 0.01;
            player.vy = 0;
            break;
          }
        }
      }

      if(player.y > canvas.height + 200){
        killPlayer();
      }
    }

    function tryWarpPipe(){
      const downPressed = keys["arrowdown"] || keys["s"];
      if(!downPressed || !player.onGround) return;

      const centerX = player.x + player.w/2;

      for(const pipe of warpPipes){
        const pipeStartPx = pipe.entranceX * TILE_SIZE;
        const pipeEndPx   = (pipe.entranceX + pipe.entranceWidth) * TILE_SIZE;
        if(centerX >= pipeStartPx && centerX <= pipeEndPx){
          player.x = pipe.destX;
          player.y = pipe.destY;
          player.vx = 0;
          player.vy = 0;
          cameraX = player.x - canvas.width/2;
          if(cameraX < 0) cameraX = 0;
          const maxCam = WORLD_WIDTH*TILE_SIZE - canvas.width;
          if(cameraX > maxCam) cameraX = maxCam;
          break;
        }
      }
    }

    function checkSecret(){
      if(secretStatue.found) return;

      const px = player.x, py = player.y, pw = player.w, ph = player.h;
      const sx = secretStatue.x - 4, sy = secretStatue.y - 4,
            sw = secretStatue.w + 8, sh = secretStatue.h + 8;

      if(px < sx+sw && px+pw > sx && py < sy+sh && py+ph > sy){
        secretStatue.found = true;
        secretMessageTimer = 4;
        secretStatusEl.innerHTML = 'Geheim: <b>gevonden!</b>';
      }
    }

    function checkGoal(){
      if(goal.reached) return;
      const px = player.x, py = player.y, pw = player.w, ph = player.h;
      const gx = goal.x, gy = goal.y, gw = goal.w, gh = goal.h;
      if(px < gx+gw && px+pw > gx && py < gy+gh && py+ph > gy){
        goal.reached = true;
        winMessageTimer = 5;
      }
    }

    function updateEnemies(dt){
      for(const e of enemies){
        if(!e.alive) continue;
        e.x += e.vx * dt;
        if(e.x < e.leftBound){
          e.x = e.leftBound;
          e.vx *= -1;
        }else if(e.x + e.w > e.rightBound){
          e.x = e.rightBound - e.w;
          e.vx *= -1;
        }

        const px = player.x, py = player.y, pw = player.w, ph = player.h;
        const ex = e.x, ey = e.y, ew = e.w, eh = e.h;

        if(px < ex+ew && px+pw > ex && py < ey+eh && py+ph > ey){
          const playerFeet = py + ph;
          const enemyTop   = ey;
          if(player.vy > 50 && playerFeet <= enemyTop + 4){
            e.alive = false;
            player.vy = JUMP_VELOCITY * 0.6;
          }else{
            killPlayer();
            break;
          }
        }
      }
    }

    function updateCollectibles(){
      const px = player.x, py = player.y, pw = player.w, ph = player.h;

      for(const b of bananas){
        if(b.collected) continue;
        const bx = b.x, by = b.y, bw = b.w, bh = b.h;
        if(px < bx+bw && px+pw > bx && py < by+bh && py+ph > by){
          b.collected = true;
        }
      }

      for(const c of cbsCoins){
        if(c.collected) continue;
        const cx = c.x, cy = c.y, r = c.r;
        const cx2 = cx + r, cy2 = cy + r;
        if(px < cx2+r && px+pw > cx-r && py < cy2+r && py+ph > cy-r){
          c.collected = true;
        }
      }

      updateCollectHUD();
    }

    function update(dt){
      let move = 0;
      if(keys["arrowleft"] || keys["a"]) move -= 1;
      if(keys["arrowright"]|| keys["d"]) move += 1;

      if(Math.abs(move) > 0.1 && player.onGround && !onVine){
        anim.runPhase += dt * 12;
      }else{
        anim.runPhase *= 0.9;
      }

      const centerX = player.x + player.w/2;
      const centerY = player.y + player.h/2;
      const tileUnder = tileAtWorld(centerX, centerY);
      const wantsClimb = keys["arrowup"] || keys["arrowdown"] || keys["w"] || keys["s"];

      if(tileUnder === TILE_VINE && wantsClimb){
        onVine = true;
      }

      if(onVine){
        if(move !== 0 || keys[" "]){
          onVine = false;
        }
      }

      if(onVine){
        player.vx = 0;
        let climb = 0;
        if(keys["arrowup"] || keys["w"]) climb -= 1;
        if(keys["arrowdown"] || keys["s"]) climb += 1;
        player.vy = climb * CLIMB_SPEED;
      }else{
        player.vx = move * MOVE_SPEED;
        if((keys["arrowup"] || keys[" "]) && player.onGround){
          player.vy = JUMP_VELOCITY;
          player.onGround = false;
        }
      }

      moveAndCollide(dt);
      tryWarpPipe();
      checkSecret();
      checkGoal();
      updateEnemies(dt);
      updateCollectibles();

      const targetCam = player.x - canvas.width/2 + player.w/2;
      cameraX += (targetCam - cameraX) * 0.15;
      if(cameraX < 0) cameraX = 0;
      const maxCam = WORLD_WIDTH*TILE_SIZE - canvas.width;
      if(cameraX > maxCam) cameraX = maxCam;

      // vuurvliegjes zacht laten bewegen
      fireflyTime += dt;
      for(const f of fireflies){
        f.y = f.baseY + Math.sin(f.phase + fireflyTime * f.speed) * f.amp;
        f.x -= f.speed * 4 * dt;
        if(f.x < 0){
          f.x += WORLD_WIDTH * TILE_SIZE;
        }
      }

      if(secretMessageTimer > 0){
        secretMessageTimer -= dt;
        if(secretMessageTimer < 0) secretMessageTimer = 0;
      }
      if(deathFlashTimer > 0){
        deathFlashTimer -= dt;
        if(deathFlashTimer < 0) deathFlashTimer = 0;
      }
      if(winMessageTimer > 0){
        winMessageTimer -= dt;
        if(winMessageTimer < 0) winMessageTimer = 0;
      }
    }

    // ===== TEKENEN =====
    function drawBackground(){
      const grad = ctx.createLinearGradient(0,0,0,canvas.height);
      grad.addColorStop(0,"#062019");
      grad.addColorStop(0.5,"#04140f");
      grad.addColorStop(1,"#020706");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      for(let i=0;i<3;i++){
        const yBase = 60 + i*25;
        ctx.fillStyle = `rgba(10,40,20,${0.35 - i*0.08})`;
        for(let x=-1;x<20;x++){
          const treeX = x*40 - (cameraX*0.2) % 40 + i*10;
          const w = 24;
          const h = 50 + i*15;
          ctx.fillRect(treeX, yBase, w, h);
        }
      }

      // vuurvliegjes (lichtpuntjes) met lichte parallax
      for(const f of fireflies){
        const fx = f.x - cameraX * 0.25;
        if(fx < -5 || fx > canvas.width + 5) continue;

        const alpha = 0.3 + 0.3 * Math.sin(f.phase + fireflyTime * 2);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#dfffb0";
        ctx.fillRect(fx, f.y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    function drawTiles(){
      const startTileX = Math.floor(cameraX / TILE_SIZE);
      const endTileX   = Math.ceil((cameraX + canvas.width) / TILE_SIZE);

      for(let y=0;y<WORLD_HEIGHT;y++){
        for(let x=startTileX;x<endTileX;x++){
          if(x<0 || x>=WORLD_WIDTH) continue;
          const t = world[y][x];
          if(t === TILE_EMPTY) continue;

          const screenX = x*TILE_SIZE - cameraX;
          const screenY = y*TILE_SIZE;

          if(t === TILE_GROUND){
            ctx.fillStyle = "#2c1a0b";
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#1b1006";
            ctx.fillRect(screenX, screenY+10, TILE_SIZE, 6);
          }else if(t === TILE_GRASS){
            ctx.fillStyle = "#215c22";
            ctx.fillRect(screenX, screenY+4, TILE_SIZE, TILE_SIZE-4);
            ctx.fillStyle = "#3aa52e";
            ctx.fillRect(screenX, screenY, TILE_SIZE, 6);
            ctx.fillStyle = "#62d34a";
            ctx.fillRect(screenX, screenY, TILE_SIZE, 2);
          }else if(t === TILE_PIPE){
            ctx.fillStyle = "#0b5f3a";
            ctx.fillRect(screenX, screenY+4, TILE_SIZE, TILE_SIZE-4);
            ctx.fillStyle = "#0f8b52";
            ctx.fillRect(screenX, screenY, TILE_SIZE, 6);
            ctx.fillStyle = "#14b566";
            ctx.fillRect(screenX+2, screenY+1, TILE_SIZE-6, 2);
          }else if(t === TILE_BLOCK){
            ctx.fillStyle = "#7b4a1e";
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#523017";
            ctx.fillRect(screenX+2, screenY+2, TILE_SIZE-4, TILE_SIZE-4);
            ctx.fillStyle = "#9a5d26";
            ctx.fillRect(screenX, screenY, TILE_SIZE, 2);
          }else if(t === TILE_VINE){
            ctx.fillStyle = "#0b612f";
            ctx.fillRect(screenX + TILE_SIZE/2 - 1, screenY, 2, TILE_SIZE);
            ctx.fillStyle = "#1dd46a";
            ctx.fillRect(screenX + TILE_SIZE/2 - 1, screenY+2, 1, TILE_SIZE-4);
          }
        }
      }
    }

    function drawMonkey(){
      const sx = Math.floor(player.x - cameraX);
      const sy = Math.floor(player.y);

      ctx.save();
      ctx.imageSmoothingEnabled = false;

      const bob = onVine ? 0 : (Math.abs(player.vx) > 5 && player.onGround ? (Math.sin(anim.runPhase)*1)|0 : 0);

      // benen
      ctx.fillStyle = "#8a451f";
      const legOffset = (Math.sin(anim.runPhase)*2)|0;
      ctx.fillRect(sx+3, sy+14+bob+legOffset, 2,2);
      ctx.fillRect(sx+7, sy+14+bob-legOffset, 2,2);

      // lijf
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx+2, sy+7+bob, 8, 7);

      // hoofd
      ctx.fillRect(sx+1, sy+1+bob, 10, 8);

      // gezicht
      ctx.fillStyle = "#f1c58a";
      ctx.fillRect(sx+3, sy+3+bob, 6, 5);

      // oren
      ctx.fillStyle = "#5b3416";
      ctx.fillRect(sx,   sy+3+bob, 2,3);
      ctx.fillRect(sx+9, sy+3+bob, 2,3);

      // ogen + neus
      ctx.fillStyle = "#000";
      ctx.fillRect(sx+4, sy+4+bob, 1,1);
      ctx.fillRect(sx+7, sy+4+bob, 1,1);
      ctx.fillRect(sx+5, sy+6+bob, 1,1);

      // staart
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx-1, sy+8+bob, 2,2);
      ctx.fillRect(sx-2, sy+10+bob, 2,2);

      ctx.restore();
    }

    function drawSecretStatue(){
      if(secretStatue.found) return;
      const sx = Math.floor(secretStatue.x - cameraX);
      const sy = Math.floor(secretStatue.y);
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = "#3a2c16";
      ctx.fillRect(sx-2, sy+8, secretStatue.w+4, 4);

      ctx.fillStyle = "#ffd86b";
      ctx.fillRect(sx, sy, secretStatue.w, secretStatue.h);
      ctx.fillStyle = "#ffefb0";
      ctx.fillRect(sx+1, sy+1, secretStatue.w-2, secretStatue.h-4);

      ctx.fillStyle = "#c28a32";
      ctx.fillRect(sx+2, sy+4, secretStatue.w-4, 2);
      ctx.fillRect(sx+1, sy+6, 2,1);
      ctx.fillRect(sx+secretStatue.w-3, sy+6, 2,1);

      ctx.restore();
    }

    function drawEnemies(){
      for(const e of enemies){
        if(!e.alive) continue;
        const sx = Math.floor(e.x - cameraX);
        const sy = Math.floor(e.y);
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        if(e.type === "snake"){
          ctx.fillStyle = "#1a7b3a";
          ctx.fillRect(sx, sy, e.w, e.h);
          ctx.fillStyle = "#14552a";
          ctx.fillRect(sx, sy+e.h-3, e.w, 3);
          ctx.fillStyle = "#f7f2d0";
          ctx.fillRect(sx+2, sy+1, 2,2);
          ctx.fillRect(sx+e.w-4, sy+1, 2,2);
        }

        ctx.restore();
      }
    }

    function drawGoal(){
      const sx = Math.floor(goal.x - cameraX);
      const sy = Math.floor(goal.y);
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = "#deb887";
      ctx.fillRect(sx+4, sy, 4, goal.h);

      ctx.fillStyle = goal.reached ? "#ffd86b" : "#ffefb0";
      ctx.fillRect(sx+8, sy+2, 10, 6);
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx+9, sy+3, 3, 4);

      ctx.restore();
    }

    function drawBananas(){
      for(const b of bananas){
        if(b.collected) continue;
        const sx = Math.floor(b.x - cameraX);
        const sy = Math.floor(b.y);
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = "#ffeb7a";
        ctx.fillRect(sx+2, sy+1, 6, 4);
        ctx.fillRect(sx+3, sy,   4, 2);
        ctx.fillStyle = "#c49b35";
        ctx.fillRect(sx+2, sy+1, 1,1);
        ctx.fillRect(sx+7, sy+4, 1,1);

        ctx.restore();
      }
    }

    function drawCbsCoins(){
      for(const c of cbsCoins){
        if(c.collected) continue;
        const sx = Math.floor(c.x - cameraX);
        const sy = Math.floor(c.y);
        const r  = c.r;
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        ctx.beginPath();
        ctx.arc(sx+r, sy+r, r, 0, Math.PI*2);
        ctx.fillStyle = "#ffd86b";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx+r, sy+r, r-2, 0, Math.PI*2);
        ctx.fillStyle = "#ffefb0";
        ctx.fill();

        ctx.fillStyle = "#c46b32";
        ctx.font = "6px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("C", sx+r, sy+r+0.5);

        ctx.restore();
      }
    }

    function drawOverlay(){
      if(secretMessageTimer > 0){
        ctx.save();
        ctx.globalAlpha = Math.min(1, secretMessageTimer / 2);
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(20, 20, canvas.width-40, 40);
        ctx.fillStyle = "#ffd86b";
        ctx.font = "10px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Geheim gevonden! Later koppelen we dit aan de CBS earn.", canvas.width/2, 45);
        ctx.restore();
      }

      if(winMessageTimer > 0){
        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(20, 70, canvas.width-40, 50);
        ctx.fillStyle = "#9dff7a";
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Level gehaald! Finish + geheim + collectibles worden later je earn.", canvas.width/2, 100);
        ctx.restore();
      }

      if(deathFlashTimer > 0){
        ctx.save();
        ctx.globalAlpha = deathFlashTimer * 1.5;
        ctx.fillStyle = "rgba(255,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.restore();
      }
    }

    function draw(){
      drawBackground();
      drawTiles();
      drawBananas();
      drawCbsCoins();
      drawMonkey();
      drawSecretStatue();
      drawEnemies();
      drawGoal();
      drawOverlay();
    }

    // ===== LOOP =====
    let lastTime = 0;

    function loop(ts){
      if(!lastTime) lastTime = ts;
      const dt = Math.min(0.033, (ts-lastTime)/1000);
      lastTime = ts;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function resetPlayer(){
      player.x = 5*TILE_SIZE;
      player.y = (GROUND_LEVEL-1)*TILE_SIZE;
      player.vx = 0;
      player.vy = 0;
      cameraX = 0;
      onVine = false;
      secretStatue.found = false;
      secretMessageTimer = 0;
      deathFlashTimer = 0;
      goal.reached = false;
      winMessageTimer = 0;
      secretStatusEl.innerHTML = 'Geheim: <b>nog niet gevonden</b>';
      enemies.forEach((e,i)=>{
        e.alive = true;
        if(i===0){ e.x = 30 * TILE_SIZE; }
        else if(i===1){ e.x = 60 * TILE_SIZE; }
        else if(i===2){ e.x = 100 * TILE_SIZE; }
      });
      bananas.forEach(b=>b.collected=false);
      cbsCoins.forEach(c=>c.collected=false);
      updateCollectHUD();
    }

    requestAnimationFrame(loop);
    startBtn.addEventListener("click", resetPlayer);
  </script>
</body>
</html>
