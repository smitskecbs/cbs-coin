<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CBS Jungle Monkey – Jungle Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root{
      --bg1:#041812;
      --bg2:#020b08;
      --fg:#fefbe8;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(circle at top,#144b2a 0,#020b08 55%,#000 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui, sans-serif;
      color:var(--fg);
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    canvas{
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      width:960px;   /* 320x3 */
      height:540px;  /* 180x3 */
      border-radius:12px;
      border:2px solid #2cff9b33;
      box-shadow:0 0 40px rgba(0,0,0,.9),0 0 24px rgba(47,255,155,.25);
      background:#000;
    }

    .hud{
      text-align:center;
      font-size:14px;
      color:#d9fdd2;
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:center;
      max-width:960px;
    }
    .hud b{color:#9dff7a}

    .hud-controls{
      font-size:13px;
    }

    .hud-row{
      display:flex;
      gap:16px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:center;
    }

    button#resetBtn{
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #2cff9b66;
      background:#061b12;
      color:#e9ffe0;
      cursor:pointer;
      font-size:13px;
      box-shadow:0 0 10px rgba(0,0,0,.6);
    }
    button#resetBtn:hover{
      background:#0b2b1b;
    }

    #shardStatus b{
      color:#ffd86b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="320" height="180"></canvas>
    <div class="hud">
      <div class="hud-controls">
        Besturing: <b>← ↑ → ↓</b> of <b>W A S D</b> lopen •
        Raak <b>slangen</b> niet aan – dan ga je terug naar de start.
      </div>
      <div>
        Doel: verken de <b>jungle</b>, verzamel <b>3 CBS-shards</b> om de <b>poort</b> te openen,
        en bereik daarna de <b>CBS-tempel</b>. Ergens verstopt staat ook een geheime <b>CBS-idol</b> 🐒🌴
      </div>
      <div class="hud-row">
        <button id="resetBtn">Reset puzzel</button>
        <div id="shardStatus">CBS-shards: <b>0/3</b></div>
        <div id="secretStatus">Geheim: <b>nog niet gevonden</b></div>
      </div>
      <div id="messageStatus"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const resetBtn = document.getElementById("resetBtn");
    const shardStatusEl = document.getElementById("shardStatus");
    const secretStatusEl = document.getElementById("secretStatus");
    const messageStatusEl = document.getElementById("messageStatus");

    // ===== TILEMAP / WERELD =====
    const TILE_SIZE = 16;

    // Top-down wereld (zoals een Pokémon-gebied)
    const WORLD_WIDTH = 32;   // tiles
    const WORLD_HEIGHT = 18;  // tiles

    // Tiles
    const T_GROUND   = 0; // pad / gras
    const T_TREE     = 1; // boom / muur
    const T_WATER    = 2; // water / blokkade
    const T_TALLGRASS= 3; // hoog gras
    const T_GATE     = 4; // poort naar tempel
    const T_TEMPLE   = 5; // eind-tempel

    // Eenvoudige layout (0 = ground, 1 = tree, 2 = water, 3 = tall grass, 4/5 = gate/temple)
    // Bouw een jungle-achtige vorm: randen bomen, paden binnenin.
    const world = [];
    for(let y=0; y<WORLD_HEIGHT; y++){
      world[y] = [];
      for(let x=0; x<WORLD_WIDTH; x++){
        // randen vol bomen
        if(x === 0 || y === 0 || x === WORLD_WIDTH-1 || y === WORLD_HEIGHT-1){
          world[y][x] = T_TREE;
        }else{
          world[y][x] = T_GROUND;
        }
      }
    }

    // wat waterplakken + hoog gras handmatig zetten
    function rectFill(x0,y0,x1,y1,type){
      for(let y=y0;y<=y1;y++){
        for(let x=x0;x<=x1;x++){
          if(x>0 && y>0 && x<WORLD_WIDTH-1 && y<WORLD_HEIGHT-1){
            world[y][x] = type;
          }
        }
      }
    }

    // watermeren
    rectFill(4,4,7,6, T_WATER);
    rectFill(22,3,26,5, T_WATER);

    // hoge grasvelden
    rectFill(10,10,14,12, T_TALLGRASS);
    rectFill(3,11,7,14, T_TALLGRASS);
    rectFill(20,11,27,14, T_TALLGRASS);

    // wat extra bomen om paden te maken
    rectFill(15,2,15,7, T_TREE);
    rectFill(16,7,20,7, T_TREE);
    rectFill(11,5,13,5, T_TREE);
    rectFill(9,7,11,9, T_TREE);
    rectFill(24,7,29,7, T_TREE);
    rectFill(19,9,21,12, T_TREE);

    // Poort naar tempel + tempelgebied
    // poort in de bovenste muur van een inner-gebied
    world[2][16] = T_GATE;
    world[2][17] = T_GATE;

    // tempel boven poort (buiten "binnenveld") – alsof je een nieuwe area inloopt
    world[1][16] = T_TEMPLE;
    world[1][17] = T_TEMPLE;

    // ===== Speler (top-down) =====
    const player = {
      x: 2.5 * TILE_SIZE,
      y: 8.5 * TILE_SIZE,
      w: 12,
      h: 12,
      speed: 60,
      dirX: 0,
      dirY: 1  // kijkrichting (0,-1,1 etc) – kan later voor animaties
    };

    // ===== CBS Shards + geheim idol =====
    const shards = [
      { x: 6*TILE_SIZE,  y: 13*TILE_SIZE,   collected:false }, // links-onder jungle
      { x: 26*TILE_SIZE, y: 12*TILE_SIZE,   collected:false }, // rechts-onder jungle
      { x: 12*TILE_SIZE, y: 4*TILE_SIZE,    collected:false }, // boven-linker pad
    ];

    const secretIdol = {
      x: 28*TILE_SIZE,
      y: 4*TILE_SIZE,
      w: 10,
      h: 12,
      found:false
    };

    let gateOpen = false;
    let winMessageTimer = 0;
    let secretMessageTimer = 0;
    let infoMessageTimer = 0;

    function updateShardHUD(){
      const total = shards.length;
      const count = shards.filter(s=>s.collected).length;
      shardStatusEl.innerHTML = `CBS-shards: <b>${count}/${total}</b>`;
    }
    updateShardHUD();

    // ===== Slangen (als "guards") =====
    const snakes = [
      {
        x: 9*TILE_SIZE,
        y: 8*TILE_SIZE,
        w: 12,
        h: 10,
        vx: 20,
        xMin: 8*TILE_SIZE,
        xMax: 12*TILE_SIZE
      },
      {
        x: 21*TILE_SIZE,
        y: 9*TILE_SIZE,
        w: 12,
        h: 10,
        vx: -25,
        xMin: 19*TILE_SIZE,
        xMax: 23*TILE_SIZE
      }
    ];

    // ===== Fireflies (achtergrond) =====
    const FIREFLY_COUNT = 35;
    const fireflies = [];
    let fireflyTime = 0;

    for(let i=0;i<FIREFLY_COUNT;i++){
      fireflies.push({
        x: Math.random() * WORLD_WIDTH * TILE_SIZE,
        y: 10 + Math.random() * (WORLD_HEIGHT*TILE_SIZE-30),
        baseY: 10 + Math.random() * (WORLD_HEIGHT*TILE_SIZE-30),
        amp: 5 + Math.random() * 10,
        speed: 0.5 + Math.random() * 0.9,
        phase: Math.random() * Math.PI * 2
      });
    }

    // ===== Input =====
    const keys = {};
    window.addEventListener("keydown", e=>{
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener("keyup", e=>{
      keys[e.key.toLowerCase()] = false;
    });

    // ===== Helpers =====
    function tileAtPixel(px,py){
      const tx = Math.floor(px / TILE_SIZE);
      const ty = Math.floor(py / TILE_SIZE);
      if(tx<0 || ty<0 || tx>=WORLD_WIDTH || ty>=WORLD_HEIGHT){
        return T_TREE; // buiten rand behandelen als muur
      }
      return world[ty][tx];
    }

    function isBlockedTileType(t){
      return (t === T_TREE || t === T_WATER);
    }

    function resetGame(){
      player.x = 2.5*TILE_SIZE;
      player.y = 8.5*TILE_SIZE;
      player.dirX = 0;
      player.dirY = 1;

      shards.forEach(s=>s.collected=false);
      gateOpen = false;
      secretIdol.found = false;

      winMessageTimer = 0;
      secretMessageTimer = 0;
      infoMessageTimer = 0;
      messageStatusEl.textContent = "";
      secretStatusEl.innerHTML = 'Geheim: <b>nog niet gevonden</b>';
      updateShardHUD();
    }

    resetBtn.addEventListener("click", resetGame);

    // ===== Update =====
    function update(dt){
      // besturing
      let moveX = 0, moveY = 0;
      if(keys["arrowleft"] || keys["a"]) moveX -= 1;
      if(keys["arrowright"]|| keys["d"]) moveX += 1;
      if(keys["arrowup"]   || keys["w"]) moveY -= 1;
      if(keys["arrowdown"] || keys["s"]) moveY += 1;

      // normaliseren (diagonaal niet sneller)
      if(moveX !== 0 || moveY !== 0){
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
        player.dirX = moveX;
        player.dirY = moveY;
      }

      const speed = player.speed;
      let newX = player.x + moveX*speed*dt;
      let newY = player.y + moveY*speed*dt;

      // collision check op 4 hoeken van de hitbox
      function canWalk(nx,ny){
        const halfW = player.w/2;
        const halfH = player.h/2;
        const points = [
          [nx-halfW, ny-halfH],
          [nx+halfW, ny-halfH],
          [nx-halfW, ny+halfH],
          [nx+halfW, ny+halfH]
        ];
        for(const [px,py] of points){
          const t = tileAtPixel(px,py);
          if(isBlockedTileType(t)) return false;
        }
        return true;
      }

      // eerst X, dan Y – klassieke top-down collision
      if(canWalk(newX, player.y)){
        player.x = newX;
      }
      if(canWalk(player.x, newY)){
        player.y = newY;
      }

      // update slangen
      for(const s of snakes){
        s.x += s.vx * dt;
        if(s.x < s.xMin){
          s.x = s.xMin;
          s.vx *= -1;
        }else if(s.x + s.w > s.xMax){
          s.x = s.xMax - s.w;
          s.vx *= -1;
        }
      }

      // slangen collision
      const pw = player.w, ph = player.h;
      const px1 = player.x - pw/2, py1 = player.y - ph/2;
      const px2 = px1 + pw, py2 = py1 + ph;

      for(const s of snakes){
        const sx1 = s.x, sy1 = s.y;
        const sx2 = sx1 + s.w, sy2 = sy1 + s.h;
        if(px1 < sx2 && px2 > sx1 && py1 < sy2 && py2 > sy1){
          // hit – terug naar start
          resetGame();
          infoMessageTimer = 3;
          messageStatusEl.textContent = "Gebeten door een slang! Je begint opnieuw…";
          break;
        }
      }

      // shards oppakken
      for(const shard of shards){
        if(shard.collected) continue;
        const sx = shard.x+4, sy = shard.y+4; // center
        const dist = Math.hypot(player.x - sx, player.y - sy);
        if(dist < 10){
          shard.collected = true;
          updateShardHUD();

          const count = shards.filter(s=>s.collected).length;
          infoMessageTimer = 3;
          messageStatusEl.textContent = `CBS-shard ${count}/${shards.length} gevonden!`;
        }
      }

      // poort openen als alle shards binnen zijn
      if(!gateOpen && shards.every(s=>s.collected)){
        gateOpen = true;
        infoMessageTimer = 4;
        messageStatusEl.textContent = "Alle CBS-shards gevonden! De junglepoort is open.";
      }

      // geheim idol
      if(!secretIdol.found){
        const ix1 = secretIdol.x, iy1 = secretIdol.y;
        const ix2 = ix1 + secretIdol.w, iy2 = iy1 + secretIdol.h;
        if(px1 < ix2 && px2 > ix1 && py1 < iy2 && py2 > iy1){
          secretIdol.found = true;
          secretStatusEl.innerHTML = 'Geheim: <b>gevonden!</b>';
          secretMessageTimer = 4;
        }
      }

      // gate collision (als dicht, blokkeert; als open, gewoon lopen)
      // We doen dit via tile type, maar alleen dicht is blocking
      const gateTiles = [];
      for(let y=0;y<WORLD_HEIGHT;y++){
        for(let x=0;x<WORLD_WIDTH;x++){
          if(world[y][x] === T_GATE){
            gateTiles.push({tx:x,ty:y});
          }
        }
      }
      if(!gateOpen){
        for(const gt of gateTiles){
          const gx1 = gt.tx*TILE_SIZE;
          const gy1 = gt.ty*TILE_SIZE;
          const gx2 = gx1+TILE_SIZE;
          const gy2 = gy1+TILE_SIZE;
          if(px1 < gx2 && px2 > gx1 && py1 < gy2 && py2 > gy1){
            // player mag niet door gesloten poort, duw hem iets terug
            // simpele oplossing: reset last movement
            player.x -= moveX*speed*dt;
            player.y -= moveY*speed*dt;
          }
        }
      }

      // check finish (tempel) – alleen als gate open is
      if(gateOpen){
        for(let y=0;y<WORLD_HEIGHT;y++){
          for(let x=0;x<WORLD_WIDTH;x++){
            if(world[y][x] === T_TEMPLE){
              const tx1 = x*TILE_SIZE;
              const ty1 = y*TILE_SIZE;
              const tx2 = tx1+TILE_SIZE;
              const ty2 = ty1+TILE_SIZE;
              if(px1 < tx2 && px2 > tx1 && py1 < ty2 && py2 > ty1){
                winMessageTimer = 5;
              }
            }
          }
        }
      }

      // vuurvliegjes
      fireflyTime += dt;
      for(const f of fireflies){
        f.y = f.baseY + Math.sin(f.phase + fireflyTime * f.speed) * f.amp;
        f.x -= f.speed * 4 * dt;
        const maxX = WORLD_WIDTH*TILE_SIZE;
        if(f.x < 0) f.x += maxX;
      }

      if(winMessageTimer > 0){
        winMessageTimer -= dt;
        if(winMessageTimer < 0) winMessageTimer = 0;
      }
      if(secretMessageTimer > 0){
        secretMessageTimer -= dt;
        if(secretMessageTimer < 0) secretMessageTimer = 0;
      }
      if(infoMessageTimer > 0){
        infoMessageTimer -= dt;
        if(infoMessageTimer < 0){
          infoMessageTimer = 0;
          messageStatusEl.textContent = "";
        }
      }
    }

    // ===== TEKENEN =====
    function drawBackground(){
      // lucht
      const grad = ctx.createLinearGradient(0,0,0,canvas.height);
      grad.addColorStop(0,"#041a16");
      grad.addColorStop(0.4,"#04140f");
      grad.addColorStop(1,"#020706");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // vage jungle lagen + maan
      ctx.save();
      // maan
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.arc(canvas.width-50, 28, 14, 0, Math.PI*2);
      ctx.fillStyle = "#dfffe8";
      ctx.fill();
      ctx.globalAlpha = 1;

      // verre heuvels
      ctx.fillStyle = "rgba(8,40,28,0.35)";
      for(let i=0;i<4;i++){
        const baseX = -120 + i*120;
        ctx.beginPath();
        ctx.moveTo(baseX, 70);
        ctx.quadraticCurveTo(baseX+60, 35, baseX+120, 70);
        ctx.lineTo(baseX+120, 100);
        ctx.lineTo(baseX, 100);
        ctx.closePath();
        ctx.fill();
      }

      // silhouet-bomen
      for(let i=0;i<3;i++){
        const yBase = 70 + i*20;
        ctx.fillStyle = `rgba(5,30,18,${0.35 - i*0.08})`;
        for(let x=-1;x<18;x++){
          const treeX = x*40 + (i*12);
          const w = 18;
          const h = 40 + i*10;
          ctx.fillRect(treeX, yBase, w, h);
          ctx.beginPath();
          ctx.moveTo(treeX-5, yBase+10);
          ctx.lineTo(treeX+w/2, yBase-10);
          ctx.lineTo(treeX+w+5, yBase+10);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawTiles(){
      // We project wereld 1:1 op canvas (geen camera, wereld is kleiner dan scherm)
      for(let y=0;y<WORLD_HEIGHT;y++){
        for(let x=0;x<WORLD_WIDTH;x++){
          const t = world[y][x];
          const sx = x*TILE_SIZE;
          const sy = y*TILE_SIZE;

          if(t === T_GROUND){
            ctx.fillStyle = "#0a2617";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#0f3a22";
            ctx.fillRect(sx, sy+TILE_SIZE-4, TILE_SIZE, 4);
          }else if(t === T_TREE){
            ctx.fillStyle = "#1a2610";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#24421a";
            ctx.fillRect(sx+2, sy+2, TILE_SIZE-4, TILE_SIZE-6);
            ctx.fillStyle = "#3a6b26";
            ctx.fillRect(sx+3, sy+1, TILE_SIZE-6, 5);
          }else if(t === T_WATER){
            ctx.fillStyle = "#053146";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#0a5574";
            ctx.fillRect(sx, sy+2, TILE_SIZE, TILE_SIZE-4);
            ctx.fillStyle = "#53c0ff";
            ctx.fillRect(sx+2, sy+4, TILE_SIZE-4, 2);
          }else if(t === T_TALLGRASS){
            ctx.fillStyle = "#092814";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#1e5b27";
            ctx.fillRect(sx, sy+4, TILE_SIZE, TILE_SIZE-4);
            ctx.fillStyle = "#39a13a";
            ctx.fillRect(sx+2, sy+2, TILE_SIZE-4, 3);
          }else if(t === T_GATE){
            ctx.fillStyle = "#2b1a0b";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = gateOpen ? "#4b8a3e" : "#8b5a2e";
            ctx.fillRect(sx+2, sy+3, TILE_SIZE-4, TILE_SIZE-6);
            if(!gateOpen){
              ctx.fillStyle = "#ffd86b";
              ctx.fillRect(sx+5, sy+4, 4,3);
            }
          }else if(t === T_TEMPLE){
            ctx.fillStyle = "#4b3a22";
            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#a78d54";
            ctx.fillRect(sx+2, sy+2, TILE_SIZE-4, TILE_SIZE-4);
            ctx.fillStyle = "#ffd86b";
            ctx.fillRect(sx+4, sy+4, TILE_SIZE-8, 2);
          }
        }
      }

      // vuurvliegjes boven tiles
      for(const f of fireflies){
        ctx.globalAlpha = 0.2 + 0.3*Math.sin(f.phase + fireflyTime*2);
        ctx.fillStyle = "#dfffb0";
        ctx.fillRect(f.x, f.y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    function drawShards(){
      for(const shard of shards){
        if(shard.collected) continue;
        const sx = shard.x;
        const sy = shard.y;
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        // kleine gouden CBS-shard
        ctx.fillStyle = "#ffd86b";
        ctx.beginPath();
        ctx.moveTo(sx+4, sy+1);
        ctx.lineTo(sx+8, sy+5);
        ctx.lineTo(sx+4, sy+9);
        ctx.lineTo(sx,   sy+5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ffefb0";
        ctx.beginPath();
        ctx.moveTo(sx+4, sy+2);
        ctx.lineTo(sx+7, sy+5);
        ctx.lineTo(sx+4, sy+8);
        ctx.lineTo(sx+1, sy+5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    function drawSecretIdol(){
      if(secretIdol.found) return;
      const sx = secretIdol.x;
      const sy = secretIdol.y;
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      // glow
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#ffd86b";
      ctx.beginPath();
      ctx.arc(sx+secretIdol.w/2, sy+secretIdol.h/2, 9, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // idol
      ctx.fillStyle = "#ffd86b";
      ctx.fillRect(sx+1, sy, secretIdol.w-2, secretIdol.h);
      ctx.fillStyle = "#ffefb0";
      ctx.fillRect(sx+2, sy+2, secretIdol.w-4, secretIdol.h-4);

      ctx.fillStyle = "#c28a32";
      ctx.fillRect(sx+3, sy+5, secretIdol.w-6, 2);

      ctx.restore();
    }

    function drawSnakes(){
      for(const s of snakes){
        const sx = s.x;
        const sy = s.y;
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = "#1a7b3a";
        ctx.fillRect(sx, sy, s.w, s.h);
        ctx.fillStyle = "#14552a";
        ctx.fillRect(sx, sy+s.h-3, s.w, 3);
        ctx.fillStyle = "#f7f2d0";
        ctx.fillRect(sx+2, sy+1, 2,2);
        ctx.fillRect(sx+s.w-4, sy+1, 2,2);

        ctx.restore();
      }
    }

    function drawPlayer(){
      const sx = Math.floor(player.x - player.w/2);
      const sy = Math.floor(player.y - player.h/2);

      ctx.save();
      ctx.imageSmoothingEnabled = false;

      // simpel top-down aapje

      // schaduw
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(player.x, player.y+6, 6, 3, 0, 0, Math.PI*2);
      ctx.fill();

      // benen
      ctx.fillStyle = "#8a451f";
      ctx.fillRect(sx+3, sy+8, 3,3);
      ctx.fillRect(sx+7, sy+8, 3,3);

      // buik / lijf
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx+2, sy+4, 10, 5);
      ctx.fillStyle = "#f1c58a";
      ctx.fillRect(sx+4, sy+5, 6, 3);

      // hoofd
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx+1, sy-1, 12, 7);
      ctx.fillStyle = "#f1c58a";
      ctx.fillRect(sx+3, sy+1, 8, 4);

      // oren
      ctx.fillStyle = "#5b3416";
      ctx.fillRect(sx,    sy+1, 3,3);
      ctx.fillRect(sx+10, sy+1, 3,3);

      // gezicht
      ctx.fillStyle = "#000";
      ctx.fillRect(sx+5, sy+2, 1,1);
      ctx.fillRect(sx+8, sy+2, 1,1);
      ctx.fillRect(sx+6, sy+3, 1,1);
      ctx.fillStyle = "#5b3416";
      ctx.fillRect(sx+5, sy+4, 3,1);

      // staart
      ctx.fillStyle = "#c46b32";
      ctx.fillRect(sx-1, sy+3, 2,3);
      ctx.fillRect(sx-2, sy+5, 2,3);

      ctx.restore();
    }

    function drawOverlay(){
      if(secretMessageTimer > 0){
        ctx.save();
        ctx.globalAlpha = Math.min(1, secretMessageTimer / 2);
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(20, 20, canvas.width-40, 40);
        ctx.fillStyle = "#ffd86b";
        ctx.font = "10px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Geheime CBS-idol gevonden! Later koppelen we dit aan CBS earn.", canvas.width/2, 45);
        ctx.restore();
      }

      if(winMessageTimer > 0){
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(20, 60, canvas.width-40, 60);
        ctx.fillStyle = "#9dff7a";
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Je hebt de CBS-tempel bereikt! Shards + geheim worden later je earn.", canvas.width/2, 90);
        ctx.restore();
      }
    }

    function draw(){
      drawBackground();
      drawTiles();
      drawShards();
      drawSecretIdol();
      drawSnakes();
      drawPlayer();
      drawOverlay();
    }

    // ===== Game loop =====
    let lastTime = 0;
    function loop(ts){
      if(!lastTime) lastTime = ts;
      const dt = Math.min(0.033, (ts - lastTime)/1000);
      lastTime = ts;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
