<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CBS • Redirect</title>
  <meta name="robots" content="noindex" />
  <!-- GA4 (vervang G-XXXXXXX door jouw Measurement ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Log een page_view zodat je clicks kunt tellen
    gtag('config', 'G-XXXXXXX', { 'page_title': 'promo_kate', 'page_path': '/promo/kate' });
  </script>
  <style>
    body{margin:0;display:grid;place-items:center;height:100dvh;background:#000;color:#e5e7eb;font:16px/1.5 system-ui,Segoe UI,Inter,Arial}
    .card{background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:20px;max-width:520px;text-align:center}
    .logo{width:72px;height:72px;border-radius:50%;margin-bottom:10px}
    a{color:#a78bfa}
  </style>
</head>
<body>
  <div class="card">
    <img src="../logo.png" class="logo" alt="CBS"/>
    <h1 style="margin:6px 0 4px">Redirecting to CBS</h1>
    <p style="opacity:.8;margin:0 0 12px">If you are not redirected automatically, <a id="fallback" href="#">click here</a>.</p>
  </div>

  <script>
    // Doelpagina met UTM's – pas aan als je naar een andere pagina wilt sturen
    const target = new URL('../join.html', location.href);
    target.searchParams.set('utm_source','kate');
    target.searchParams.set('utm_medium','x');
    target.searchParams.set('utm_campaign','cbs_promo_01');

    document.getElementById('fallback').href = target.toString();

    // korte delay zodat de pageview in analytics binnenkomt
    setTimeout(()=>{ location.replace(target); }, 600);
  </script>
</body>
</html>
