<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBS — Logo Glow Exporter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b1227; --fg:#e5efff; --g:#22c55e; --p:#a78bfa; }
  body{ margin:0; font-family:Inter,system-ui,Segoe UI,Arial; background:var(--bg); color:var(--fg); }
  .wrap{ max-width:900px; margin:32px auto; padding:0 16px; }
  .card{ background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; }
  .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .btn{ background:linear-gradient(90deg, var(--g), var(--p)); color:#0a0a0a; font-weight:800; border:none; border-radius:12px; padding:10px 14px; cursor:pointer; }
  .ghost{ background:rgba(255,255,255,.08); color:#fff; }
  .hint{ opacity:.75; font-size:.9rem; }
  canvas{ background:transparent; max-width:100%; border-radius:12px; border:1px dashed rgba(255,255,255,.15); }
  code{ background:rgba(255,255,255,.08); padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 style="margin:0 0 8px 0;">CBS — Logo Glow Exporter</h1>
    <p class="hint">Laadt <code>logo.png</code> (in deze map) en exporteert PNG’s met groen/paars neon-gloed voor Telegram & X.</p>

    <div class="card" style="margin-top:16px">
      <div class="row">
        <button class="btn" id="export512">Export Telegram 512×512</button>
        <button class="btn" id="export1024">Export X PFP 1024×1024</button>
        <button class="btn" id="exportHeader">Export X Header 1500×500</button>
        <label class="ghost btn" style="display:inline-flex; align-items:center; gap:8px;">
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          Load different logo…
        </label>
      </div>
      <p class="hint" style="margin-top:8px">Tip: Gebruik een PNG met transparante achtergrond voor het mooiste resultaat.</p>
      <div class="row" style="margin-top:16px">
        <canvas id="cvs" width="1024" height="1024"></canvas>
      </div>
    </div>
  </div>

<script>
(function(){
  const g = '#22c55e', p = '#a78bfa';
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'logo.png'; // laad automatisch jouw logo

  function clear(w,h){
    cvs.width = w; cvs.height = h;
    ctx.clearRect(0,0,w,h);
  }

  // tekent zachte neon-glows achter de logo
  function drawGlow(w,h,centerScale=0.7){
    const cx = w/2, cy = h/2;
    const maxR = Math.min(w,h)*0.46;

    // paarse brede gloed
    const gradP = ctx.createRadialGradient(cx,cy,0, cx,cy,maxR);
    gradP.addColorStop(0, 'rgba(167,139,250,0.55)');
    gradP.addColorStop(1, 'rgba(167,139,250,0.00)');
    ctx.fillStyle = gradP;
    ctx.beginPath(); ctx.arc(cx,cy,maxR,0,Math.PI*2); ctx.fill();

    // groene gloed iets kleiner
    const gradG = ctx.createRadialGradient(cx,cy,0, cx,cy,maxR*0.75);
    gradG.addColorStop(0, 'rgba(34,197,94,0.60)');
    gradG.addColorStop(1, 'rgba(34,197,94,0.00)');
    ctx.fillStyle = gradG;
    ctx.beginPath(); ctx.arc(cx,cy,maxR*0.9,0,Math.PI*2); ctx.fill();

    // subtiele highlight ring
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = Math.max(2, Math.min(w,h)*0.004);
    ctx.beginPath(); ctx.arc(cx,cy,maxR*0.97,0,Math.PI*2); ctx.stroke();
  }

  function drawLogoCentered(w,h,scale=0.7, keepAspect=true){
    const L = img;
    if(!L.complete) return;
    const size = Math.min(w,h)*scale;
    let dw = size, dh = size;
    if(keepAspect){
      const r = L.width / L.height;
      if(r>1){ dh = size; dw = size*r; } else { dw = size; dh = size/r; }
      const maxW = size*1.0, maxH = size*1.0;
      // fit within square
      const s = Math.min(maxW/dw, maxH/dh);
      dw *= s; dh *= s;
    }
    const dx = (w - dw)/2;
    const dy = (h - dh)/2;
    ctx.drawImage(L, dx, dy, dw, dh);
  }

  function download(filename){
    const a = document.createElement('a');
    a.download = filename;
    a.href = cvs.toDataURL('image/png');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function renderAndDownload(w,h,logoScale, name){
    clear(w,h);
    // header (breed) heeft andere glow-vorm
    if(w>h){
      // ovale glows
      const cx = w/2, cy = h/2;
      const rx = w*0.35, ry = h*0.45;
      const grdP = ctx.createRadialGradient(cx,cy,0, cx,cy,Math.max(rx,ry));
      grdP.addColorStop(0,'rgba(167,139,250,0.5)');
      grdP.addColorStop(1,'rgba(167,139,250,0.0)');
      ctx.fillStyle = grdP; ctx.fillRect(0,0,w,h);

      const grdG = ctx.createRadialGradient(cx,cy,0, cx,cy,Math.max(rx*0.7,ry*0.7));
      grdG.addColorStop(0,'rgba(34,197,94,0.55)');
      grdG.addColorStop(1,'rgba(34,197,94,0.0)');
      ctx.fillStyle = grdG; ctx.fillRect(0,0,w,h);

      // subtiele rand
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = Math.max(2, Math.min(w,h)*0.004);
      ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
    }else{
      drawGlow(w,h,logoScale);
    }
    drawLogoCentered(w,h,logoScale);
    download(name);
  }

  // eerste preview zodra logo geladen is
  img.onload = ()=>{ renderAndDownload(512,512,0.72,'preview.png'); };

  // UI
  document.getElementById('export512').addEventListener('click', ()=> renderAndDownload(512,512,0.74,'CBS_logo_glow_512.png'));
  document.getElementById('export1024').addEventListener('click', ()=> renderAndDownload(1024,1024,0.70,'CBS_logo_glow_1024.png'));
  document.getElementById('exportHeader').addEventListener('click', ()=> renderAndDownload(1500,500,0.40,'CBS_header_glow_1500x500.png'));

  document.getElementById('fileInput').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    img.onload = ()=>{ URL.revokeObjectURL(url); };
    img.src = url;
  });
})();
</script>
</body>
</html>
