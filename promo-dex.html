<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CBS Coin — Promo Hub (Dexscreener API)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --fg:#e5e7eb; --muted:#cbd5e1;
    --card:#0a0a0a; --border:#222; --radius:16px;
    --g:#22c55e; --p:#a78bfa; --b:#60a5fa; --y:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
  .brand img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 18px rgba(167,139,250,.3)}
  .brand strong{font-size:1rem}
  h1{margin:10px 0 8px;font-size:1.6rem}
  p{margin:.25rem 0;color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
  .input, .filter{
    background:#0b0b0b;border:1px solid var(--border);border-radius:12px;color:#fff;padding:10px 12px
  }
  .input{min-width:260px;flex:1}
  .filter{display:flex;align-items:center;gap:10px}
  .filter label{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:#ddd}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:980px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:640px){ .grid{grid-template-columns:1fr} }

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden
  }
  .banner{
    position:relative;height:140px;background:#0b0b0b url('') center/cover no-repeat
  }
  .icon{
    position:absolute;left:12px;bottom:-22px;width:56px;height:56px;border-radius:14px;background:#000;
    border:2px solid rgba(255,255,255,.1);box-shadow:0 6px 18px rgba(0,0,0,.45);object-fit:cover
  }
  .body{padding:28px 12px 12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-weight:800;letter-spacing:.2px}
  .badge{font-size:.75rem;padding:.25rem .5rem;border-radius:999px;border:1px solid var(--border);background:#0b0b0b}
  .desc{margin:.45rem 0 .7rem;color:var(--muted);font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:.8rem;color:#9aa4b2}
  .bar{height:8px;border-radius:6px;background:#141414;border:1px solid #1e1e1e;overflow:hidden}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--g),#16a34a)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{
    text-decoration:none;color:#fff;background:#0b0b0b;border:1px solid var(--border);padding:.45rem .6rem;border-radius:10px;font-weight:700;font-size:.85rem
  }
  .btn:hover{border-color:#333}
  .btn.ds{border-color:#374151}
  .btn.web{border-color:#2563eb}
  .btn.x{border-color:#a78bfa}
  .btn.tg{border-color:#22c55e}
  .small{font-size:.8rem;color:#9aa4b2}
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="brand" href="index.html"><img src="logo.png" alt="CBS"><strong>CBS Coin</strong></a>
      <div class="small">Promo Hub (Dexscreener API)</div>
    </div>

    <h1>Discovery & Promos</h1>
    <p>Browse tokens pulled from a Dexscreener-style API list. Filter by chain, search text, and jump out to Dexscreener, websites, X or Telegram.</p>

    <div class="tools">
      <input id="q" class="input" placeholder="Search description / domain / token address…">
      <div class="filter">
        <label><input type="checkbox" name="chain" value="solana" checked> Solana</label>
        <label><input type="checkbox" name="chain" value="bsc" checked> BSC</label>
        <label><input type="checkbox" name="chain" value="ethereum" checked> Ethereum</label>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </main>

<script>
/* === 1) PLAK HIER JE DATA ====================================== */

// >>> PLAK HIER JE JSON ARRAY <<<
// Voorbeeld:
// const DATA = [ { "url":"https://dexscreener.com/solana/…", "chainId":"solana", … }, ... ];

const DATA = []; // <- vervang [] door jouw array uit Dexscreener API

/* === 2) HELPER FUNCTIES ======================================== */
const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function shortAddr(addr, pre=6, suf=4){
  if(!addr) return "";
  const a = String(addr);
  return a.length > pre+suf ? a.slice(0,pre) + "…" + a.slice(-suf) : a;
}
function getDomain(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(_){ return ""; }
}
function pickTitle(item){
  // Gebruik X-handle of website domein als titel; anders tokenAddress
  const x = (item.links||[]).find(l => (l.type||"").toLowerCase()==="twitter");
  if(x) {
    const m = x.url.match(/twitter\.com\/(?:i\/communities\/)?([^\/\?\#]+)/i) || x.url.match(/x\.com\/([^\/\?\#]+)/i);
    if(m && m[1]) return "@"+m[1];
  }
  const site = (item.links||[]).find(l => !l.type && l.url);
  if(site) return getDomain(site.url);
  return shortAddr(item.tokenAddress || item.url);
}
function pickBanner(item){
  return item.header || item.openGraph || "";
}
function pickIcon(item){
  // Dexscreener icon veld is vaak een hash naar hun CDN; soms een volledige URL.
  if(!item.icon) return "";
  if(/^https?:\/\//i.test(item.icon)) return item.icon;
  // Hash naar DS CDN:
  return `https://cdn.dexscreener.com/cms/images/${item.icon}`;
}
function linkBtn(href, label, cls){
  if(!href) return "";
  return `<a class="btn ${cls}" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}
function toPct(n){ return Math.round(n*100); }

/* === 3) RENDER ================================================== */
const grid = $("#grid");
const q = $("#q");

function render(){
  const chainsChecked = new Set($$('input[name="chain"]:checked').map(i=>i.value));
  const query = (q.value||"").toLowerCase();

  const rows = DATA
    .filter(it => chainsChecked.has((it.chainId||"").toLowerCase()))
    .filter(it => {
      if(!query) return true;
      const hay = [
        it.description||"",
        it.tokenAddress||"",
        it.url||"",
        ...(it.links||[]).map(l => l.url||"")
      ].join(" ").toLowerCase();
      return hay.includes(query);
    })
    // optioneel: sorteer op resterend/total
    .sort((a,b)=>{
      const ra = (a.amount ?? 0) / ((a.totalAmount ?? 0) || 1);
      const rb = (b.amount ?? 0) / ((b.totalAmount ?? 0) || 1);
      return rb - ra; // hoogste eerst
    })
    .map(item => {
      const title = pickTitle(item);
      const chain = (item.chainId||"").toUpperCase();
      const banner = pickBanner(item);
      const icon = pickIcon(item);
      const ds   = item.url;
      const site = (item.links||[]).find(l => !l.type && l.url)?.url;
      const x    = (item.links||[]).find(l => (l.type||"").toLowerCase()==="twitter")?.url;
      const tg   = (item.links||[]).find(l => (l.type||"").toLowerCase()==="telegram")?.url;

      const haveProgress = Number.isFinite(item.amount) && Number.isFinite(item.totalAmount) && item.totalAmount>0;
      const frac = haveProgress ? Math.max(0, Math.min(1, (item.amount/item.totalAmount))) : 0;

      return `
        <article class="card">
          <div class="banner" style="background-image:url('${banner.replace(/'/g,"\\'")}')">
            ${icon ? `<img class="icon" src="${icon}" alt="">` : ""}
          </div>
          <div class="body">
            <div class="row">
              <div class="title">${title}</div>
              <div class="badge">${chain}</div>
            </div>
            <div class="meta">${shortAddr(item.tokenAddress||"")}</div>
            ${item.description ? `<div class="desc">${(item.description||"").replace(/\n/g," ")}</div>` : ""}
            ${haveProgress ? `
              <div class="bar" title="${item.amount} / ${item.totalAmount}">
                <span style="width:${toPct(frac)}%"></span>
              </div>
              <div class="small" style="margin-top:6px">${item.amount} / ${item.totalAmount}</div>
            ` : ""}
            <div class="btns">
              ${linkBtn(ds,   "Dexscreener", "ds")}
              ${linkBtn(site, "Website",     "web")}
              ${linkBtn(x,    "X / Twitter", "x")}
              ${linkBtn(tg,   "Telegram",    "tg")}
            </div>
          </div>
        </article>
      `;
    }).join("");

  grid.innerHTML = rows || `<p class="small">No results. Try different chains or clear your search.</p>`;
}

q.addEventListener("input", render);
$$('input[name="chain"]').forEach(cb => cb.addEventListener("change", render));

// eerste render (wacht een frame zodat CSS laadt)
requestAnimationFrame(render);
</script>
</body>
</html>
