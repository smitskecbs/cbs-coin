<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBS — Holder Badge Mint</title>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0a; --card:#0b0b0b; --ink:#e8eeff; --muted:#b8c7e8; --border:#1d2333;
    --acc:#1ee0b7; --acc2:#8fe7ff; --warn:#f59e0b;
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 14px 40px}

  /* hero */
  .hero{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden}
  .hero img{width:100%;height:auto;display:block}
  .heroBar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#000;box-shadow:0 0 14px rgba(34,197,94,.35)}
  h1{margin:16px 0 8px;font-size:2rem}
  .sub{color:var(--muted)}

  /* grid */
  .grid{display:grid;gap:16px;grid-template-columns:1.1fr .9fr;margin-top:18px}
  @media (max-width:980px){ .grid{grid-template-columns:1fr} }

  .panel{background:linear-gradient(180deg,#0b0f1e,#0b1326);border:1px solid var(--border);border-radius:18px;padding:16px}

  /* buttons */
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;
    background:#142a4d;color:#dbe9ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  button:hover{filter:brightness(1.05)}
  .primary{background:linear-gradient(180deg,#1ee0b7,#13b58f);color:#042019}
  .muted{background:#132643;color:#bcd1ff}
  .btn-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#0b0b0b;
    border:1px solid rgba(255,255,255,.12);box-shadow:0 0 12px rgba(255,215,0,.25), 0 0 20px rgba(255,215,0,.15) inset}
  .btn-icon svg{width:22px;height:22px;display:block;fill:#f2c431}

  /* kv */
  .kv{display:grid;grid-template-columns:160px 1fr;gap:8px 12px}
  .kv b{color:#cfe4ff}

  /* log */
  .log{width:100%;height:200px;background:#08162c;border:0;color:#aee7ff;border-radius:12px;padding:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.25)}
  .tip{font-size:12px;color:#99b6f0;margin-top:6px}

  a{color:#9de9ff;text-decoration:none}
</style>

<!-- Import Map (no comments; valid JSON) -->
<script type="importmap">
{
  "imports": {
    "@metaplex-foundation/umi": "https://esm.sh/@metaplex-foundation/umi@1.4.1",
    "@metaplex-foundation/umi-bundle-defaults": "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1",
    "@metaplex-foundation/umi-signer-wallet-adapters": "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1",
    "@metaplex-foundation/umi-web3js-adapters": "https://esm.sh/@metaplex-foundation/umi-web3js-adapters@1.4.1",
    "@metaplex-foundation/mpl-token-metadata": "https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.1.0",
    "@metaplex-foundation/mpl-candy-machine": "https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0"
  }
}
</script>

<!-- web3.js (IIFE) for quick Phantom + token balance check -->
<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <img src="Banner-CBS-Coin.jpg" alt="CBS banner" onerror="this.src='Banner-CBS-Coin.webp'">
      <div class="heroBar">
        <img class="logo" src="logo.png" alt="CBS"/>
        <span class="sub">Mainnet-Beta</span>
      </div>
    </section>

    <h1>Mint your CBS Holder Badge</h1>
    <div class="sub">Requirement: <b>≥ 1 CBS</b> in your wallet (token gate). Limit: <b>1 per wallet.</b></div>

    <div class="row" style="margin:10px 0 6px">
      <!-- Gold Telegram icon only (private group) -->
      <a class="btn-icon" href="https://t.me/CBS_Coins" target="_blank" rel="noreferrer" title="Private Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.8 15.8 9.6 19.1c.4 0 .6-.2.8-.4l1.8-1.7 3.9 2.8c.7.4 1.2.2 1.4-.6l2.6-11.6c.2-1-.4-1.4-1.1-1.1L4.3 10.1c-1 .4-1 .9-.2 1.1l4.5 1.4 10.5-6.3c.5-.3 1-.1.6.2l-9.9 7.3Z"/>
        </svg>
      </a>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="row" style="margin-bottom:10px">
          <button id="btnConnect" class="muted">Connect Wallet</button>
          <button id="btnMint" class="primary" disabled>Mint</button>
          <button id="btnCheck" class="muted">Check balance</button>
        </div>
        <textarea id="log" class="log" readonly>idle</textarea>
        <div class="tip">Tip: if something looks off, hard refresh (Ctrl + F5).</div>
      </div>

      <div class="panel">
        <div class="kv">
          <b>Status</b><span id="statusText">Disconnected</span>
          <b>Your CBS</b><span id="cbs">—</span>
          <b>Candy Machine</b><span><code id="cmid"></code></span>
          <b>Candy Guard</b><span><code id="cguard"></code></span>
          <b>Minted</b><span id="minted">—</span>
          <b>Remaining</b><span id="remaining">—</span>
          <b>Network</b><span>Mainnet-Beta</span>
          <b>View CM</b>
          <span>
            <a id="solanafm" target="_blank" rel="noreferrer">SolanaFM</a> •
            <a id="solscan"  target="_blank" rel="noreferrer">Solscan</a>
          </span>
        </div>
      </div>
    </div>
  </div>

<script type="module">
/* -------------------- Config -------------------- */
const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=a9a11d45-2d40-4da0-a3b6-557b855f1e5c"; // jij gaf deze key
const CBS_MINT   = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
const CMID       = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
const CGID       = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";

/* -------------------- Helpers ------------------- */
const $ = (s)=>document.querySelector(s);
const log = (m)=>{ const el=$("#log"); el.value+=(el.value? "\n":"")+m; el.scrollTop=el.scrollHeight; };
const status = (t)=> $("#statusText").textContent=t;

// fill static links
$("#cmid").textContent   = CMID;
$("#cguard").textContent = CGID;
$("#solanafm").href = "https://solana.fm/address/"+CMID;
$("#solscan").href  = "https://solscan.io/account/"+CMID;

/* --------- Wallet connect + token gate --------- */
const btnConnect = $("#btnConnect");
const btnCheck   = $("#btnCheck");
const btnMint    = $("#btnMint");

btnConnect.addEventListener("click", async () => {
  try{
    if (!window.solana){ alert("Install Phantom wallet."); window.open("https://phantom.app/","_blank"); return; }
    const r  = await window.solana.connect(); // opens Phantom
    const pk = r?.publicKey?.toBase58?.() || r?.publicKey || "";
    status(pk ? `Connected: ${pk.slice(0,4)}…${pk.slice(-4)}` : "Connected");
    log(`Connected: ${pk}`);
    await doCheck();
  }catch(e){ console.error(e); log("Connect failed: "+(e.message||e)); }
});

btnCheck.addEventListener("click", doCheck);

async function doCheck(){
  try{
    if (!window.solana?.publicKey){ log("Wallet not connected."); return; }
    const owner = typeof window.solana.publicKey.toBase58==="function"
      ? window.solana.publicKey
      : new solanaWeb3.PublicKey(window.solana.publicKey);

    const conn  = new solanaWeb3.Connection(HELIUS_RPC,"confirmed");
    const res   = await conn.getParsedTokenAccountsByOwner(
      owner, { mint: new solanaWeb3.PublicKey(CBS_MINT) }
    );
    const bal = (res.value||[])
      .map(a=>a.account.data.parsed.info.tokenAmount.uiAmount||0)
      .reduce((a,b)=>a+b,0);
    $("#cbs").textContent = String(bal);
    if (bal>=1){ btnMint.disabled=false; log("✅ Token gate OK: you hold ≥ 1 CBS."); }
    else { btnMint.disabled=true; log("⛔ Token gate: need ≥ 1 CBS to mint."); }
  }catch(e){ console.error(e); log("Balance check failed: "+(e.message||e)); }
}

/* -------------- Umi loader (robust) -------------- */
async function loadUmiModules(){
  // 1) try import map/bare imports
  try{
    const [bundle, core, adaptersA, adaptersB, tm, cm] = await Promise.all([
      import("@metaplex-foundation/umi-bundle-defaults"),
      import("@metaplex-foundation/umi"),
      import("@metaplex-foundation/umi-signer-wallet-adapters").catch(()=>null),
      import("@metaplex-foundation/umi-web3js-adapters").catch(()=>null),
      import("@metaplex-foundation/mpl-token-metadata"),
      import("@metaplex-foundation/mpl-candy-machine"),
    ]);
    return { bundle, core, adaptersA, adaptersB, tm, cm };
  }catch(e){
    // 2) explicit URLs fallback
    const [bundle, core, adaptersA, adaptersB, tm, cm] = await Promise.all([
      import("https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1"),
      import("https://esm.sh/@metaplex-foundation/umi@1.4.1"),
      import("https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1").catch(()=>null),
      import("https://esm.sh/@metaplex-foundation/umi-web3js-adapters@1.4.1").catch(()=>null),
      import("https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.1.0"),
      import("https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0"),
    ]);
    return { bundle, core, adaptersA, adaptersB, tm, cm };
  }
}

/* -------------------- Mint ---------------------- */
btnMint.addEventListener("click", doMint);

async function doMint(){
  try{
    if (!window.solana?.publicKey){ alert("Connect your wallet first."); return; }
    btnMint.disabled = true;
    log("Preparing mint… (loading modules)");

    const { bundle, core, adaptersA, adaptersB, tm, cm } = await loadUmiModules();
    const { createUmi } = bundle;
    const { publicKey: pk, generateSigner, signerIdentity } = core;
    const { mplTokenMetadata } = tm;
    const { mplCandyMachine, fetchCandyMachine, mintV2 } = cm;

    const umi = createUmi(HELIUS_RPC)
      .use(mplTokenMetadata())
      .use(mplCandyMachine());

    // attach identity (prefer wallet-adapters plugin; fallback to web3js-adapters)
    let identityAttached = false;

    if (adaptersA && adaptersA.walletAdapterIdentity){
      // If package provides helper to wrap window.solana:
      let walletAdapter = null;
      if (adaptersA.createWalletAdapterFromWallet) {
        walletAdapter = adaptersA.createWalletAdapterFromWallet(window.solana);
      } else if (adaptersA.createWalletAdapter) {
        walletAdapter = adaptersA.createWalletAdapter(window.solana);
      }
      if (walletAdapter){
        umi.use(adaptersA.walletAdapterIdentity(walletAdapter));
        identityAttached = true;
      }
    }

    if (!identityAttached && adaptersB){
      const make =
        adaptersB.createSignerFromWalletAdapter ||
        adaptersB.createSignerFromWallet ||
        null;
      if (make){
        umi.use(signerIdentity(make(window.solana)));
        identityAttached = true;
      }
    }

    if (!identityAttached){
      alert("Mint failed: could not attach wallet adapter. Is Phantom installed?");
      log("❌ Mint failed: wallet adapter not available.");
      return;
    }

    // warm-up + ids in UI
    await fetchCandyMachine(umi, pk(CMID));
    $("#cmid").textContent = CMID;
    $("#cguard").textContent = CGID;

    const nftMint = generateSigner(umi);

    const txb = await mintV2(umi, {
      candyMachine: pk(CMID),
      candyGuard:   pk(CGID),
      nftMint,
    });

    const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
    log("✅ Minted! Tx:\n"+signature);
    alert("Mint successful!");

  }catch(e){
    console.error(e);
    alert("Mint failed: " + (e?.message || e));
    log("❌ Mint failed: " + (e?.message || e));
  }finally{
    btnMint.disabled = false;
  }
}
</script>
</body>
</html>
