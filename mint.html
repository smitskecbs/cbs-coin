<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CBS — Holder Badge Mint</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg:#0a0a0a; --card:#0f1115; --ink:#e6e9ef; --muted:#cbd5e1; --line:#1f2430;
      --r:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Inter,Roboto,Arial,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .hero{position:relative;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .hero img.banner{width:100%;height:auto;display:block;object-fit:cover;max-height:360px}
    .hero img.logo{
      position:absolute; left:14px; bottom:14px; width:86px; height:86px; object-fit:cover;
      border-radius:50%; background:#000; border:1px solid rgba(255,255,255,.14);
      filter: drop-shadow(0 0 10px rgba(241,196,15,.45)) drop-shadow(0 0 18px rgba(167,139,250,.25));
    }
    h1{font-size:clamp(24px,3vw,36px);margin:18px 0 8px}
    p{color:var(--muted);margin:0 0 8px}
    .row{display:flex;gap:18px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
    .card.grow{flex:1 1 480px}
    .card.side{flex:1 1 360px}
    .btn{appearance:none;border:1px solid #2a3242;background:#12151b;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .cluster{display:flex;gap:10px;flex-wrap:wrap}
    textarea{width:100%;height:220px;background:#0b1020;color:#dbe3ff;border:1px solid #223;outline:none;border-radius:12px;padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace}
    .kv{display:grid;grid-template-columns:180px 1fr;gap:6px 12px}
    .kv div{padding:4px 0;border-bottom:1px dashed #222}
    .links a{color:#bcd1ff;text-decoration:none}
    .links a:hover{text-decoration:underline}
    .tg{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;
        background: radial-gradient(circle at 30% 30%,#ffe27a,#d4a814 70%); border:1px solid rgba(255,255,255,.15);
        box-shadow:0 0 12px rgba(241,196,15,.35), 0 0 20px rgba(167,139,250,.18); transition:transform .1s}
    .tg:hover{transform:translateY(-2px)}
    .tg svg{width:24px;height:24px;display:block;filter:drop-shadow(0 0 4px rgba(0,0,0,.35))}
    .tip{color:#9aa0a6;font-size:12px;margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <img class="banner" src="Banner-CBS-Coin.jpg" alt="CBS banner" onerror="this.remove()">
      <img class="logo"   src="logo.png"          alt="CBS logo"   onerror="this.remove()">
    </section>

    <h1>Mint your CBS Holder Badge</h1>
    <p>Requirement: <strong>&ge; 1 CBS</strong> in your wallet (token gate). Limit: <strong>1 per wallet</strong>.</p>

    <div class="row">
      <section class="card grow">
        <div class="cluster" style="margin-bottom:12px">
          <button class="btn" id="btnConnect">Connect Wallet</button>
          <button class="btn" id="btnMint" disabled>Mint</button>
          <button class="btn" id="btnCheck">Check balance</button>
          <a class="tg" href="https://t.me/CBS_Coins" target="_blank" rel="noopener" aria-label="Private Telegram for holders">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path fill="#1b1f2a" d="M0 0h24v24H0z" opacity="0"/>
              <path fill="#111" d="M9.031 13.875l-.375 3.094c.562 0 .812-.25 1.125-.562l2.688-2.594 5.594 4.09c.109.57 1.758.266 2.039-.953l3.691-17.32c.328-1.523-.55-2.125-1.547-1.75L2.25 8.3C.805 8.91.812 9.73 2.047 10.11l5.925 1.86L18.297 4.75c.555-.34 1.07-.156.65.19l-9.916 8.935z"/>
            </svg>
          </a>
        </div>
        <textarea id="log" readonly>idle</textarea>
        <div class="tip">Tip: if something looks off, hard refresh (Ctrl+F5).</div>
      </section>

      <aside class="card side">
        <div class="kv">
          <div>Status</div> <div id="statusText">Disconnected</div>
          <div>Your CBS</div> <div id="cbs">—</div>
          <div>Candy Machine</div> <div id="cmid">—</div>
          <div>Candy Guard</div> <div id="cguard">—</div>
          <div>Minted</div> <div>—</div>
          <div>Remaining</div> <div>—</div>
          <div>Network</div> <div>Mainnet-Beta</div>
          <div>View CM</div>
          <div class="links">
            <a id="solanafm" href="#" target="_blank" rel="noopener">SolanaFM</a> •
            <a id="solscan" href="#" target="_blank" rel="noopener">Solscan</a>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- MINT LOGIC -->
  <script type="module">
    // ------- Your config -------
    const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=a9a11d45-2d40-4da0-a3b6-557b855f1e5c";
    const CBS_MINT   = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
    const CMID       = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
    const CGID       = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";

    // ------- small helpers -------
    const $ = (s)=>document.querySelector(s);
    const log = (m)=>{ const el=$("#log"); el.value += (el.value? "\n":"")+m; el.scrollTop=el.scrollHeight; }
    const setStatus = (t)=> $("#statusText").textContent = t;
    $("#cmid").textContent   = CMID;
    $("#cguard").textContent = CGID;
    $("#solanafm").href = "https://solana.fm/address/"+CMID;
    $("#solscan").href  = "https://solscan.io/account/"+CMID;

    // ------- resilient importer (5 CDNs + local /vendor) -------
    const CDN = {
      esm:   (pkg,v,extra="") => `https://esm.sh/${pkg}@${v}${extra}`,
      jsd:   (pkg,v)          => `https://cdn.jsdelivr.net/npm/${pkg}@${v}/+esm`,
      unpkg: (pkg,v)          => `https://unpkg.com/${pkg}@${v}?module`,
      sky:   (pkg,v)          => `https://cdn.skypack.dev/${pkg}@${v}`,
      loc:   (file)           => new URL(file, import.meta.url).href,
    };
    async function tryImport(urls){
      for(const u of urls){
        try{ return await import(u); }
        catch(e){ console.warn("import failed:", u, e?.message||e); }
      }
      return null;
    }

    // package URL sets
    const web3Urls = [
      CDN.esm("@solana/web3.js","1.98.4","?target=es2022"),
      CDN.jsd("@solana/web3.js","1.98.4"),
      CDN.unpkg("@solana/web3.js","1.98.4"),
      CDN.sky("@solana/web3.js","1.98.4"),
      CDN.loc("./vendor/umi.bundle.mjs") // harmless: brings web3 via umi bundle defaults when local
    ];
    const umiBundleUrls = [
      CDN.esm("@metaplex-foundation/umi-bundle-defaults","1.4.1"),
      CDN.jsd("@metaplex-foundation/umi-bundle-defaults","1.4.1"),
      CDN.unpkg("@metaplex-foundation/umi-bundle-defaults","1.4.1"),
      CDN.sky("@metaplex-foundation/umi-bundle-defaults","1.4.1"),
      CDN.loc("./vendor/umi-bundle-defaults.bundle.mjs"),
    ];
    const umiCoreUrls = [
      CDN.esm("@metaplex-foundation/umi","1.4.1"),
      CDN.jsd("@metaplex-foundation/umi","1.4.1"),
      CDN.unpkg("@metaplex-foundation/umi","1.4.1"),
      CDN.sky("@metaplex-foundation/umi","1.4.1"),
      CDN.loc("./vendor/umi.bundle.mjs"),
    ];
    const waSignerUrls = [
      CDN.esm("@metaplex-foundation/umi-signer-wallet-adapters","1.4.1","?exports=walletAdapterIdentity,walletAdapterIdentityPlugin,createWalletAdapterFromWallet,createWalletAdapter"),
      CDN.jsd("@metaplex-foundation/umi-signer-wallet-adapters","1.4.1"),
      CDN.unpkg("@metaplex-foundation/umi-signer-wallet-adapters","1.4.1"),
      CDN.sky("@metaplex-foundation/umi-signer-wallet-adapters","1.4.1"),
      CDN.loc("./vendor/umi-signer-wallet-adapters.bundle.mjs"),
    ];
    const w3AdaptersUrls = [
      CDN.esm("@metaplex-foundation/umi-web3js-adapters","1.4.1","?exports=createSignerFromWallet,createSignerFromWalletAdapter"),
      CDN.jsd("@metaplex-foundation/umi-web3js-adapters","1.4.1"),
      CDN.unpkg("@metaplex-foundation/umi-web3js-adapters","1.4.1"),
      CDN.sky("@metaplex-foundation/umi-web3js-adapters","1.4.1"),
      CDN.loc("./vendor/umi-web3js-adapters.bundle.mjs"),
    ];
    const tokenMetaUrls = [
      CDN.esm("@metaplex-foundation/mpl-token-metadata","3.1.0"),
      CDN.jsd("@metaplex-foundation/mpl-token-metadata","3.1.0"),
      CDN.unpkg("@metaplex-foundation/mpl-token-metadata","3.1.0"),
      CDN.sky("@metaplex-foundation/mpl-token-metadata","3.1.0"),
      CDN.loc("./vendor/mpl-token-metadata.bundle.mjs"),
    ];
    const candyUrls = [
      CDN.esm("@metaplex-foundation/mpl-candy-machine","6.1.0"),
      CDN.jsd("@metaplex-foundation/mpl-candy-machine","6.1.0"),
      CDN.unpkg("@metaplex-foundation/mpl-candy-machine","6.1.0"),
      CDN.sky("@metaplex-foundation/mpl-candy-machine","6.1.0"),
      CDN.loc("./vendor/mpl-candy-machine.bundle.mjs"),
    ];

    // import libs (with fallbacks)
    const web3      = await tryImport(web3Urls);
    const bundle    = await tryImport(umiBundleUrls);
    const core      = await tryImport(umiCoreUrls);
    const waSigner  = await tryImport(waSignerUrls);
    const w3Adapters= await tryImport(w3AdaptersUrls);
    const tm        = await tryImport(tokenMetaUrls);
    const cm        = await tryImport(candyUrls);

    if(!web3 || !bundle || !core || !tm || !cm){
      alert("Mint failed: Could not load modules (all CDNs + /vendor failed).");
      throw new Error("module load failure");
    }

    const { Connection, PublicKey } = web3;
    const { createUmi } = bundle;
    const { publicKey: pk, generateSigner, signerIdentity } = core;
    const { mplTokenMetadata } = tm;
    const { mplCandyMachine, fetchCandyMachine, mintV2 } = cm;

    // ------- UI buttons -------
    const btnConnect = $("#btnConnect");
    const btnMint    = $("#btnMint");
    const btnCheck   = $("#btnCheck");

    btnConnect.addEventListener("click", async ()=>{
      try{
        if(!window.solana){ alert("Install Phantom (https://phantom.app)"); return; }
        const r = await window.solana.connect();
        const pkStr = r?.publicKey?.toBase58?.() || "";
        setStatus(pkStr ? `Connected: ${pkStr.slice(0,4)}…${pkStr.slice(-4)}` : "Connected");
        log(`Connected: ${pkStr}`);
        await doCheck();
      }catch(e){ console.error(e); log("Connect failed: "+(e.message||e)); }
    });

    btnCheck.addEventListener("click", doCheck);

    async function doCheck(){
      try{
        if(!window.solana?.publicKey){ log("Wallet not connected."); return; }
        const owner = typeof window.solana.publicKey.toBase58==="function"
          ? window.solana.publicKey
          : new PublicKey(window.solana.publicKey);
        const conn = new Connection(HELIUS_RPC,"confirmed");
        const res  = await conn.getParsedTokenAccountsByOwner(owner, { mint: new PublicKey(CBS_MINT) });
        const cbs  = (res.value||[]).map(a=>a.account.data.parsed.info.tokenAmount.uiAmount||0).reduce((a,b)=>a+b,0);
        $("#cbs").textContent = String(cbs);
        if(cbs>=1){ btnMint.disabled=false; log("✅ Token gate OK: you hold ≥ 1 CBS."); }
        else { btnMint.disabled=true; log("⛔ Token gate: need ≥ 1 CBS to mint."); }
      }catch(e){ console.error(e); log("Balance check failed: "+(e.message||e)); }
    }

    btnMint.addEventListener("click", doMint);

    async function attachIdentity(umi){
      // 1) Best: walletAdapterIdentity (umi-signer-wallet-adapters)
      if (waSigner?.walletAdapterIdentity || waSigner?.walletAdapterIdentityPlugin) {
        try{
          const makeWA = waSigner.createWalletAdapterFromWallet || waSigner.createWalletAdapter || null;
          if (makeWA) {
            const wa = makeWA(window.solana);
            const plug = waSigner.walletAdapterIdentity || waSigner.walletAdapterIdentityPlugin;
            umi.use(plug(wa));
            return true;
          }
        }catch(e){ console.warn("walletAdapterIdentity failed", e); }
      }
      // 2) Fallback: createSignerFromWallet (umi-web3js-adapters)
      if (w3Adapters?.createSignerFromWallet) {
        try{
          umi.use(signerIdentity(w3Adapters.createSignerFromWallet(window.solana)));
          return true;
        }catch(e){ console.warn("createSignerFromWallet failed", e); }
      }
      // 3) Fallback: createSignerFromWalletAdapter (if Phantom exposes adapter)
      if (w3Adapters?.createSignerFromWalletAdapter && window?.phantom?.solana?.adapter) {
        try{
          umi.use(signerIdentity(w3Adapters.createSignerFromWalletAdapter(window.phantom.solana.adapter)));
          return true;
        }catch(e){ console.warn("createSignerFromWalletAdapter failed", e); }
      }
      return false;
    }

    async function doMint(){
      try{
        if(!window.solana?.publicKey){ alert("Connect your wallet first."); return; }
        btnMint.disabled = true;
        log("Preparing mint… (loading modules)");

        const umi = createUmi(HELIUS_RPC)
          .use(mplTokenMetadata())
          .use(mplCandyMachine());

        const ok = await attachIdentity(umi);
        if(!ok){
          log("❌ Mint failed: wallet adapter not available.");
          alert("Mint failed: wallet adapter not available.");
          return;
        }

        await fetchCandyMachine(umi, pk(CMID));   // warm-up
        const nftMint = generateSigner(umi);
        const txb = await mintV2(umi, {
          candyMachine: pk(CMID),
          candyGuard:   pk(CGID),
          nftMint,
        });

        const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
        log("✅ Minted! Tx:\n"+signature);
        alert("Mint successful!");
      }catch(e){
        console.error(e);
        alert("Mint failed: "+(e?.message||e));
        log("❌ Mint failed: "+(e?.message||e));
      }finally{
        btnMint.disabled = false;
      }
    }
  </script>
</body>
</html>
