<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CBS — Holders Mint</title>

  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#0e0f12; --panel:#0f1218; --card:#151a23; --ink:#e9fbff; --muted:#a9c9d0;
      --accent:#7dffe9; --accent2:#7ab7ff; --ok:#1fe39f; --warn:#ffb167; --err:#ff6b6b;
      --ring:0 12px 30px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:
        radial-gradient(900px 700px at 110% -10%,rgba(125,255,233,.15),transparent 60%),
        radial-gradient(900px 700px at -10% 110%,rgba(122,183,255,.14),transparent 60%),
        var(--bg);
      color:var(--ink);
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }
    .wrap{max-width:1100px;margin:0 auto;padding:16px 14px 48px}

    /* Banner */
    .banner{
      position:relative; overflow:hidden; border-radius:18px;
      border:1px solid rgba(255,255,255,.08); box-shadow:var(--ring);
      margin-bottom:14px; background:#0c1016;
    }
    .banner img{
      width:100%; height:auto; display:block; object-fit:cover;
      max-height:260px;
    }
    @media (max-width: 640px){
      .banner img{ max-height:160px; object-position:center; }
    }

    .hero{
      display:grid; grid-template-columns:100px 1fr; gap:14px; align-items:center;
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
      border-radius:18px; box-shadow:var(--ring); border:1px solid rgba(255,255,255,.08);
      padding:14px;
    }
    .logoBox{width:100px;height:100px;border-radius:14px;overflow:hidden;background:#0c1016;display:grid;place-items:center}
    .logo{width:100%;height:100%;object-fit:contain}
    .title{
      margin:0; font:46px/1 "Bangers", system-ui; letter-spacing:.4px;
      background:linear-gradient(90deg,#7ab7ff,#7dffe9,#ffde59,#ff7ab6,#7ab7ff);
      background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
      animation: rainbow 8s linear infinite;
      text-shadow:0 3px 0 rgba(0,0,0,.25);
    }
    .sub{margin:6px 0 0; color:var(--muted); font-weight:600}
    @keyframes rainbow{0%{background-position:0% 0}100%{background-position:300% 0}}

    .grid{display:grid; gap:14px; grid-template-columns:1fr}
    @media (min-width: 940px){ .grid{grid-template-columns:1fr 1fr} }
    .card{
      background:linear-gradient(180deg,var(--card),rgba(21,26,35,.7));
      border:1px solid rgba(255,255,255,.08); border-radius:18px; box-shadow:var(--ring); padding:14px;
    }
    .span2{grid-column:1/-1}

    .h3{margin:2px 0 10px; font:30px/1 "Bangers",system-ui; letter-spacing:.3px}
    .p{margin:0;color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .mono{font-family:ui-monospace,Menlo,Monaco,Consolas,"Courier New",monospace}

    .badge{
      display:inline-flex; align-items:center; padding:10px 12px; border-radius:12px;
      background:linear-gradient(90deg,#7ab7ff,#7dffe9,#ffde59,#ff7ab6);
      color:#00141a; font-weight:900; border:1px solid rgba(255,255,255,.25);
      cursor:pointer; user-select:none;
      transition:opacity .2s ease, transform .04s ease;
    }
    .badge:active{ transform:translateY(1px) }
    .badge.disabled{ opacity:.55; cursor:not-allowed }

    input.read{
      width:100%; min-width:260px; padding:11px 12px; border-radius:12px;
      border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--ink); font-weight:700;
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      min-width:140px; padding:12px 18px; border-radius:14px; cursor:pointer;
      background:linear-gradient(180deg,#7dffe9,#47f0d3); color:#03221e; font-weight:900;
      border:1px solid rgba(255,255,255,.18); box-shadow:0 16px 35px rgba(2,240,210,.15), inset 0 -6px 0 rgba(0,0,0,.18);
      text-decoration:none;
    }
    .btn:disabled{opacity:.55; cursor:not-allowed}

    .meter{height:10px;border-radius:8px;background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); overflow:hidden}
    .meter > i{display:block;height:100%; background:linear-gradient(90deg,#1fe39f,#7dffe9); width:0%}

    .note{margin:8px 0 0; color:var(--muted)}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}

    .walletSelect{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    .walletSelect select{
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      color:var(--ink); padding:10px 12px; border-radius:12px; font-weight:700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Banner -->
    <div class="banner">
      <img src="Banner-CBS-Coin.webp" alt="CBS Banner" loading="eager" decoding="async">
    </div>

    <!-- HERO -->
    <section class="hero">
      <div class="logoBox">
        <img class="logo" src="logo.png" alt="CBS" onerror="this.style.visibility='hidden'"/>
      </div>
      <div>
        <h1 class="title">CBS — Holders Mint</h1>
        <p class="sub">Holders-only: need ≥ 1 CBS. No bot tax — only Solana network fees.</p>
      </div>
    </section>

    <div class="grid" style="margin-top:14px;">
      <!-- WALLET -->
      <section class="card">
        <h2 class="h3">Wallet</h2>
        <div class="row walletSelect">
          <select id="walletPicker" aria-label="Choose wallet">
            <option value="auto">Auto</option>
            <option value="phantom">Phantom</option>
            <option value="solflare">Solflare</option>
            <option value="backpack">Backpack</option>
            <option value="generic">Generic (window.solana)</option>
          </select>
          <button id="btnConnect" class="btn">Connect</button>
          <span id="who" class="note mono">—</span>
        </div>

        <div class="row" style="margin-top:10px;">
          <!-- DIT IS NU JE MINTKNOP -->
          <span id="mintBadge" class="badge disabled" title="Connect & meet CBS requirement to mint">CBS token mint</span>
          <input id="cbsField" class="read mono" readonly>
        </div>

        <p class="note" style="margin-top:8px;">Your CBS balance: <b id="cbsBal">—</b> CBS</p>
        <p id="holderMsg" class="note warn">You need at least 1 CBS to mint.</p>
        <p class="note"><a id="cbsSol" class="mono" target="_blank" rel="noreferrer">View CBS on Solscan</a></p>
      </section>

      <!-- DROP -->
      <section class="card">
        <h2 class="h3">Drop Status</h2>
        <div class="row">
          <span class="badge" style="cursor:default">Candy Machine</span>
          <input id="cmField" class="read mono" readonly>
        </div>

        <div class="meter" style="margin:10px 0 8px;"><i id="meterFill"></i></div>
        <p class="note">Minted: <b id="minted">0</b> / <b id="available">0</b></p>

        <div class="row" style="margin-top:8px;">
          <button id="btnRefresh" class="btn">Refresh</button>
          <a id="cmSol" class="btn" target="_blank" rel="noreferrer">Open in Solscan</a>
        </div>
      </section>
    </div>
  </div>

  <!-- Wallet adapters via UMD (stabiel, geen ESM 404's) -->
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-phantom@0.9.27/lib/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-solflare@0.6.34/lib/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-backpack@0.1.15/lib/umd/index.min.js"></script>

  <!-- App -->
  <script type="module">
    // ===== Imports (Metaplex stack) =====
    import { createUmi } from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";
    import { publicKey, generateSigner, transactionBuilder, some, none, publicKey as pk } from "https://esm.sh/@metaplex-foundation/umi@1.4.1";
    import { walletAdapterIdentity } from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1";
    import { mplCandyMachine, fetchCandyMachine, fetchCandyGuard, mintV2 } from "https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0";
    import { mplTokenMetadata } from "https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.2.0";
    import { setComputeUnitLimit } from "https://esm.sh/@metaplex-foundation/mpl-toolbox@0.9.1";
    import { Connection, PublicKey, LAMPORTS_PER_SOL } from "https://esm.sh/@solana/web3.js@1.95.3";

    // ===== Config =====
    const HELIUS_KEY      = "0eb350f0-a032-468c-8b03-b8b079e09611";
    const RPC_URL         = `https://mainnet.helius-rpc.com/?api-key=${HELIUS_KEY}`;

    const AUTHORITY_WALLET= "3hCAFVgERpezg2viff2DtFvdundfvykUM1VVKqjPehvp";
    const CANDY_MACHINE   = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
    const CANDY_GUARD     = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";
    const COLLECTION_MINT = "Fp4f823DUmtP114ACzNHZQgY2DjjviQgUELWXS7WyDSm";
    const CBS_MINT        = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";

    const CBS_THRESHOLD   = 1;
    const MIN_SOL_RENT    = 0.02;
    const GUARD_GROUP     = null;

    // ===== Helpers =====
    const $ = (id)=>document.getElementById(id);
    const setTxt = (el,v)=>{ if(typeof el==='string') el=$(el); if(!el) return; el.textContent=v; };
    const fmt = (n)=>Number(n ?? 0).toLocaleString("en-US");

    // Prefill UI
    $("cbsField").value = CBS_MINT;
    $("cbsSol").href   = "https://solscan.io/token/"+CBS_MINT;
    $("cmField").value = CANDY_MACHINE;
    $("cmSol").href    = "https://solscan.io/account/"+CANDY_MACHINE;

    // ===== Chain =====
    const connection = new Connection(RPC_URL, "confirmed");
    const umi = createUmi(RPC_URL).use(mplCandyMachine()).use(mplTokenMetadata());
    let wallet=null, connected=false, cm, SOLD_OUT=false;

    // ===== Wallet adapters (UMD globals) =====
    const PhantomNS  = window.solanaWalletAdapterPhantom;
    const SolflareNS = window.solanaWalletAdapterSolflare;
    const BackpackNS = window.solanaWalletAdapterBackpack;

    function detectInstalled(){
      const list = [];
      try {
        if (window?.phantom?.solana?.isPhantom) list.push("phantom");
        if (window?.solflare?.isSolflare) list.push("solflare");
        if (window?.backpack?.isBackpack) list.push("backpack");
        if (window?.solana && !list.length) list.push("generic");
      } catch(_) {}
      return list;
    }

    async function getAdapter(kind){
      switch(kind){
        case "phantom":
          if (!PhantomNS?.PhantomWalletAdapter) throw new Error("Phantom adapter not found");
          return new PhantomNS.PhantomWalletAdapter();
        case "solflare":
          if (!SolflareNS?.SolflareWalletAdapter) throw new Error("Solflare adapter not found");
          return new SolflareNS.SolflareWalletAdapter();
        case "backpack":
          if (!BackpackNS?.BackpackWalletAdapter) throw new Error("Backpack adapter not found");
          return new BackpackNS.BackpackWalletAdapter();
        case "generic":
          // Probeer Phantom-adapter: veel wallets emuleren Phantom API via window.solana
          if (!PhantomNS?.PhantomWalletAdapter) throw new Error("Generic provider not available");
          return new PhantomNS.PhantomWalletAdapter();
        default:
          const order = ["phantom","solflare","backpack","generic"];
          const installed = detectInstalled();
          const pick = order.find(x => installed.includes(x)) || "phantom";
          return getAdapter(pick);
      }
    }

    // ===== Balances =====
    async function getCbsBalance(ownerPk){
      const res = await connection.getParsedTokenAccountsByOwner(ownerPk, { mint: new PublicKey(CBS_MINT) });
      let total = 0;
      for (const acc of (res.value||[])){
        const ui = acc.account?.data?.parsed?.info?.tokenAmount?.uiAmount;
        total += Number(ui||0);
      }
      return total;
    }
    async function getSolBalance(ownerPk){
      const lamports = await connection.getBalance(ownerPk, "confirmed");
      return lamports / LAMPORTS_PER_SOL;
    }

    // ===== UI state =====
    function setSoldUI(minted, available){
      setTxt("minted", fmt(minted));
      setTxt("available", fmt(available));
      const pct = (available>0) ? Math.min(100, Math.max(0,(minted/available)*100)) : 0;
      $("meterFill").style.width = pct.toFixed(2)+"%";
      SOLD_OUT = (available>0 && minted >= available);
      updateMintBadgeState();
      if (SOLD_OUT) { setTxt("mintMsg","Sold out"); $("mintMsg").className="note warn"; }
    }

    function updateMintBadgeState(canMint=false){
      const b = $("mintBadge");
      if (SOLD_OUT || !connected || !canMint){
        b.classList.add("disabled");
      } else {
        b.classList.remove("disabled");
      }
    }

    async function refresh(){
      try{
        cm = await fetchCandyMachine(umi, publicKey(CANDY_MACHINE));
        const minted = Number(cm.itemsRedeemed ?? cm.data?.itemsRedeemed ?? cm.itemsMinted ?? 0);
        const avail  = Number(cm.itemsAvailable ?? cm.data?.itemsAvailable ?? cm.itemsLoaded ?? 0);
        setSoldUI(minted, avail);
      }catch(e){
        console.error(e);
        setTxt("mintMsg","Failed to load drop data."); $("mintMsg").className="note err";
      }
    }

    // ===== Wallet connect =====
    async function connectWallet(){
      try{
        const picked = $("walletPicker").value;
        wallet = await getAdapter(picked);
        await wallet.connect();
        umi.use(walletAdapterIdentity(wallet));
        connected = true;
        const pkb58 = wallet.publicKey.toBase58();
        setTxt("who", "Connected: "+pkb58.slice(0,6)+"…"+pkb58.slice(-6));
        await updateHolderState();
      }catch(e){
        console.error(e);
        setTxt("who","—");
        if (/not found|adapter/i.test(e?.message||"")) {
          window.open("https://phantom.app/download","_blank");
        }
      }
    }

    async function updateHolderState(){
      if (!connected || !wallet?.publicKey) return;
      try{
        const [cbs, sol] = await Promise.all([
          getCbsBalance(wallet.publicKey),
          getSolBalance(wallet.publicKey),
        ]);
        setTxt("cbsBal", fmt(cbs));

        const hasCBS = cbs >= CBS_THRESHOLD;
        const hasSOL = sol >= MIN_SOL_RENT;

        if (hasCBS && hasSOL){
          $("holderMsg").className = "note ok";
          setTxt("holderMsg","CBS OK, you can mint ✅");
          updateMintBadgeState(true);
        } else {
          $("holderMsg").className = "note warn";
          let m = [];
          if (!hasCBS) m.push("Need ≥ 1 CBS.");
          if (!hasSOL) m.push(`Need ~${MIN_SOL_RENT} SOL for rent.`);
          setTxt("holderMsg", m.join(" "));
          updateMintBadgeState(false);
        }
      }catch(e){
        console.error(e);
        $("holderMsg").className="note err";
        setTxt("holderMsg","Could not read wallet balances.");
        updateMintBadgeState(false);
      }
    }

    function showTxLink(signature,label="View tx"){
      if (!signature) return;
      const a = document.createElement("a");
      a.href = "https://solscan.io/tx/"+signature;
      a.target="_blank"; a.rel="noreferrer";
      a.textContent = label;
      a.style.marginLeft="8px";
      $("mintMsg").appendChild(a);
    }

    // ===== Guard: auto-mintArgs =====
    async function detectMintArgs(){
      try{
        const guard = await fetchCandyGuard(umi, pk(CANDY_GUARD));
        let mintArgs = {};
        const tk = guard.guards?.tokenGate;
        const tkSome = tk && tk.__option === "Some";
        if (tkSome) {
          mintArgs.tokenGate = some({ mint: pk(CBS_MINT) });
        }
        if (Object.keys(mintArgs).length === 0) return none();
        return mintArgs;
      } catch(e) {
        return none();
      }
    }

    // ===== Mint =====
    async function doMint(){
      try{
        if(!connected || SOLD_OUT) return;
        $("mintMsg").className="note";
        setTxt("mintMsg","Sending mint…");

        const [cbs, sol] = await Promise.all([
          getCbsBalance(wallet.publicKey),
          getSolBalance(wallet.publicKey),
        ]);
        if (cbs < CBS_THRESHOLD){ $("mintMsg").className="note warn"; setTxt("mintMsg","Guard: wallet needs ≥ 1 CBS."); return; }
        if (sol < MIN_SOL_RENT){ $("mintMsg").className="note warn"; setTxt("mintMsg",`Not enough SOL for rent (~${MIN_SOL_RENT} SOL).`); return; }

        await refresh();
        const before = Number(cm.itemsRedeemed ?? cm.data?.itemsRedeemed ?? 0);

        const nftMint = generateSigner(umi);
        const mintArgs = await detectMintArgs();

        const tx = transactionBuilder()
          .add(setComputeUnitLimit(umi, { units: 600_000 }))
          .add(mintV2(umi, {
            candyMachine: publicKey(CANDY_MACHINE),
            candyGuard: publicKey(CANDY_GUARD),
            group: GUARD_GROUP,
            nftMint,
            mintArgs
          }));

        let sig;
        try{
          const res = await tx.sendAndConfirm(umi, { confirm: { commitment: "confirmed" }});
          sig = Array.isArray(res) ? res[0] : (typeof res==='string' ? res : res?.signature);
        }catch(err){
          const raw = (err?.cause?.logs?.[0] || err?.cause?.message || err?.message || "").toString();
          $("mintMsg").className="note err";
          if (raw.toLowerCase().includes("insufficient")) setTxt("mintMsg","Not enough SOL for accounts/fees.");
          else if (raw.toLowerCase().includes("last")) setTxt("mintMsg","BotTax lastInstruction blocked (set to false).");
          else if (raw.toLowerCase().includes("token") || raw.toLowerCase().includes("guard")) setTxt("mintMsg","Guard condition not met (likely token gate).");
          else setTxt("mintMsg","Mint failed (simulation). "+raw.slice(0,140));
          showTxLink(sig);
          return;
        }

        await refresh();
        const after = Number(cm.itemsRedeemed ?? cm.data?.itemsRedeemed ?? 0);
        if (after <= before) {
          $("mintMsg").className="note err";
          setTxt("mintMsg","Mint not confirmed (guard/conditions).");
          showTxLink(sig);
          return;
        }

        $("mintMsg").className="note ok";
        setTxt("mintMsg","Mint confirmed ✅ ");
        showTxLink(sig,"View on Solscan");
        await updateHolderState();
      }catch(e){
        console.error(e);
        $("mintMsg").className="note err";
        setTxt("mintMsg","Mint failed: "+(e?.message||"Unexpected error"));
      }
    }

    // ===== Wire up =====
    $("btnConnect").addEventListener("click", connectWallet);
    $("btnRefresh").addEventListener("click", async ()=>{ await refresh(); if(connected) await updateHolderState(); });
    $("mintBadge").addEventListener("click", ()=>{ if(!$("mintBadge").classList.contains("disabled")) doMint(); });

    // Init
    (async () => { await refresh(); })();
  </script>
</body>
</html>
