<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CBS — Holder Badge Mint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--fg:#e5e7eb;--muted:#cbd5e1;--panel:#0b0b0b;--bd:#1f2937;--radius:16px;--gold:#eab308}
  *{box-sizing:border-box} body{margin:0;background:#000;color:var(--fg);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 42px}
  .hero{background:#0a0a0a;border:1px solid var(--bd);border-radius:18px;overflow:hidden}
  .hero img{width:100%;height:220px;object-fit:cover;display:block}
  h1{margin:18px 0 6px;font-size:32px}
  .sub{color:var(--muted);margin-bottom:14px}
  .panel{background:var(--panel);border:1px solid var(--bd);border-radius:var(--radius);padding:16px}
  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px} @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{appearance:none;border:1px solid #233044;background:#111827;color:#dbeafe;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}
  .btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#22e0b7,#15b893);color:#05241d}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:8px 12px}
  .kv b{color:#cfe3ff}
  textarea{width:100%;height:200px;background:#06090f;color:#aee7ff;border:1px solid #1e293b;border-radius:12px;padding:10px;
           font-family:ui-monospace,Menlo,Consolas,monospace}
  .tg{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:
      radial-gradient(120% 120% at 20% 20%, rgba(234,179,8,.45), transparent 60%), #0a0a0a;
      border:1px solid rgba(250,204,21,.55);box-shadow:0 0 18px rgba(234,179,8,.35), inset 0 0 16px rgba(234,179,8,.2)}
  .tg svg{width:22px;height:22px;color:#fde68a}
  .tip{color:#93a3c7;font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero"><img src="Banner-CBS-Coin.webp" alt="CBS banner" onerror="this.src='Banner-CBS-Coin.jpg'"></div>

    <h1>Mint your CBS Holder Badge</h1>
    <div class="sub">Requirement: <b>≥ 1 CBS</b> in your wallet (token gate). Limit: <b>1 per wallet</b>.</div>

    <div class="row" style="margin:10px 0 18px">
      <!-- gold Telegram icon only -->
      <a class="tg" href="https://t.me/CBS_Coins" target="_blank" rel="noreferrer" title="Private Telegram (holders)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.78 15.83 9.6 19.1c.34 0 .49-.15.67-.33l1.61-1.56 3.34 2.45c.61.34 1.06.16 1.22-.56l2.21-10.39c.2-.89-.34-1.24-.93-1.02L4.3 10.1c-.86.33-.84.81-.15 1.03l4.11 1.28 9.55-6.02c.45-.29.86-.13.52.16l-8.55 7.28z"/></svg>
      </a>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="row" style="margin-bottom:10px">
          <button id="btnConnect" class="btn">Connect Wallet</button>
          <button id="btnMint" class="btn primary" disabled>Mint</button>
          <button id="btnCheck" class="btn">Check balance</button>
        </div>
        <textarea id="log" readonly>idle</textarea>
        <div class="tip">Tip: if something looks off, hard refresh (Ctrl+F5).</div>
      </div>

      <div class="panel">
        <div class="kv">
          <b>Status</b><span id="st">Disconnected</span>
          <b>Your CBS</b><span id="cbs">—</span>
          <b>Candy Machine</b><span><code id="cmid"></code></span>
          <b>Candy Guard</b><span><code id="cguard"></code></span>
          <b>Minted</b><span id="minted">—</span>
          <b>Remaining</b><span id="remain">—</span>
          <b>Network</b><span>Mainnet-Beta</span>
          <b>View CM</b>
          <span><a id="solanafm" target="_blank" rel="noreferrer">SolanaFM</a> • <a id="solscan" target="_blank" rel="noreferrer">Solscan</a></span>
        </div>
      </div>
    </div>
  </div>

  <!-- web3.js IIFE for Phantom + balance check -->
  <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>

  <script type="module">
  // ==== CONFIG ====
  const RPC      = "https://mainnet.helius-rpc.com/?api-key=a9a11d45-2d40-4da0-a3b6-557b855f1e5c";
  const CBS_MINT = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
  const CMID     = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
  const CGID     = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";

  // links
  document.querySelector('#cmid').textContent   = CMID;
  document.querySelector('#cguard').textContent = CGID;
  document.querySelector('#solanafm').href = `https://solana.fm/address/${CMID}?cluster=mainnet-solana`;
  document.querySelector('#solscan').href  = `https://solscan.io/account/${CMID}`;

  // UI helpers
  const $ = s => document.querySelector(s);
  const log = m => { const el=$("#log"); el.value += (el.value? "\n":"")+m; el.scrollTop = el.scrollHeight; };
  const setStatus = t => $("#st").textContent = t;

  const btnConnect = $("#btnConnect");
  const btnCheck   = $("#btnCheck");
  const btnMint    = $("#btnMint");

  // CONNECT
  btnConnect.addEventListener("click", async () => {
    try{
      if (!window.solana) { window.open("https://phantom.app/","_blank"); alert("Please install Phantom."); return; }
      const r  = await window.solana.connect();
      const pk = r?.publicKey?.toBase58?.() || r?.publicKey || "";
      setStatus(pk ? `Connected: ${pk.slice(0,4)}…${pk.slice(-4)}` : "Connected");
      log(`Connected: ${pk}`);
      await checkCBS();
    }catch(e){ console.error(e); log("Connect failed: "+(e.message||e)); }
  });

  // CHECK CBS BALANCE
  async function checkCBS(){
    try{
      if (!window.solana?.publicKey){ log("Wallet not connected."); return; }
      const owner = typeof window.solana.publicKey.toBase58==="function"
        ? window.solana.publicKey
        : new solanaWeb3.PublicKey(window.solana.publicKey);
      const conn  = new solanaWeb3.Connection(RPC,"confirmed");
      const res   = await conn.getParsedTokenAccountsByOwner(owner, { mint: new solanaWeb3.PublicKey(CBS_MINT) });
      const bal   = (res.value||[]).map(a=>a.account.data.parsed.info.tokenAmount.uiAmount||0).reduce((a,b)=>a+b,0);
      $("#cbs").textContent = String(bal);
      if (bal >= 1){ btnMint.disabled = false; log("✅ Token gate OK: you hold ≥ 1 CBS."); }
      else { btnMint.disabled = true;  log("⛔ Token gate: need ≥ 1 CBS to mint."); }
    }catch(e){ console.error(e); log("Balance check failed: "+(e.message||e)); }
  }
  btnCheck.addEventListener("click", checkCBS);

  // ===== Robust ESM loader =====
  async function tryImport(urls){
    for (const u of urls){ try { return await import(u); } catch(_){ } }
    throw new Error("all-failed");
  }
  async function softImport(urls){
    try { return await tryImport(urls); } catch { return null; }
  }

  async function loadUmi(){
    // versions that bestaan op CDN’s
    const V = {
      umiBundle:"1.4.1",
      umi:"1.4.1",
      signer:"1.4.1",
      tm_primary:"3.1.0",   // primary
      tm_fallback:"3.0.1",  // fallback
      cm:"6.1.0",
      tb_primary:"1.0.0",
      tb_fallback:"0.10.6"
    };

    const umiBundle = await tryImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/umi-bundle-defaults@${V.umiBundle}/dist/index.browser.mjs`,
      `https://unpkg.com/@metaplex-foundation/umi-bundle-defaults@${V.umiBundle}/dist/index.browser.mjs?module`,
      `https://esm.sh/@metaplex-foundation/umi-bundle-defaults@${V.umiBundle}?bundle`
    ]);

    const umiCore = await tryImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/umi@${V.umi}/dist/esm/index.js`,
      `https://unpkg.com/@metaplex-foundation/umi@${V.umi}/dist/esm/index.js?module`,
      `https://esm.sh/@metaplex-foundation/umi@${V.umi}?bundle`
    ]);

    const adapters = await tryImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/umi-signer-wallet-adapters@${V.signer}/dist/esm/index.js`,
      `https://unpkg.com/@metaplex-foundation/umi-signer-wallet-adapters@${V.signer}/dist/esm/index.js?module`,
      `https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@${V.signer}?bundle`
    ]);

    // token-metadata (probeer 3.1.0 → 3.0.1) en beide padvormen
    let tm = await softImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-token-metadata@${V.tm_primary}/dist/esm/index.js`,
      `https://unpkg.com/@metaplex-foundation/mpl-token-metadata@${V.tm_primary}/dist/esm/index.js?module`,
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-token-metadata@${V.tm_primary}/dist/index.mjs`,
      `https://unpkg.com/@metaplex-foundation/mpl-token-metadata@${V.tm_primary}/dist/index.mjs?module`,
      `https://esm.sh/@metaplex-foundation/mpl-token-metadata@${V.tm_primary}?bundle`
    ]);
    if (!tm) {
      tm = await tryImport([
        `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-token-metadata@${V.tm_fallback}/dist/esm/index.js`,
        `https://unpkg.com/@metaplex-foundation/mpl-token-metadata@${V.tm_fallback}/dist/esm/index.js?module`,
        `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-token-metadata@${V.tm_fallback}/dist/index.mjs`,
        `https://unpkg.com/@metaplex-foundation/mpl-token-metadata@${V.tm_fallback}/dist/index.mjs?module`,
        `https://esm.sh/@metaplex-foundation/mpl-token-metadata@${V.tm_fallback}?bundle`
      ]);
    }

    const cm = await tryImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-candy-machine@${V.cm}/dist/esm/index.js`,
      `https://unpkg.com/@metaplex-foundation/mpl-candy-machine@${V.cm}/dist/esm/index.js?module`,
      `https://esm.sh/@metaplex-foundation/mpl-candy-machine@${V.cm}?bundle`
    ]);

    // toolbox is optioneel (soft)
    const tb = await softImport([
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-toolbox@${V.tb_primary}/dist/esm/index.js`,
      `https://unpkg.com/@metaplex-foundation/mpl-toolbox@${V.tb_primary}/dist/esm/index.js?module`,
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-toolbox@${V.tb_primary}/dist/index.mjs`,
      `https://unpkg.com/@metaplex-foundation/mpl-toolbox@${V.tb_primary}/dist/index.mjs?module`,
      `https://esm.sh/@metaplex-foundation/mpl-toolbox@${V.tb_primary}?bundle`,
      `https://cdn.jsdelivr.net/npm/@metaplex-foundation/mpl-toolbox@${V.tb_fallback}/dist/index.mjs`,
      `https://unpkg.com/@metaplex-foundation/mpl-toolbox@${V.tb_fallback}/dist/index.mjs?module`,
      `https://esm.sh/@metaplex-foundation/mpl-toolbox@${V.tb_fallback}?bundle`
    ]);

    return {
      createUmi: umiBundle.createUmi,
      publicKey: umiCore.publicKey,
      generateSigner: umiCore.generateSigner,
      walletAdapterIdentity: adapters.walletAdapterIdentity,
      mplTokenMetadata: tm.mplTokenMetadata,
      mplCandyMachine: cm.mplCandyMachine,
      fetchCandyMachine: cm.fetchCandyMachine,
      mintV2: cm.mintV2,
      setComputeUnitLimit: tb?.setComputeUnitLimit ?? (()=>{}),
      setComputeUnitPrice: tb?.setComputeUnitPrice ?? (()=>{})
    };
  }

  // MINT
  btnMint.addEventListener("click", async () => {
    try{
      if (!window.solana?.publicKey){ alert("Connect your wallet first."); return; }
      btnMint.disabled = true;
      log("Preparing mint… (loading modules)");

      const {
        createUmi, publicKey: pk, generateSigner, walletAdapterIdentity,
        mplTokenMetadata, mplCandyMachine, fetchCandyMachine, mintV2,
        setComputeUnitLimit, setComputeUnitPrice
      } = await loadUmi();

      const umi = createUmi(RPC)
        .use(mplTokenMetadata())
        .use(mplCandyMachine())
        .use(walletAdapterIdentity(window.solana));

      await fetchCandyMachine(umi, pk(CMID));          // warm-up

      const nftMint = generateSigner(umi);
      try { setComputeUnitLimit(umi,{units:900_000}); } catch(_) {}
      try { setComputeUnitPrice(umi,{microLamports:10_000}); } catch(_) {}

      const txb = await mintV2(umi, {
        candyMachine: pk(CMID),
        candyGuard:   pk(CGID),
        nftMint
      });

      const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
      log(`✅ Minted! Tx:\n${signature}`);
      alert("Mint successful!");
    }catch(e){
      console.error(e);
      alert("Mint failed: "+(e.message||e));
      log("❌ Mint failed: "+(e.message||e));
    }finally{ btnMint.disabled = false; }
  });

  // auto-connect (trusted)
  (async () => { if (window.solana?.isPhantom) { try { await window.solana.connect({ onlyIfTrusted:true }); setStatus("Connected"); await checkCBS(); } catch(_){} }})();
  </script>
</body>
</html>
