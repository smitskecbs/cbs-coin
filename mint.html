<script type="module">
/* -------------------- Config -------------------- */
const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=a9a11d45-2d40-4da0-a3b6-557b855f1e5c";
const CBS_MINT   = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
const CMID       = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
const CGID       = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";

/* -------------------- Helpers ------------------- */
const $ = (s)=>document.querySelector(s);
const log = (m)=>{ const el=$("#log"); el.value+=(el.value? "\n":"")+m; el.scrollTop=el.scrollHeight; };
const status = (t)=> $("#statusText")?.textContent=t;

$("#cmid")?.append(CMID);
$("#cguard")?.append(CGID);
$("#solanafm")?.setAttribute("href","https://solana.fm/address/"+CMID);
$("#solscan") ?.setAttribute("href","https://solscan.io/account/"+CMID);

/* --------- Wallet connect + token gate --------- */
const btnConnect = $("#btnConnect");
const btnCheck   = $("#btnCheck");
const btnMint    = $("#btnMint");

btnConnect?.addEventListener("click", async () => {
  try{
    if (!window.solana){ alert("Install Phantom wallet."); window.open("https://phantom.app/","_blank"); return; }
    const r  = await window.solana.connect();
    const pk = r?.publicKey?.toBase58?.() || r?.publicKey || "";
    status(pk ? `Connected: ${pk.slice(0,4)}…${pk.slice(-4)}` : "Connected");
    log(`Connected: ${pk}`);
    await doCheck();
  }catch(e){ console.error(e); log("Connect failed: "+(e.message||e)); }
});

btnCheck?.addEventListener("click", doCheck);

async function doCheck(){
  try{
    if (!window.solana?.publicKey){ log("Wallet not connected."); return; }
    const owner = typeof window.solana.publicKey.toBase58==="function"
      ? window.solana.publicKey
      : new solanaWeb3.PublicKey(window.solana.publicKey);

    const conn  = new solanaWeb3.Connection(HELIUS_RPC,"confirmed");
    const res   = await conn.getParsedTokenAccountsByOwner(
      owner, { mint: new solanaWeb3.PublicKey(CBS_MINT) }
    );
    const bal = (res.value||[])
      .map(a=>a.account.data.parsed.info.tokenAmount.uiAmount||0)
      .reduce((a,b)=>a+b,0);
    $("#cbs")?.replaceChildren(String(bal));
    if (bal>=1){ btnMint.disabled=false; log("✅ Token gate OK: you hold ≥ 1 CBS."); }
    else { btnMint.disabled=true; log("⛔ Token gate: need ≥ 1 CBS to mint."); }
  }catch(e){ console.error(e); log("Balance check failed: "+(e.message||e)); }
}

/* -------------- Umi loader (robust) -------------- */
async function loadUmiModules(){
  // Ask CDN to expose exactly the symbols we need.
  const [bundle, core, adaptersA, adaptersB, tm, cm] = await Promise.all([
    import("https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1"),
    import("https://esm.sh/@metaplex-foundation/umi@1.4.1"),
    import("https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1?exports=walletAdapterIdentity,walletAdapterIdentityPlugin,createWalletAdapterFromWallet,createWalletAdapter").catch(()=>null),
    import("https://esm.sh/@metaplex-foundation/umi-web3js-adapters@1.4.1?exports=createSignerFromWallet,createSignerFromWalletAdapter").catch(()=>null),
    import("https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.1.0"),
    import("https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0"),
  ]);
  // Log what we got (for debugging on-page)
  const keys = o => o ? Object.keys(o).join(",") : "(null)";
  log("modules: " + [
    "bundle["+keys(bundle)+"]",
    "core["+keys(core)+"]",
    "aA["+keys(adaptersA?.default||adaptersA)+"]",
    "aB["+keys(adaptersB?.default||adaptersB)+"]",
    "tm["+keys(tm)+"]",
    "cm["+keys(cm)+"]"
  ].join(" | "));
  return { bundle, core, adaptersA, adaptersB, tm, cm };
}

/* -------------------- Mint ---------------------- */
btnMint?.addEventListener("click", doMint);

async function doMint(){
  try{
    if (!window.solana?.publicKey){ alert("Connect your wallet first."); return; }
    btnMint.disabled = true;
    log("Preparing mint… (loading modules)");

    const { bundle, core, adaptersA, adaptersB, tm, cm } = await loadUmiModules();
    const { createUmi } = bundle;
    const { publicKey: pk, generateSigner, signerIdentity } = core;
    const { mplTokenMetadata } = tm;
    const { mplCandyMachine, fetchCandyMachine, mintV2 } = cm;

    const umi = createUmi(HELIUS_RPC)
      .use(mplTokenMetadata())
      .use(mplCandyMachine());

    // --- attach identity (try 4 paths, default-aware) ---
    const aA = adaptersA?.default || adaptersA || {};
    const aB = adaptersB?.default || adaptersB || {};

    let attached = false;

    // 1) signer-wallet-adapters: walletAdapterIdentity(with adapter)
    if (!attached && (aA.walletAdapterIdentity || aA.walletAdapterIdentityPlugin)) {
      const makeWA = aA.createWalletAdapterFromWallet || aA.createWalletAdapter || null;
      if (makeWA){
        const wa = makeWA(window.solana);
        const plug = aA.walletAdapterIdentity || aA.walletAdapterIdentityPlugin;
        umi.use(plug(wa));
        attached = true;
      }
    }
    // 2) web3js-adapters: createSignerFromWallet (accepts window.solana)
    if (!attached && aB.createSignerFromWallet){
      umi.use(signerIdentity(aB.createSignerFromWallet(window.solana)));
      attached = true;
    }
    // 3) web3js-adapters: createSignerFromWalletAdapter (if you ever add @solana/wallet-adapter)
    if (!attached && aB.createSignerFromWalletAdapter && window?.phantom?.solana?.adapter){
      umi.use(signerIdentity(aB.createSignerFromWalletAdapter(window.phantom.solana.adapter)));
      attached = true;
    }

    if (!attached){
      log("❌ Mint failed: wallet adapter not available (no compatible export).");
      alert("Mint failed: wallet adapter not available.");
      return;
    }

    // warm-up
    await fetchCandyMachine(umi, pk(CMID));

    const nftMint = generateSigner(umi);
    const txb = await mintV2(umi, {
      candyMachine: pk(CMID),
      candyGuard:   pk(CGID),
      nftMint,
    });

    const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
    log("✅ Minted! Tx:\n"+signature);
    alert("Mint successful!");
  }catch(e){
    console.error(e);
    alert("Mint failed: " + (e?.message || e));
    log("❌ Mint failed: " + (e?.message || e));
  }finally{
    btnMint.disabled = false;
  }
}
</script>
