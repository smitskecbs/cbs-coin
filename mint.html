<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CBS — Holder Badge Mint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="Banner-CBS-Coin.jpg"/>

  <style>
    :root{
      --bg:#000; --card:#0b0b0b; --ink:#e9eefc; --muted:#bcd1ff; --border:#1f2430;
      --accent:#22c55e; --accent2:#a78bfa; --radius:18px;
      --gold:#E7C55A;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:#000;color:var(--ink);
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif
    }
    .wrap{max-width:1060px;margin:0 auto;padding:16px}
    .hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .hero picture,.hero img{display:block;width:100%;height:240px;object-fit:cover;background:#000}
    @media (min-width:900px){ .hero picture,.hero img{height:300px} }

    h1{margin:18px 4px 6px;font-size:2.1rem;letter-spacing:.2px}
    .sub{margin:8px 4px 18px;color:var(--muted)}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .panel{background:linear-gradient(180deg,#0a0a0a,#0c0c0c);border:1px solid var(--border);border-radius:var(--radius);padding:16px}

    .grid{display:grid;gap:16px;grid-template-columns:1.1fr .9fr}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}

    button{
      appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:800;
      background:#152545;color:#dbe9ff;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
      transition:.16s transform ease,.16s filter ease
    }
    button:hover{filter:brightness(1.05)} button:active{transform:translateY(1px)}
    .primary{background:linear-gradient(180deg,#1ee0b7,#13b58f);color:#02261d}
    .muted{background:#13284f;color:#b8cffb}

    .kv{display:grid;grid-template-columns:160px 1fr;gap:8px 12px;font-size:14px}
    .kv b{color:#cfe6ff}
    .log{
      width:100%;height:180px;background:#0a1222;color:#aee7ff;border:0;
      border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)
    }

    /* Gold Telegram icon (no text) */
    .tg-only{
      display:inline-flex;align-items:center;justify-content:center;
      width:56px;height:56px;border-radius:50%;
      background:radial-gradient(120% 120% at 30% 20%, #FFF2AE, #E6C353 48%, #B99834 75%, #7A5E1E);
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 0 22px rgba(231,197,90,.35), inset 0 0 10px rgba(255,255,255,.15);
      text-decoration:none
    }
    .tg-only svg{width:26px;height:26px;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
    .tg-only:active{transform:translateY(1px)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <picture>
        <source srcset="Banner-CBS-Coin.webp" type="image/webp">
        <img src="Banner-CBS-Coin.jpg" alt="CBS Coin banner">
      </picture>
    </section>

    <h1>Mint your CBS Holder Badge</h1>
    <div class="sub">Requirement: <b>≥ 1 CBS</b> in your wallet (token gate). Limit: <b>1 per wallet</b>.</div>

    <div class="row" style="gap:10px;margin:8px 0 16px">
      <a class="tg-only" href="https://t.me/CBS_Coins" target="_blank" rel="noreferrer" title="Private Telegram">
        <svg viewBox="0 0 24 24" fill="#111">
          <path d="M9.43 15.34 8.98 19c.64 0 .91-.28 1.23-.62l2.95-2.83 6.12 4.47c.61.34 1.06.16 1.22-.56l3.98-18.69c.36-1.66-.6-2.31-1.68-1.9L1.8 9.2c-1.62.62-1.61 1.53-.29 1.93l6.46 2.02L19.3 5.27c.61-.37 1.17-.17.71.21L9.43 15.34Z"/>
        </svg>
      </a>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="row" style="gap:10px;margin-bottom:12px">
          <button id="btnConnect" class="muted">Connect Wallet</button>
          <button id="btnMint" class="primary" disabled>Mint</button>
          <button id="btnCheck" class="muted">Check balance</button>
        </div>
        <textarea id="log" class="log" readonly>idle</textarea>
        <div style="margin-top:8px;color:#99b6ff;font-size:12px">Tip: if something looks off, hard refresh (Ctrl + F5).</div>
      </section>

      <aside class="panel">
        <div class="kv">
          <b>Status</b>        <span id="statusText">Disconnected</span>
          <b>Your CBS</b>      <span id="cbs">—</span>
          <b>Candy Machine</b> <span><code id="cmid"></code></span>
          <b>Candy Guard</b>   <span><code id="cguard"></code></span>
          <b>Minted</b>        <span id="minted">—</span>
          <b>Remaining</b>     <span id="remaining">—</span>
          <b>Network</b>       <span>Mainnet-Beta</span>
          <b>View CM</b>
          <span>
            <a id="solanafm" target="_blank" rel="noreferrer">SolanaFM</a> •
            <a id="solscan"  target="_blank" rel="noreferrer">Solscan</a>
          </span>
        </div>
      </aside>
    </div>
  </main>

  <!-- web3.js for wallet + token gate -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>

  <script type="module">
    /**** CONFIG ************************************************************/
    // Uses your Helius endpoint (browser-friendly, avoids CORS 403s)
    const RPC         = "https://mainnet.helius-rpc.com/?api-key=a9a11d45-2d40-4da0-a3b6-557b855f1e5c";
    const CBS_MINT    = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
    const CMID        = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
    const CGID        = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";

    /**** UI helpers *********************************************************/
    const $ = (s)=>document.querySelector(s);
    const log = (m)=>{ const el=$("#log"); el.value+=(el.value? "\n":"")+m; el.scrollTop=el.scrollHeight; };
    const setStatus = (t)=> $("#statusText").textContent=t;

    $("#cmid").textContent = CMID;
    $("#cguard").textContent = CGID;
    $("#solanafm").href = `https://solana.fm/address/${CMID}`;
    $("#solscan").href  = `https://solscan.io/account/${CMID}`;

    /**** Wallet connect *****************************************************/
    const btnConnect = $("#btnConnect");
    const btnMint    = $("#btnMint");
    const btnCheck   = $("#btnCheck");

    btnConnect.addEventListener("click", async () => {
      try {
        if (!window.solana){ alert("Please install Phantom."); window.open("https://phantom.app/","_blank"); return; }
        const r  = await window.solana.connect();
        const pk = r?.publicKey?.toBase58?.() || r?.publicKey || "";
        setStatus(pk ? `Connected: ${pk.slice(0,4)}…${pk.slice(-4)}` : "Connected");
        log(`Connected: ${pk}`);
        await doCheck();
      } catch (e) {
        console.error(e); log("Connect failed: " + (e.message||e));
      }
    });

    /**** Token-gate: CBS balance ********************************************/
    async function doCheck(){
      try{
        if (!window.solana?.publicKey) { log("Wallet not connected."); return; }
        const owner = typeof window.solana.publicKey.toBase58==="function"
          ? window.solana.publicKey
          : new solanaWeb3.PublicKey(window.solana.publicKey);

        const conn  = new solanaWeb3.Connection(RPC,"confirmed");
        const res   = await conn.getParsedTokenAccountsByOwner(
          owner, { mint: new solanaWeb3.PublicKey(CBS_MINT) }
        );
        const bal = (res.value||[])
          .map(a=>a.account.data.parsed.info.tokenAmount.uiAmount||0)
          .reduce((a,b)=>a+b,0);

        $("#cbs").textContent = String(bal);
        if (bal>=1){ btnMint.disabled=false; log("✅ Token gate OK: you hold ≥ 1 CBS."); }
        else { btnMint.disabled=true; log("⛔ Token gate: need ≥ 1 CBS to mint."); }
      }catch(e){ console.error(e); log("Balance check failed: "+(e.message||e)); }
    }
    btnCheck.addEventListener("click", doCheck);

    /**** Mint (lazy-load Umi v1 only when needed) ***************************/
    async function tryImport(urls){
      for (const u of urls){ try { return await import(u); } catch(_) {} }
      throw new Error("Could not load modules (all CDNs failed).");
    }

    async function doMint(){
      try{
        if (!window.solana?.publicKey) { alert("Connect wallet first."); return; }
        btnMint.disabled = true;
        log("Preparing mint… (loading modules)");

        const [
          umiBundle,
          umiCore,
          walletAdapters,
          tokenMeta,
          candy,
          toolbox
        ] = await Promise.all([
          tryImport(["https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1?bundle"]),
          tryImport(["https://esm.sh/@metaplex-foundation/umi@1.4.1?bundle"]),
          tryImport(["https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.4.1?bundle"]),
          tryImport(["https://esm.sh/@metaplex-foundation/mpl-token-metadata@3.1.0?bundle"]),
          tryImport(["https://esm.sh/@metaplex-foundation/mpl-candy-machine@6.1.0?bundle"]),
          tryImport(["https://esm.sh/@metaplex-foundation/mpl-toolbox@0.11.4?bundle"]),
        ]);

        const { createUmi } = umiBundle;
        const { generateSigner, publicKey: pk } = umiCore;
        const { walletAdapterIdentity } = walletAdapters;
        const { mplTokenMetadata } = tokenMeta;
        const { mplCandyMachine, fetchCandyMachine, mintV2 } = candy;
        const { setComputeUnitLimit, setComputeUnitPrice } = toolbox;

        const umi = createUmi(RPC)
          .use(mplTokenMetadata())
          .use(mplCandyMachine())
          .use(walletAdapterIdentity(window.solana));

        // (optional) update a few stats
        try {
          const cm = await fetchCandyMachine(umi, pk(CMID));
          $("#minted").textContent = String(Number(cm.itemsRedeemed));
        } catch(_) {}

        setComputeUnitLimit(umi, { units: 900_000 });
        setComputeUnitPrice(umi, { microLamports: 10_000 });

        const nftMint = generateSigner(umi);

        const txb = await mintV2(umi, {
          candyMachine: pk(CMID),
          candyGuard:   pk(CGID),
          nftMint,
        });

        const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
        log("✅ Minted! Tx signature:\n" + (typeof signature === "string" ? signature : JSON.stringify(signature)));
        alert("Mint successful!");
      } catch(e){
        console.error(e);
        alert("Mint failed: " + (e.message || e));
        log("❌ Mint failed: " + (e.message||e));
      } finally {
        btnMint.disabled = false;
      }
    }
    btnMint.addEventListener("click", doMint);

    if (window.solana?.isPhantom) setStatus("Phantom detected");
  </script>
</body>
</html>
