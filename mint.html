<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CBS — Holder Badge Mint</title>
  <meta name="description" content="Mint je CBS Holder Badge. Vereiste: ≥ 1 CBS in je wallet (token gate). Limit: 1 per wallet.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000;--fg:#e5e7eb;--muted:#cbd5e1;--card:#0a0a0a;--border:#1f2937;--radius:18px;
      --g:#22c55e;--p:#a78bfa;--warn:#f59e0b;--err:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg)}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 44px}
    .hero{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .banner{width:100%;height:260px;object-fit:cover;display:block;background:#000}
    .tg{
      position:absolute;left:16px;bottom:16px;width:64px;height:64px;border-radius:50%;
      display:grid;place-items:center;text-decoration:none;filter:drop-shadow(0 0 14px rgba(234,179,8,.45));
      background: radial-gradient(120% 120% at 20% 20%, rgba(250,204,21,.35), transparent 60%), #0a0a0a;
      border:1px solid rgba(255,255,255,.12);
    }
    .tg svg{width:34px;height:34px;display:block}
    h1{margin:18px 0 6px;font-size:2.1rem;letter-spacing:.2px;font-weight:800}
    .grid{display:grid;gap:16px;margin-top:12px}
    @media(min-width:920px){.grid{grid-template-columns:1.1fr .9fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    button{
      background:#0b0b0b;border:1px solid rgba(255,255,255,.10);color:#fff;border-radius:12px;padding:10px 14px;
      font-weight:700;cursor:pointer
    }
    button.primary{background:linear-gradient(180deg,#22c55e,#16a34a);border:none}
    button:disabled{opacity:.6;cursor:not-allowed}
    textarea{
      width:100%;min-height:220px;background:#07111f;border:1px solid #0f172a;color:#c7dbff;border-radius:10px;
      padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      resize:vertical
    }
    .kv{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:.98rem}
    .kv div{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
    .muted{color:var(--muted)}
    .ok{color:var(--g)} .warn{color:var(--warn)} .err{color:var(--err)}
    .tip{margin-top:8px;color:#94a3b8;font-size:.85rem}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <!-- Banner (gebruik je eigen pad/naam) -->
      <img class="banner" src="Banner-CBS-Coin.jpg" alt="CBS Banner" onerror="this.style.display='none'">
      <!-- Gouden Telegram knop naar besloten groep (alleen icoon, geen tekst) -->
      <a class="tg" href="https://t.me/CBS_Coins" target="_blank" rel="noreferrer" aria-label="Private Telegram">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="#facc15" />
          <path d="M18.7 6.7 5.5 11.5c-.9.3-.9 1.6 0 1.8l2.7.8.9 2.8c.2.6 1 .7 1.4.3l1.9-1.9 2.7 2c.6.4 1.5.1 1.7-.6l2-8c.2-.7-.5-1.3-1.1-1.0Z" fill="#000"/>
        </svg>
      </a>
    </section>

    <h1>Mint your CBS Holder Badge</h1>
    <p class="muted">Vereiste: <b>≥ 1 CBS</b> in je wallet (token gate). Limit: <b>1 per wallet</b>.</p>

    <div class="grid">
      <section class="card">
        <div class="row" style="margin-bottom:10px">
          <button id="btnConnect">Connect Wallet</button>
          <button id="btnMint" class="primary">Mint</button>
          <button id="btnBal">Check balance</button>
        </div>
        <textarea id="log" spellcheck="false" readonly>idle</textarea>
        <div class="tip">Tip: als iets raar doet, hard refresh (Ctrl+F5).</div>
      </section>

      <section class="card">
        <div class="kv">
          <div class="muted">Status</div><div id="st">Disconnected</div>
          <div class="muted">Your CBS</div><div id="cbs">—</div>
          <div class="muted">Candy Machine</div><div id="cm">—</div>
          <div class="muted">Candy Guard</div><div id="cg">—</div>
          <div class="muted">Minted</div><div id="minted">—</div>
          <div class="muted">Remaining</div><div id="remain">—</div>
          <div class="muted">Network</div><div>Mainnet-Beta</div>
          <div class="muted">View CM</div>
          <div>
            <a id="solanafm" href="#" target="_blank" rel="noreferrer">SolanaFM</a> •
            <a id="solscan" href="#" target="_blank" rel="noreferrer">Solscan</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    // -------------------- CONFIG --------------------
    // Zet je RPC via ?rpc= in de URL. Voorbeeld:
    //   .../mint.html?rpc=https://mainnet.helius-rpc.com/?api-key=JOUW_KEY
    const urlRpc = new URLSearchParams(location.search).get("rpc");
    const RPC = urlRpc || ""; // ← leeg = je MOET ?rpc= meegeven (CORS)

    // JOUW IDs
    const CMID = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
    const CGID = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";
    const CBS_MINT = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";

    // UI refs
    const btnConn = document.getElementById("btnConnect");
    const btnMint = document.getElementById("btnMint");
    const btnBal  = document.getElementById("btnBal");
    const logEl   = document.getElementById("log");
    const stEl    = document.getElementById("st");
    const cmEl    = document.getElementById("cm");
    const cgEl    = document.getElementById("cg");
    const mintedEl= document.getElementById("minted");
    const remainEl= document.getElementById("remain");
    const cbsEl   = document.getElementById("cbs");
    const fmA     = document.getElementById("solanafm");
    const ssA     = document.getElementById("solscan");

    // Links
    fmA.href = `https://solana.fm/address/${CMID}?cluster=mainnet-beta`;
    ssA.href = `https://solscan.io/account/${CMID}`;

    function log(s){ logEl.value += (logEl.value ? "\n" : "") + s; logEl.scrollTop = logEl.scrollHeight; }
    function setStatus(txt){ stEl.textContent = txt; }

    // -------------------- ROBUUSTE IMPORTS --------------------
    const CDN = (pkg, ver, extra="") =>
      `https://esm.sh/${pkg}@${ver}?bundle&target=es2022${extra}`;

    const sources = {
      umiCore:      [CDN("@metaplex-foundation/umi","1.4.1")],
      defaults:     [CDN("@metaplex-foundation/umi-bundle-defaults","1.4.1")],
      tokenMeta:    [CDN("@metaplex-foundation/mpl-token-metadata","3.0.0")],
      candyMachine: [CDN("@metaplex-foundation/mpl-candy-machine","6.1.0")],
      toolbox:      [CDN("@metaplex-foundation/mpl-toolbox","0.11.4")],
      web3:         [CDN("@solana/web3.js","1.98.4")],

      // kritieke met vendor fallback (zet bestanden in /vendor/)
      waSigner: [
        CDN("@metaplex-foundation/umi-signer-wallet-adapters","1.4.1",
            "&exports=walletAdapterIdentity,walletAdapterIdentityPlugin,createWalletAdapterFromWallet,createWalletAdapter"),
        "/vendor/umi-signer-wallet-adapters.bundle.mjs"
      ],
      w3Adapters: [
        CDN("@metaplex-foundation/umi-web3js-adapters","1.4.1",
            "&exports=createSignerFromWalletAdapter,createSignerFromWallet"),
        "/vendor/umi-web3js-adapters.bundle.mjs"
      ],
    };

    const cache = {};
    async function tryImport(name){
      if (cache[name]) return cache[name];
      let lastErr;
      for (const url of sources[name] || []){
        try { return cache[name] = await import(url); }
        catch(e){ console.warn(`[import] ${name} @ ${url} faalde`, e); lastErr = e; }
      }
      throw lastErr ?? new Error(`Kon module ${name} niet laden`);
    }

    // -------------------- WALLET HELPERS --------------------
    function getWallet(){
      // Phantom / Backpack
      if (window.solana?.isPhantom)  return window.solana;
      if (window.solana?.isBackpack) return window.solana;
      // andere wallets zouden ook window.solana compatibel kunnen presenteren
      return window.solana || null;
    }

    async function connectWallet(){
      const w = getWallet();
      if (!w) { alert("Geen wallet adapter beschikbaar (Phantom/Backpack)."); return null; }
      try{
        const res = await w.connect();
        return w.publicKey?.toString() || res?.publicKey?.toString() || null;
      }catch(e){
        console.error(e); alert("Connect geweigerd of mislukt."); return null;
      }
    }

    // -------------------- BALANS CHECK (token gate CBS) --------------------
    async function getCbsBalance(ownerStr){
      const { Connection, PublicKey } = await tryImport("web3");
      const conn = new Connection(RPC, "confirmed");
      const owner = new PublicKey(ownerStr);
      const mint  = new PublicKey(CBS_MINT);
      const resp = await conn.getTokenAccountsByOwner(owner, { mint });
      let total = 0n;
      for (const it of resp.value){
        const data = it.account.data; // Buffer
        // spl-token account layout: amount op bytes 64..72 (u64 LE)
        const amountLE = data.subarray(64, 72);
        let amt = 0n;
        for (let i=7;i>=0;i--) amt = (amt<<8n) + BigInt(amountLE[i]);
        total += amt;
      }
      return total; // raw, zonder decimals
    }

    // -------------------- MINT LOGICA --------------------
    async function doMint(){
      btnMint.disabled = true;
      try{
        if (!RPC){ alert("Geen RPC ingesteld. Open de pagina met ?rpc=... (Helius)."); return; }

        const wallet = getWallet();
        if (!wallet){ alert("Geen wallet adapter beschikbaar (Phantom/Backpack)."); return; }

        const owner = wallet.publicKey?.toString() || (await wallet.connect(), wallet.publicKey?.toString());
        if (!owner){ alert("Kon wallet niet ophalen."); return; }

        setStatus(`Connected: ${owner.slice(0,4)}...${owner.slice(-4)}`);
        log(`Connected: ${owner}`);

        // Modules
        const { createUmi } = await tryImport("defaults");
        const { publicKey: pk, generateSigner } = await tryImport("umiCore");
        const { mplTokenMetadata } = await tryImport("tokenMeta");
        const { mplCandyMachine, fetchCandyMachine, mintV2 } = await tryImport("candyMachine");
        const { setComputeUnitLimit, setComputeUnitPrice } = await tryImport("toolbox");
        const { walletAdapterIdentity, createWalletAdapterFromWallet } = await tryImport("waSigner");

        // Umi + plugins
        const umi = createUmi(RPC)
          .use(mplTokenMetadata())
          .use(mplCandyMachine());

        const adapter = createWalletAdapterFromWallet(wallet);
        umi.use(walletAdapterIdentity(adapter));

        // Warm-up / stat
        const cm = await fetchCandyMachine(umi, pk(CMID));
        cmEl.textContent = CMID;
        cgEl.textContent = CGID;
        mintedEl.textContent  = String(cm.itemsRedeemed);
        remainEl.textContent  = String(cm.itemsAvailable - cm.itemsRedeemed);

        // Token gate (quick check)
        const raw = await getCbsBalance(owner);
        cbsEl.textContent = String(raw);
        if (raw === 0n){ alert("Je hebt 0 CBS. De token gate zal mint blokkeren."); return; }
        log("✅ Token gate OK: je hebt ≥ 1 CBS.");

        // Compute budget
        setComputeUnitLimit(umi, { units: 900_000 });
        setComputeUnitPrice(umi, { microLamports: 10_000 });

        log("Bouw mint transactie…");
        const nftMint = generateSigner(umi);
        const txb = await mintV2(umi, {
          candyMachine: pk(CMID),
          candyGuard:   pk(CGID),
          nftMint,
        });

        log("Send & confirm…");
        const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
        log("✅ Minted! Tx:\n" + signature);
        alert("Mint succesvol!");

      }catch(e){
        console.error(e);
        const msg = e?.message || String(e);
        log("❌ Mint failed: " + msg);
        alert("Mint failed: " + msg);
      }finally{
        btnMint.disabled = false;
      }
    }

    // -------------------- EVENTS --------------------
    btnConn.addEventListener("click", async () => {
      if (!RPC){ alert("Geen RPC ingesteld. Open met ?rpc=... (Helius)."); return; }
      const owner = await connectWallet();
      if (owner){
        setStatus(`Connected: ${owner.slice(0,4)}...${owner.slice(-4)}`);
        log(`Connected: ${owner}`);
      }
    });

    btnBal.addEventListener("click", async () => {
      try{
        if (!RPC){ alert("Geen RPC ingesteld. Open met ?rpc=... (Helius)."); return; }
        const w = getWallet(); if (!w){ alert("Geen wallet adapter."); return; }
        const owner = w.publicKey?.toString() || (await w.connect(), w.publicKey?.toString());
        if (!owner){ alert("Kon wallet niet ophalen."); return; }
        const raw = await getCbsBalance(owner);
        cbsEl.textContent = String(raw);
        if (raw > 0n) log("✅ Token gate OK: je hebt ≥ 1 CBS."); else log("⚠️ Je CBS balans is 0.");
      }catch(e){ console.error(e); alert("Balance check faalde."); }
    });

    btnMint.addEventListener("click", doMint);

    // Init
    (async () => {
      log("Preparing mint… (loading modules)");
      cmEl.textContent = CMID; cgEl.textContent = CGID;
    })();
  </script>
</body>
</html>
