<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CBS — Holder Badge Mint</title>
  <meta name="description" content="Mint your CBS Holder Badge. Token gate: need ≥ 1 CBS in your wallet. Limit: 1 per wallet.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="Banner-CBS-Coin.jpg">
  <style>
    :root{
      --bg:#0a0a0a; --card:#0c0f12; --fg:#e7eef7; --sub:#c5d1df; --line:#1b232c;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --radius:16px;
      --tg:#e3b341; /* gold */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:1024px; margin:0 auto; padding:18px 14px 40px}
    .brand{
      background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden;
    }
    .brand .banner{ width:100%; height:260px; object-fit:cover; display:block; background:#000; }
    @media (min-width:900px){ .brand .banner{ height:300px } }

    h1{ font-size:2.1rem; margin:18px 0 4px; font-weight:800 }
    .sub{ color:var(--sub) }

    .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin:8px 0 16px }
    .tg-btn{
      width:48px; height:48px; border-radius:999px; display:grid; place-items:center;
      background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.15), transparent 60%), #000;
      border:1px solid rgba(227,179,65,.5);
      box-shadow: 0 0 16px rgba(227,179,65,.45), 0 0 24px rgba(227,179,65,.25);
      text-decoration:none;
    }
    .tg-btn svg{ width:26px; height:26px; display:block; fill:var(--tg) }

    .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
    .btn{
      background:#11161b; color:#fff; border:1px solid var(--line); border-radius:12px;
      padding:10px 14px; font-weight:700; cursor:pointer;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed }
    .btn.primary{ background:#0f1720; border-color:#243140 }
    .btn.primary:hover{ filter:brightness(1.1) }
    .grid{ display:grid; grid-template-columns:1fr; gap:16px }
    @media (min-width:960px){ .grid{ grid-template-columns: 1.05fr .95fr } }

    .term{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      background: #071018; border:1px solid var(--line); border-radius:12px; color:#b9d5ff;
      padding:12px; height:220px; overflow:auto; }
    .ok{ color:var(--ok) } .warn{ color:var(--warn) } .err{ color:var(--err) }
    .kv{ display:grid; grid-template-columns: 150px 1fr; gap:8px 10px; }
    .kv .k{ color:#90a4b8 } .kv .v{ color:#fff }
    a{ color:#9dd1ff; text-decoration:none } a:hover{ text-decoration:underline }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Banner -->
    <section class="brand">
      <picture>
        <source type="image/webp" srcset="Banner-CBS-Coin.webp">
        <img class="banner" src="Banner-CBS-Coin.jpg" alt="CBS Coin banner" onerror="this.style.display='none'">
      </picture>
    </section>

    <h1>Mint your CBS Holder Badge</h1>
    <div class="sub">Requirement: <b>≥ 1 CBS</b> in your wallet (token gate). Limit: <b>1 per wallet</b>.</div>

    <div class="row" aria-label="private Telegram">
      <!-- Gold TG icon only (no text) -->
      <a class="tg-btn" href="https://t.me/CBS_Coins" target="_blank" rel="noreferrer" aria-label="Private Telegram (holders)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.72 4.84c.26-1.14-.92-1.98-1.92-1.47L2.5 11.07c-1.3.67-1.21 2.62.16 3.16l4.98 1.93c.57.22 1.22.14 1.72-.21l7.7-5.61c.21-.16.45.14.27.32l-6.22 6.34c-.41.42-.29 1.12.23 1.37l3.49 1.69c.75.36 1.63-.04 1.84-.83L21.72 4.84Z"/></svg>
      </a>
    </div>

    <section class="grid">
      <!-- Left: controls + log -->
      <div class="panel">
        <div class="row">
          <button id="btnConnect" class="btn">Connect Wallet</button>
          <button id="btnMint" class="btn primary">Mint</button>
          <button id="btnCheck" class="btn">Check balance</button>
        </div>
        <pre id="log" class="term">idle</pre>
        <div class="sub" style="margin-top:8px">Tip: if something looks off, hard-refresh (Ctrl + F5).</div>
      </div>

      <!-- Right: facts -->
      <div class="panel">
        <div class="kv">
          <div class="k">Status</div>         <div class="v" id="stStatus">—</div>
          <div class="k">Your CBS</div>       <div class="v" id="stCBS">—</div>
          <div class="k">Candy Machine</div>  <div class="v"><code id="stCM">—</code></div>
          <div class="k">Candy Guard</div>    <div class="v"><code id="stCG">—</code></div>
          <div class="k">Minted</div>         <div class="v" id="stMinted">—</div>
          <div class="k">Remaining</div>      <div class="v" id="stRemain">—</div>
          <div class="k">Network</div>        <div class="v">Mainnet-Beta</div>
          <div class="k">View CM</div>        <div class="v"><a id="stCMsfm" href="#" target="_blank" rel="noreferrer">SolanaFM</a> • <a id="stCMscan" href="#" target="_blank" rel="noreferrer">Solscan</a></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
  // ---------- Config (IDs) ----------
  const CMID       = "CiYSyWyGd9hrV52916jdzj4TcLRezHY34KCaBZ7EjKSd";
  const CGID       = "9m94QDkzsEoJLdfHMpyQUCgdS6fXSP1AeoEzf4RLmcUv";
  const CBS_MINT   = "B9z8cEWFmc7LvQtjKsaLoKqW5MJmGRCWqs1DPKupCfkk";
  const COLLECTION = "Fp4f823DUmtP114ACzNHZQgY2DjjviQgUELWXS7WyDSm"; // informative only

  // Optional: ?rpc=https://your-rpc...
  const urlRpc = new URLSearchParams(location.search).get("rpc");
  const RPC = urlRpc || "https://api.mainnet-beta.solana.com";

  // ---------- Helper UI ----------
  const logEl = document.getElementById("log");
  const st = (id, v) => (document.getElementById(id).textContent = v);
  const log = (msg) => { logEl.textContent += (logEl.textContent ? "\n" : "") + msg; logEl.scrollTop = logEl.scrollHeight; };

  st("stCM", CMID); st("stCG", CGID);
  document.getElementById("stCMsfm").href  = `https://solana.fm/address/${CMID}`;
  document.getElementById("stCMscan").href = `https://solscan.io/account/${CMID}`;

  // ---------- CDN bundles (reliable) ----------
  // We bundle the two wallet-adapter packages to avoid unresolved bare imports (@solana/errors, etc.)
  const CDN = (pkg, ver) => `https://esm.sh/${pkg}@${ver}?bundle&target=es2022`;
  const urls = {
    umiCore:      CDN("@metaplex-foundation/umi", "1.4.1"),
    defaults:     CDN("@metaplex-foundation/umi-bundle-defaults", "1.4.1"),
    tokenMeta:    CDN("@metaplex-foundation/mpl-token-metadata", "3.0.0"),
    candyMachine: CDN("@metaplex-foundation/mpl-candy-machine", "6.1.0"),
    toolbox:      CDN("@metaplex-foundation/mpl-toolbox", "0.11.4"),
    web3:         CDN("@solana/web3.js", "1.98.4"),

    // critical: bundled with explicit exports
    waSigner: CDN("@metaplex-foundation/umi-signer-wallet-adapters", "1.4.1") +
      "&exports=walletAdapterIdentity,walletAdapterIdentityPlugin,createWalletAdapterFromWallet,createWalletAdapter",
    w3Adapters: CDN("@metaplex-foundation/umi-web3js-adapters", "1.4.1") +
      "&exports=createSignerFromWalletAdapter,createSignerFromWallet"
  };

  const m = {};
  const imp = async (name, url) => (m[name] ??= await import(url));

  // ---------- Wallet + Umi setup ----------
  let umi;
  let identityReady = false;

  async function setupUmi() {
    const { createUmi } = await imp("defaults", urls.defaults);
    const { mplTokenMetadata } = await imp("tokenMeta", urls.tokenMeta);
    const { mplCandyMachine } = await imp("candyMachine", urls.candyMachine);
    const { signerIdentity, publicKey: pk, generateSigner, some } = await imp("umiCore", urls.umiCore);

    // make umi
    umi = createUmi(RPC).use(mplTokenMetadata()).use(mplCandyMachine());

    // try wallet-adapter identity (best UX)
    try {
      const wa = await imp("waSigner", urls.waSigner);
      const w3a = await imp("w3Adapters", urls.w3Adapters);
      if (window.solana) {
        const adapter = wa.createWalletAdapterFromWallet
          ? wa.createWalletAdapterFromWallet(window.solana)
          : window.solana; // fallback

        // plugin path (preferred)
        if (wa.walletAdapterIdentity) {
          umi.use(wa.walletAdapterIdentity(adapter));
          identityReady = true;
          st("stStatus", "Connected");
          return { pk, generateSigner, some }; // done
        }

        // signerIdentity fallback
        if (w3a.createSignerFromWalletAdapter) {
          const signer = w3a.createSignerFromWalletAdapter(adapter);
          umi.use(signerIdentity(signer));
          identityReady = true;
          st("stStatus", "Connected");
          return { pk, generateSigner, some };
        }
      }
    } catch(e) {
      // continue; identityReady stays false; we might still mint if wallet connects later
    }

    st("stStatus", "Disconnected");
    return { pk, generateSigner, some };
  }

  async function connectWallet() {
    try {
      if (!window.solana) {
        alert("No wallet found. Please install Phantom or a Solana wallet.");
        return;
      }
      await window.solana.connect();
      // re-setup umi to attach identity
      await setupUmi();
      // quick token-gate hint
      await checkCBSBalance();
    } catch (e) {
      alert("Wallet connection failed: " + (e?.message || e));
    }
  }

  // ---------- Token gate: ≥ 1 CBS ----------
  async function checkCBSBalance() {
    try {
      const web3 = await imp("web3", urls.web3);
      const conn = new web3.Connection(RPC, "confirmed");
      const owner = (await window.solana?.publicKey) || (umi?.identity?.publicKey);
      if (!owner) { log("Connect a wallet first."); return; }

      const ownerPK = (typeof owner === "string") ? new web3.PublicKey(owner) : owner;
      const mintPK  = new web3.PublicKey(CBS_MINT);
      const res = await conn.getParsedTokenAccountsByOwner(ownerPK, { mint: mintPK });
      let amount = 0n;
      for (const it of res.value) {
        const ui = it.account.data.parsed.info.tokenAmount.uiAmountString;
        amount += BigInt(Math.floor(parseFloat(ui || "0") * 1_000_000_000));
      }
      const holds = amount > 0n;
      log((holds ? "✅" : "❌") + ` Token gate OK: you ${holds ? "hold ≥ 1 CBS." : "do not hold CBS."}`);
      st("stCBS", holds ? "OK" : "—");
      return holds;
    } catch(e) {
      log("⚠️ Balance check failed: " + (e?.message || e));
      return false;
    }
  }

  // ---------- Mint ----------
  async function doMint() {
    const btn = document.getElementById("btnMint");
    btn.disabled = true;
    log("Preparing mint… (loading modules)");

    try {
      const { pk, generateSigner, some } = await setupUmi();
      if (!identityReady) {
        alert("Mint failed: wallet adapter not available.");
        log("❌ Mint failed: wallet adapter not available.");
        return;
      }

      // warm up CM + show ids
      const { fetchCandyMachine, mintV2 } = await imp("candyMachine", urls.candyMachine);
      const cm = await fetchCandyMachine(umi, pk(CMID));
      st("stMinted", String(cm.itemsRedeemed));
      st("stRemain", String(cm.data.itemsAvailable - cm.itemsRedeemed));

      // compute budget
      const tb = await imp("toolbox", urls.toolbox);
      tb.setComputeUnitLimit(umi, { units: 400_000 });
      tb.setComputeUnitPrice(umi, { microLamports: 10_000 });

      // mint account
      const nftMint = generateSigner(umi);

      // Candy Guard is token-gated (≥1 CBS). Pass mintArgs with the CBS mint.
      const txb = await (await imp("candyMachine", urls.candyMachine)).mintV2(umi, {
        candyMachine: pk(CMID),
        candyGuard:   pk(CGID),
        nftMint,
        // Important: tell the guard which SPL mint is used for the tokenGate
        mintArgs: { tokenGate: some({ mint: pk(CBS_MINT) }) }
      });

      const { signature } = await txb.sendAndConfirm(umi, { confirm: { commitment: "confirmed" } });
      log("✅ Minted! Tx:\n" + signature);
      alert("Mint successful!");
    } catch(e) {
      console.error(e);
      const msg = e?.message || String(e);
      alert("Mint failed: " + msg);
      log("❌ Mint failed: " + msg);
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- Wire up ----------
  document.getElementById("btnConnect").addEventListener("click", connectWallet);
  document.getElementById("btnCheck").addEventListener("click", checkCBSBalance);
  document.getElementById("btnMint").addEventListener("click", doMint);

  // initial paint
  (async () => {
    await setupUmi();           // sets stStatus + umi
    st("stStatus", identityReady ? "Connected" : "Disconnected");
    log("idle");
  })();
  </script>
</body>
</html>
