<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CBS Coin – Vrijheid & Welvaart</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #8b0000 0%, #2c0000 100%);
  }
  .coin {
    position: relative;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
    box-shadow: 0 0 50px rgba(255,215,0,0.8), inset 0 0 30px rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin img {
    width: 60%;
    height: auto;
    z-index: 2;
  }
  .coin::before {
    content: "自由  人人自由与财富  财富";
    position: absolute;
    width: 100%;
    height: 100%;
    font-size: 28px;
    font-weight: bold;
    font-family: "Noto Sans SC", sans-serif;
    color: #fff5cc;
    text-shadow: 0 0 8px #000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-15deg);
    animation: spinText 20s linear infinite;
    white-space: pre;
  }
  @keyframes spinText {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="coin">
    <img src="logo.png" alt="CBS Logo">
  </div>
</body>
</html>
